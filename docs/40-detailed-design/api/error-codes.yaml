  - code: "EDU-AUD-5002"
    module: "audit"
    http_status: 500
    level: "error"
    message: "运营访问记录查询失败：{reason}"
    trigger: "原型 audit-ops-access 场景"
    handling: "重试；记录访问本身留痕"
