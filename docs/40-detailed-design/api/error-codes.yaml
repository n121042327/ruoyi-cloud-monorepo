schema_version: "1.0"
purpose: 教育域统一错误码表（阶段 5 定义，阶段 6 / 7 实现）
conventions:
  format: "EDU-<MODULE>-<4 位序号>"
  ranges: "4001-4099 校验；5001-5099 执行失败；6xxx 权限细分；9xxx 系统级"
  request_id: "所有错误响应必须带 request_id，前端错误态同时展示错误码与请求编号"
statuses:
  - "已设计"
codes:
  - code: "EDU-STU-4001"
    module: "student"
    http_status: 409
    level: "error"
    message: "学号已存在（平台唯一）：{student_no}"
    trigger: "新增 / 修改学生时学号命中 `uk_student_no`"
    handling: "前端在学号输入框下方提示，保留其余已填内容"
    status: "已设计"
  - code: "EDU-STU-4002"
    module: "student"
    http_status: 409
    level: "error"
    message: "证件号已存在（平台唯一）：{id_card_no}"
    trigger: "证件号命中 `uk_id_card_no`"
    handling: "提示可能为重复建档，提供「按证件号检索」入口"
    status: "已设计"
  - code: "EDU-STU-4003"
    module: "student"
    http_status: 409
    level: "error"
    message: "该学生同一字段已有待审核申请：{field_name}"
    trigger: "命中 `uk_sfc_pending`"
    handling: "提示申请编号与提交时间，给出跳转到申请详情的入口"
    status: "已设计"
  - code: "EDU-STU-4004"
    module: "student"
    http_status: 400
    level: "error"
    message: "监护人绑定数量已达上限（3 人）"
    trigger: "绑定第 4 名监护人"
    handling: "提示先解绑；解绑需班主任确认"
    status: "已设计"
  - code: "EDU-STU-4005"
    module: "student"
    http_status: 400
    level: "error"
    message: "激活码不可用或已被使用"
    trigger: "条件更新影响行数为 0"
    handling: "提示联系班主任重置，不区分「不存在」与「已使用」"
    status: "已设计"
  - code: "EDU-STU-4006"
    module: "student"
    http_status: 403
    level: "error"
    message: "任课教师不可导出班级名单"
    trigger: "任课教师调用导出接口"
    handling: "功能权限直接拒绝；导出按钮对任课教师不渲染"
    status: "已设计"
  - code: "EDU-TCH-4001"
    module: "teacher"
    http_status: 409
    level: "error"
    message: "工号已存在（学校租户内唯一）：{teacher_no}"
    trigger: "命中 `uk_teacher_no`"
    handling: "提示工号占用；改工号走 `updateTeacherNo` 并留痕"
    status: "已设计"
  - code: "EDU-TCH-4002"
    module: "teacher"
    http_status: 409
    level: "error"
    message: "该任教关系已存在"
    trigger: "命中 `uk_assignment`"
    handling: "幂等场景直接视为成功；界面提示「已存在，未重复添加」"
    status: "已设计"
  - code: "EDU-TCH-4003"
    module: "teacher"
    http_status: 400
    level: "error"
    message: "该教师仍存在未结束的任职，不能离职"
    trigger: "离职校验发现任教关系 / 班主任 / 年级主任"
    handling: "返回阻塞清单与跳转入口，逐项解除后重试"
    status: "已设计"
  - code: "EDU-GRD-4001"
    module: "grade"
    http_status: 400
    level: "error"
    message: "年级序号超出学段范围：{stage_code} 允许 1-{max_level}"
    trigger: "学段序号映射校验（RV-GRD-03）"
    handling: "前端在年级序号选择器上限制可选值"
    status: "已设计"
  - code: "EDU-GRD-4002"
    module: "grade"
    http_status: 409
    level: "error"
    message: "同一学校同一学段已存在同名年级：{grade_name}"
    trigger: "命中 `uk_grade_name`"
    handling: "提示已存在年级，提供跳转"
    status: "已设计"
  - code: "EDU-GRD-4003"
    module: "grade"
    http_status: 400
    level: "error"
    message: "该年级仍有班级或学生，不能删除"
    trigger: "删除前引用检查"
    handling: "返回班级数 / 学生数，改为「归档」或先移出学生"
    status: "已设计"
  - code: "EDU-CLS-4001"
    module: "class"
    http_status: 409
    level: "error"
    message: "同一学年学期内该学生已属于行政班：{class_name}"
    trigger: "命中 `uk_class_member_admin`"
    handling: "提供「调班」入口而不是重复编班"
    status: "已设计"
  - code: "EDU-CLS-4002"
    module: "class"
    http_status: 409
    level: "error"
    message: "同一学期同一学段已存在同名班级：{class_name}"
    trigger: "命中 `uk_class_name`"
    handling: "提示占用，保留其余输入"
    status: "已设计"
  - code: "EDU-CLS-4003"
    module: "class"
    http_status: 400
    level: "error"
    message: "该班级仍有在读学生，不能删除"
    trigger: "删除前引用检查（BR-CLASS-006）"
    handling: "提示改为「停用」，并给出一键停用"
    status: "已设计"
  - code: "EDU-CLS-4004"
    module: "class"
    http_status: 409
    level: "error"
    message: "教学班生成冲突：同一组合已存在"
    trigger: "命中 `uk_class_teaching` / `uk_tclass_member`"
    handling: "按幂等处理，回显已存在教学班，不重复创建"
    status: "已设计"
  - code: "EDU-CLS-5004"
    module: "class"
    http_status: 500
    level: "error"
    message: "教学班生成任务执行失败：{reason}"
    trigger: "教学班生成异步任务失败（原型 teaching-class-list 场景）"
    handling: "任务中心可见，支持重试；重试复用幂等键"
    status: "已设计"
  - code: "EDU-PRM-4001"
    module: "promotion"
    http_status: 400
    level: "error"
    message: "源学期与目标学期必须连续"
    trigger: "升班任务创建校验"
    handling: "给出推荐目标学期"
    status: "已设计"
  - code: "EDU-PRM-4002"
    module: "promotion"
    http_status: 409
    level: "error"
    message: "该校同一源 / 目标学期已有执行中的升班任务"
    trigger: "并发执行保护"
    handling: "提示已有任务编号，跳转任务详情"
    status: "已设计"
  - code: "EDU-PRM-4003"
    module: "promotion"
    http_status: 400
    level: "error"
    message: "到顶年级不能继续升班，请走毕业流程"
    trigger: "小学 6 年级 / 初中 3 年级 / 高中 3 年级"
    handling: "引导到毕业异动入口"
    status: "已设计"
  - code: "EDU-PRM-5012"
    module: "promotion"
    http_status: 500
    level: "error"
    message: "升班预览计算失败：{reason}"
    trigger: "预览阶段数据异常（原型 promotion-preview 场景）"
    handling: "保留任务为草稿，可重新预览；错误详情写审计"
    status: "已设计"
  - code: "EDU-PRM-5021"
    module: "promotion"
    http_status: 400
    level: "error"
    message: "升班校验未通过：目标学期缺少班级结构"
    trigger: "执行前校验（原型 promotion-validate 场景）"
    handling: "返回缺失清单，跳转班级管理补齐"
    status: "已设计"
  - code: "EDU-PRM-5033"
    module: "promotion"
    http_status: 409
    level: "error"
    message: "升班任务正在执行，不能重复提交"
    trigger: "原型 promotion-execute 场景"
    handling: "展示任务进度与预计剩余时间"
    status: "已设计"
  - code: "EDU-PRM-5044"
    module: "promotion"
    http_status: 500
    level: "error"
    message: "升班结果导出失败：{reason}"
    trigger: "原型 promotion-result 场景"
    handling: "转异步导出，完成后在任务中心下载"
    status: "已设计"
  - code: "EDU-TRF-4001"
    module: "promotion"
    http_status: 400
    level: "error"
    message: "转学单缺少双方学校或状态不允许该操作"
    trigger: "转学单状态机校验"
    handling: "提示当前状态与可执行动作"
    status: "已设计"
  - code: "EDU-TRF-5001"
    module: "promotion"
    http_status: 500
    level: "error"
    message: "转学单创建失败：{reason}"
    trigger: "原型 promotion-transfer / student-cross-transfer 场景"
    handling: "保留草稿，可重试；错误写审计"
    status: "已设计"
  - code: "EDU-TRF-5002"
    module: "promotion"
    http_status: 500
    level: "error"
    message: "转学历史查询失败：{reason}"
    trigger: "原型 promotion-history 场景"
    handling: "缩小时间范围或转异步导出"
    status: "已设计"
  - code: "EDU-STR-4001"
    module: "stream"
    http_status: 400
    level: "error"
    message: "选科组合不合法：首选须为物理或历史，再选须在固定集合内"
    trigger: "RV-SUB-03 固定集合校验"
    handling: "前端用固定选项渲染，后端二次校验"
    status: "已设计"
  - code: "EDU-STR-4002"
    module: "stream"
    http_status: 400
    level: "error"
    message: "选科变更已超过截止时间，需校级管理员审批"
    trigger: "截止时间可配置，逾期需审批（已确认口径）"
    handling: "引导提交带审批的变更申请"
    status: "已设计"
  - code: "EDU-STR-4003"
    module: "stream"
    http_status: 400
    level: "error"
    message: "非高中学生不参与 3+1+2 选科"
    trigger: "学段校验"
    handling: "不渲染选科入口"
    status: "已设计"
  - code: "EDU-STR-5001"
    module: "stream"
    http_status: 500
    level: "error"
    message: "选科配置保存失败：{reason}"
    trigger: "原型 stream-config 场景"
    handling: "保留表单内容，可重试；失败原因写审计"
    status: "已设计"
  - code: "EDU-STR-5002"
    module: "stream"
    http_status: 500
    level: "error"
    message: "选科提交失败：{reason}"
    trigger: "原型 stream-selection 场景"
    handling: "保留已选内容，提示重试"
    status: "已设计"
  - code: "EDU-STR-5003"
    module: "stream"
    http_status: 500
    level: "error"
    message: "选科名单查询失败：{reason}"
    trigger: "原型 stream-list 场景"
    handling: "缩小范围或稍后重试"
    status: "已设计"
  - code: "EDU-STR-5004"
    module: "stream"
    http_status: 500
    level: "error"
    message: "选科统计失败：{reason}"
    trigger: "原型 stream-stat 场景（统计与明细同口径，DS-DENY-08）"
    handling: "范围过大时转异步"
    status: "已设计"
  - code: "EDU-STR-5005"
    module: "stream"
    http_status: 409
    level: "error"
    message: "该变更申请已被处理，不能重复审批"
    trigger: "原型 stream-approve 场景的状态机保护"
    handling: "刷新申请详情，展示最终状态"
    status: "已设计"
  - code: "EDU-STR-5006"
    module: "stream"
    http_status: 500
    level: "error"
    message: "教学班生成失败：{reason}"
    trigger: "原型 stream-generate-class 场景"
    handling: "任务重试复用幂等键，不产生半成品"
    status: "已设计"
  - code: "EDU-SUB-4001"
    module: "subject"
    http_status: 409
    level: "error"
    message: "学科编码已存在（租户内唯一）：{subject_code}"
    trigger: "命中 `uk_subject_code`"
    handling: "提示编码占用"
    status: "已设计"
  - code: "EDU-SUB-4002"
    module: "subject"
    http_status: 409
    level: "error"
    message: "学科名称已存在：{subject_name}"
    trigger: "命中 `uk_subject_name`"
    handling: "提示占用"
    status: "已设计"
  - code: "EDU-SUB-4003"
    module: "subject"
    http_status: 400
    level: "error"
    message: "该学科已被引用，不能停用"
    trigger: "引用检查发现任教关系 / 选科结果"
    handling: "返回引用清单与跳转入口"
    status: "已设计"
  - code: "EDU-SUB-5001"
    module: "subject"
    http_status: 500
    level: "error"
    message: "学科数据加载失败：{reason}"
    trigger: "原型 subject-list 场景"
    handling: "重试；持续失败进入只读降级"
    status: "已设计"
  - code: "EDU-ORG-4001"
    module: "school"
    http_status: 409
    level: "error"
    message: "该租户已绑定学校"
    trigger: "命中 `uk_school_tenant`（BR-ORG-001）"
    handling: "一个租户对应一个学校，不允许新增第二个"
    status: "已设计"
  - code: "EDU-ORG-4002"
    module: "school"
    http_status: 409
    level: "error"
    message: "校区编码 / 名称重复：{value}"
    trigger: "命中 `uk_campus_code` / `uk_campus_name`"
    handling: "提示占用"
    status: "已设计"
  - code: "EDU-ORG-4003"
    module: "school"
