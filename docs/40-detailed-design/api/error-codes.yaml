    status: "已设计"
  - code: "EDU-ORG-5001"
    module: "school"
    http_status: 500
    level: "error"
    message: "学校列表加载失败：{reason}"
    trigger: "原型 school-list 场景"
    handling: "重试；错误写审计"
    status: "已设计"
  - code: "EDU-ORG-5002"
    module: "school"
    http_status: 500
    level: "error"
    message: "校区保存失败：{reason}"
    trigger: "原型 school-campus 场景"
    handling: "保留表单，可重试"
    status: "已设计"
  - code: "EDU-ORG-5010"
    module: "school"
    http_status: 400
    level: "error"
