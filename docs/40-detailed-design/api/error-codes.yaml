  - code: "EDU-TERM-4002"
    module: "term"
    http_status: 400
    level: "error"
    message: "学期日期必须落在所属学年范围内"
    trigger: "学期日期校验"
    handling: "按学年范围限制日期选择器"
    status: "已设计"
  - code: "EDU-TERM-5003"
    module: "term"
    http_status: 500
    level: "error"
    message: "学年保存失败：{reason}"
    trigger: "原型 term-list 场景"
    handling: "保留表单，可重试"
    status: "已设计"
  - code: "EDU-TERM-5004"
    module: "term"
    http_status: 500
    level: "error"
    message: "学期保存失败：{reason}"
    trigger: "原型 term-terms 场景"
    handling: "保留表单，可重试"
    status: "已设计"
  - code: "EDU-TERM-5031"
    module: "term"
    http_status: 409
    level: "error"
    message: "目标学期不可用：已归档或不存在"
    trigger: "原型 promotion-create 场景"
