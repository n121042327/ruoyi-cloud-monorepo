        '500':
          description: 服务异常（返回请求编号）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
      parameters:
      - name: pageNum
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
