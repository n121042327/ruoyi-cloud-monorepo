          application/json:
            schema:
              $ref: '#/components/schemas/term_Request'
  /edu/term/year/{id}/archive/revoke:
    post:
      tags:
      - term
      operationId: revokeArchiveAcademicYear
      summary: 撤销归档
      description: '撤销归档


        - 权限资源：`org.term`（动作映射规则见 06-api-catalog.md 第 2 节）

        - 同步 / 异步：同步

        - 请求与响应字段：见 `docs/10-prd/06-field-dictionary.yaml` 与该模块 PRD 第 7 节

        - 数据范围：接口层按 `DataScopeResolver` 解析后注入（见 30-architecture/09-permission-architecture.md）'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '400':
          description: 参数或业务规则校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '401':
          description: 未登录或令牌失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '403':
          description: 功能权限或数据范围拒绝（DS-DENY-01 / 02）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '500':
          description: 服务异常（返回请求编号）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: 主键一律序列化为字符串（禁止前端 Number() 转换，见 06-field-dictionary 的 id 说明）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/term_Request'
components:
