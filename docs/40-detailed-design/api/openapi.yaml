  title: K12 教育 ToB 平台 · 教育域接口
  version: 1.0.0
  description: '由 `tools/gen_api_and_map.py` 从 `docs/30-architecture/06-api-catalog.md` 生成，接口行不可手工编辑；新增接口先改模块 PRD 第 8 节。


    - 网关前缀：`/api`（servers 已写入）

    - 鉴权：Sa-Token Bearer；功能权限见 `docs/10-prd/05-permission-matrix.yaml`

    - 数据范围：见 `docs/30-architecture/09-permission-architecture.md`

    - 主键：统一序列化为字符串

