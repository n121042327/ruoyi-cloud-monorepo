      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '400':
          description: 参数或业务规则校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
