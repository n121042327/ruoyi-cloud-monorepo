      description: 统一响应信封。错误码见 api/error-codes.yaml；requestId 用于排障（原型里的请求编号就是这个字段）
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
        data: {}
        requestId:
          type: string
          description: 请求编号，异常时返回给前端展示
      required:
      - code
      - msg
    PageResult:
      type: object
      description: 分页结果；列表类接口的 data 结构
      properties:
        total:
          type: integer
        rows:
          type: array
          items: {}
        pageNum:
          type: integer
        pageSize:
          type: integer
      required:
      - total
      - rows
