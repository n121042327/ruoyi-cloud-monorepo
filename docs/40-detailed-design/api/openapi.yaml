- name: promotion
  description: 升班与学籍异动
- name: school
  description: 学校与租户
- name: stream
  description: 3+1+2 选科与教学班
- name: student
  description: 学生管理
- name: subject
  description: 学科与配置
- name: teacher
  description: 教师管理
- name: term
  description: 学年学期
