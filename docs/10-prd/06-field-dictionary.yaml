schema_version: "1.0"
purpose: |
  全局字段字典。任何模块 PRD、原型表单、接口契约、数据库迁移脚本中的字段，
  都必须能在这里找到定义，或在此登记新增。字段命名以本文件的 name 为准。

common_columns:
  - name: id
    type: bigint
    required: true
    note: 主键。后端序列化为字符串返回，前端一律按 string 处理，禁止 Number() 转换
  - name: tenant_id
    type: varchar(20)
    required: false
    note: |
      租户隔离键。学校级及以下的教育表必须携带，且所有查询必须带该条件。
      例外：平台级实体（`edu_student` 学生主体、`edu_guardian` 监护人主体）不参与学校租户隔离，
      不设该列，见 D-037、D-030；这两张表的访问改用平台级数据权限 + 两段式查询（DS-DENY-07）。
      详见 NFR-SEC-01 的平台级实体例外条款。
  - name: school_id
    type: bigint
    required: false
    note: 学校归属。学校级及以下的数据必须携带
  - name: create_by
    type: bigint
    required: true
  - name: create_time
    type: datetime
    required: true
  - name: update_by
    type: bigint
    required: false
  - name: update_time
    type: datetime
    required: false
  - name: del_flag
    type: char(1)
    required: true
    default: "0"
    note: "0 存在，1 删除。历史与学籍类表禁止物理删除"

enums:
  - name: tenant_type
    name_cn: 租户类型
    entries:
      - { code: operator, label: 运营方（超级租户）, level: 0 }
      - { code: group, label: 集团, level: 1 }
      - { code: school, label: 学校, level: 2 }
    note: 层级不超过三级，见 BR-ORG-001 与 BR-ORG-003

  - name: gender
    entries:
      - { code: "1", label: 男 }
      - { code: "2", label: 女 }
      - { code: "0", label: 未知 }

  - name: stage_code
    name_cn: 学段
    entries:
      - { code: primary, label: 小学, grade_range: "1-6" }
      - { code: junior, label: 初中, grade_range: "1-3" }
      - { code: senior, label: 高中, grade_range: "1-3" }
    note: 年级与学段的对应关系固定，见 BR-GRADE-001 / BR-GRADE-006

  - name: enrollment_status
    name_cn: 学籍状态（描述一条在校记录的状态，不是学生主体）
    entries:
      - { code: pending_enroll, label: 转入未报到, terminal: false }
      - { code: enrolled, label: 在读, terminal: false }
      - { code: suspended, label: 休学, terminal: false }
      - { code: studying_abroad, label: 出国, terminal: false }
      - { code: missing, label: 失踪, terminal: false }
      - { code: transferred_out, label: 已转出, terminal: true }
      - { code: graduated, label: 毕业, terminal: true }
      - { code: course_completed, label: 结业, terminal: true }
      - { code: course_incomplete, label: 肄业, terminal: true }
      - { code: expelled, label: 开除, terminal: true }
      - { code: withdrawn, label: 退学, terminal: true }
      - { code: deceased, label: 死亡, terminal: true }
    note: |
      跨校转入不在原学校记录上变更状态，而是在目标学校新建一条在校记录：
      转入校接收时初始状态为 pending_enroll（转入未报到），学生实际报到后转为 enrolled。
      见 BR-STU-002、BR-STU-023 与 BR-PROMO-011。
      共 12 个状态，其中 7 个为终态：已转出、毕业、结业、肄业、开除、退学、死亡。终态互不可转（BR-PROMO-010）。
      学段限制：义务教育阶段（小学、初中）不得开除，也不适用结业与肄业，见 BR-STU-024 与 BR-STU-027。
      死亡状态涉及隐私，见 BR-STU-028。
    transitions:
      - { from: "（转入接收）", to: pending_enroll, action: transfer_in_accept }
      - { from: pending_enroll, to: enrolled, action: check_in }
      - { from: enrolled, to: suspended, action: suspend }
      - { from: suspended, to: enrolled, action: resume }
      - { from: enrolled, to: studying_abroad, action: study_abroad }
      - { from: studying_abroad, to: enrolled, action: resume_from_abroad }
      - { from: enrolled, to: missing, action: report_missing }
      - { from: missing, to: enrolled, action: found }
      - { from: missing, to: withdrawn, action: withdraw_after_missing }
      - { from: enrolled, to: transferred_out, action: transfer_out }
      - { from: enrolled, to: graduated, action: graduate }
      - { from: enrolled, to: course_completed, action: complete_course }
      - { from: enrolled, to: course_incomplete, action: incomplete_course }
      - { from: enrolled, to: withdrawn, action: withdraw }
      - { from: enrolled, to: expelled, action: expel }
      - { from: suspended, to: expelled, action: expel }
      - { from: suspended, to: withdrawn, action: withdraw }
      - { from: enrolled, to: deceased, action: deceased }
      - { from: suspended, to: deceased, action: deceased }
      - { from: pending_enroll, to: deceased, action: deceased }
      - { from: "（新建记录）", to: enrolled, action: enroll }
    forbidden_transitions:
      - { from: graduated, to: withdrawn, reason: BR-PROMO-010 终态不可互转 }
      - { from: withdrawn, to: graduated, reason: BR-PROMO-010 }
      - { from: graduated, to: expelled, reason: BR-PROMO-010 终态不可互转 }
      - { from: course_completed, to: graduated, reason: BR-PROMO-010 终态不可互转 }
      - { from: course_incomplete, to: graduated, reason: BR-PROMO-010 终态不可互转 }
      - { from: course_completed, to: enrolled, reason: BR-PROMO-010 终态不可互转 }
      - { from: course_incomplete, to: enrolled, reason: BR-PROMO-010 终态不可互转 }
      - { from: expelled, to: enrolled, reason: BR-PROMO-010 终态不可互转 }
      - { from: expelled, to: suspended, reason: BR-PROMO-010 终态不可互转 }
      - { from: deceased, to: enrolled, reason: BR-PROMO-010 终态不可互转 }
      - { from: transferred_out, to: enrolled, reason: 跨校转入在目标学校新建记录，不在原记录上复活 }
      - { from: pending_enroll, to: transferred_out, reason: 未报到学生由转入校撤销接收（逻辑删除该在校记录），不产生转出记录 }
      - { from: pending_enroll, to: graduated, reason: 未报到不产生毕业，见 BR-STU-023 }
      - { from: pending_enroll, to: expelled, reason: 未报到不产生开除，见 BR-STU-023 }
      - { from: pending_enroll, to: course_completed, reason: 未报到不产生结业，见 BR-STU-023 }
      - { from: pending_enroll, to: course_incomplete, reason: 未报到不产生肄业，见 BR-STU-023 }

  - name: class_type
    name_cn: 班级类型
    entries:
      - { code: administrative, label: 行政班 }
      - { code: teaching, label: 教学班 }
    note: 行政班与教学班是独立关系，见 BR-CLASS-001

  - name: edu_role
    name_cn: 教育角色
    entries:
      - { code: school_leader, label: 校领导 }
      - { code: academic_director, label: 教务主任 }
      - { code: grade_leader, label: 年级主任 }
      - { code: homeroom, label: 班主任 }
      - { code: subject_teacher, label: 任课教师 }
    note: 与系统权限角色不同；教育角色决定数据范围

  - name: subject_code
    name_cn: 学科编码
    entries:
      - { code: chinese, label: 语文, stream_role: none }
      - { code: math, label: 数学, stream_role: none }
      - { code: english, label: 外语, stream_role: none }
      - { code: physics, label: 物理, stream_role: primary }
      - { code: history, label: 历史, stream_role: primary }
      - { code: chemistry, label: 化学, stream_role: secondary }
      - { code: biology, label: 生物, stream_role: secondary }
      - { code: politics, label: 思想政治, stream_role: secondary }
      - { code: geography, label: 地理, stream_role: secondary }
    note: 首选科目为物理/历史，再选科目为化学/生物/思想政治/地理，见 BR-SUBJECT-003

  - name: stream_request_status
    name_cn: 选科变更申请状态
    entries:
      - { code: draft, label: 草稿 }
      - { code: pending, label: 待审批 }
      - { code: approved, label: 已通过 }
      - { code: rejected, label: 已驳回 }
      - { code: cancelled, label: 已撤销 }
    transitions:
      - { from: draft, to: pending }
      - { from: pending, to: approved }
      - { from: pending, to: rejected }
      - { from: pending, to: cancelled }

  - name: promotion_task_status
    name_cn: 升班任务状态
    entries:
      - { code: draft, label: 草稿 }
      - { code: previewed, label: 已预览待确认 }
      - { code: validating, label: 校验中 }
      - { code: running, label: 执行中 }
      - { code: succeeded, label: 已完成 }
      - { code: partial_failed, label: 部分失败 }
      - { code: failed, label: 失败 }
      - { code: cancelled, label: 已取消 }

  - name: async_task_status
    name_cn: 异步任务状态
    entries:
      - { code: queued, label: 排队中 }
      - { code: running, label: 执行中 }
      - { code: succeeded, label: 成功 }
      - { code: partial_failed, label: 部分失败 }
      - { code: failed, label: 失败 }
      - { code: cancelled, label: 已取消 }

  - name: data_scope_type
    name_cn: 数据范围类型
    entries:
      - { code: platform, label: 全平台, level: 0 }
      - { code: tenant_org, label: 租户组织, level: 1 }
      - { code: group_own, label: 集团自有, level: 2 }
      - { code: school, label: 本校, level: 3 }
      - { code: grade, label: 本年级, level: 4 }
      - { code: class, label: 本班, level: 5 }
      - { code: teaching_class, label: 任教班级, level: 5 }
      - { code: self, label: 本人, level: 6 }
      - { code: self_children, label: 本人子女, level: 6 }

  - name: async_task_type
    name_cn: 异步任务类型
    entries:
      - { code: import, label: 批量导入 }
      - { code: export, label: 导出 }
      - { code: promotion, label: 学年升级 }
      - { code: audit_archive, label: 审计日志归档 }
    note: 任务类型由发起模块声明；任务中心只负责调度、进度、结果与重试

  - name: audit_action_type
    name_cn: 操作类型（审计）
    entries:
      - { code: create, label: 新增 }
      - { code: update, label: 修改 }
      - { code: delete, label: 删除 }
      - { code: import, label: 导入 }
      - { code: execute, label: 执行 }
      - { code: approve, label: 审批 }
      - { code: grant, label: 授权 }
      - { code: status_change, label: 状态变更 }
      - { code: export, label: 导出 }
      - { code: view_sensitive, label: 查看敏感字段全量 }
      - { code: login, label: 登录与安全事件 }

  - name: file_kind
    name_cn: 文件类型
    entries:
      - { code: import_template, label: 导入模板 }
      - { code: import_result, label: 导入结果 }
      - { code: failed_rows, label: 失败明细 }
      - { code: export_result, label: 导出结果 }

fields:
  - { name: student_no, cn: 学号, type: varchar(32), required: true, unique_scope: platform, br: BR-STU-001, format: "入学年份(4) + 全局序号(6)", note: 系统统一发号；永不回收；导入时忽略源学号；修改需校级管理员且留审计 }
  - { name: national_student_no, cn: 全国学籍号, type: varchar(64), required: false, unique_scope: platform, br: BR-STU-022, note: 官方 G / L 开头号码，允许为空，非空时全平台唯一 }
  - { name: student_name, cn: 学生姓名, type: varchar(50), required: true }
  - { name: id_type, cn: 证件类型, type: varchar(20), required: false }
  - { name: id_card_no, cn: 证件号码, type: varchar(64), required: false, unique_scope: platform, sensitive: true, br: BR-STU-008, note: 允许为空，非空时全平台唯一 }
  - { name: birth_date, cn: 出生日期, type: date, required: false, sensitive: true }
  - { name: enroll_year, cn: 入学年份, type: smallint, required: true }
  - { name: graduation_date, cn: 毕业日期, type: date, required: false }

  - { name: teacher_no, cn: 工号, type: varchar(32), required: true, unique_scope: tenant, br: BR-TEACHER-007 }
  - { name: teacher_name, cn: 教师姓名, type: varchar(50), required: true }

  - { name: login_name, cn: 登录名, type: varchar(64), required: true, unique_scope: platform, note: 全局唯一，学生为 s + 学号，见 BR-ACCOUNT-002 }
  - { name: root_tenant_id, cn: 根租户, type: varchar(20), required: true, note: 学校租户向上追溯到的最高集团租户；无集团时为自身，见 BR-ORG-012 }
  - { name: parent_tenant_id, cn: 上级租户, type: varchar(20), required: false, note: 运营方为空；集团指向运营方；学校指向集团 }

  - { name: guardian_name, cn: 监护人姓名, type: varchar(50), required: true }
  - { name: relation, cn: 与监护人关系, type: varchar(20), required: true }
  - { name: guardian_phone, cn: 监护人电话, type: varchar(20), required: false, sensitive: true }
  - { name: student_phone, cn: 学生电话, type: varchar(20), required: false, sensitive: true }
  - { name: photo_file_id, cn: 学生照片, type: bigint, required: false, sensitive: true, note: 只存文件服务引用；列表与详情默认展示缩略图，查看原图需 read_sensitive 并写访问日志；单张，支持上传与导入（CR-003 / GAP-027） }
  - { name: is_primary, cn: 是否主要联系人, type: tinyint, required: true, default: "0", note: 同一学生最多一条为 1；与 relation 同在 edu_guardian_student（CR-003 / GAP-029） }
  - { name: bind_status, cn: 监护人绑定状态, type: varchar(20), required: true, note: 待审核 / 已通过 / 已驳回 / 已解绑（CR-003 / GAP-029） }
  - { name: remark, cn: 备注, type: varchar(500), required: false, note: 通用备注字段；监护人、联系方式、离职登记共用（CR-003 / GAP-029） }
  - { name: enroll_date, cn: 入学日期, type: date, required: false, note: 默认取学年开始日期（CR-003 / GAP-029） }
  - { name: field_name, cn: 变更字段名, type: varchar(64), required: true, note: 学生资料变更申请的字段标识（CR-003 / GAP-029） }
  - { name: address, cn: 联系地址, type: varchar(200), required: false, sensitive: true }

  - { name: academic_year_code, cn: 学年编码, type: varchar(9), required: true, format: "YYYY-YYYY", br: BR-TERM-003 }
  - { name: term_code, cn: 学期编码, type: varchar(20), required: true }
  - { name: start_date, cn: 开始日期, type: date, required: true }
  - { name: end_date, cn: 结束日期, type: date, required: true }
  - { name: is_current, cn: 是否当前, type: tinyint, required: true, note: 同一学校同一时间只能有一个 1，见 BR-TERM-002 }

  - { name: grade_name, cn: 年级名称, type: varchar(50), required: true }
  - { name: grade_level, cn: 学段内序号, type: tinyint, required: true, note: 与 stage_code 共同确定年级 }
  - { name: class_name, cn: 班级名称, type: varchar(50), required: true, br: BR-CLASS-003 }
  - { name: class_capacity, cn: 班级容量, type: smallint, required: false, note: 仅提示，不强制校验，见 BR-CLASS-005 }
  - { name: head_teacher_id, cn: 班主任, type: bigint, required: false }

  - { name: primary_subject_code, cn: 首选科目, type: varchar(20), required: true, enum_ref: subject_code, br: BR-STREAM-001 }
  - { name: secondary_subject_codes, cn: 再选科目, type: varchar(64), required: true, note: 两个编码以逗号分隔，需校验数量为 2，见 BR-STREAM-002 }
  - { name: stream_deadline, cn: 选科截止日期, type: datetime, required: false, br: BR-STREAM-004 }

  - { name: change_type, cn: 变更类型, type: varchar(30), required: true }
  - { name: effective_date, cn: 生效日期, type: date, required: true }
  - { name: reason, cn: 原因, type: varchar(500), required: false }
  - { name: before_value, cn: 变更前值, type: json, required: false }
  - { name: after_value, cn: 变更后值, type: json, required: false }

  - { name: task_no, cn: 任务编号, type: varchar(32), required: true, unique_scope: platform, br: BR-IMP-014, note: 异步任务对外标识，全局唯一 }
  - { name: task_type, cn: 任务类型, type: varchar(30), required: true, enum_ref: async_task_type, br: BR-IMP-014 }
  - { name: task_status, cn: 任务状态, type: varchar(20), required: true, enum_ref: async_task_status, br: BR-IMP-014 }
  - { name: progress_percent, cn: 进度, type: tinyint, required: false, note: 0—100，仅在 running 状态有意义 }
  - { name: batch_no, cn: 批次号, type: varchar(32), required: false, unique_scope: platform, br: BR-IMP-009, note: 导入批次幂等键，全局唯一 }
  - { name: template_version, cn: 模板版本, type: varchar(20), required: false, br: BR-IMP-007 }
  - { name: file_id, cn: 文件引用, type: bigint, required: false, note: 只存文件服务的引用，不存二进制 }
  - { name: file_kind, cn: 文件类型, type: varchar(20), required: false, enum_ref: file_kind }
  - { name: file_expire_time, cn: 文件有效期, type: datetime, required: false, br: BR-IMP-013, note: 到期后文件清理，访问链接失效 }
  - { name: action_type, cn: 操作类型, type: varchar(30), required: true, enum_ref: audit_action_type, br: BR-AUDIT-006 }
  - { name: object_type, cn: 对象类型, type: varchar(50), required: true, br: BR-AUDIT-008 }
  - { name: object_id, cn: 对象标识, type: varchar(64), required: true, br: BR-AUDIT-008 }
  - { name: client_ip, cn: 来源 IP, type: varchar(45), required: false, br: BR-AUDIT-002 }
  - { name: request_id, cn: 请求标识, type: varchar(64), required: false, note: 与结构化日志串联，便于排障 }
  - { name: operator_role, cn: 操作人角色, type: varchar(64), required: false, br: BR-AUDIT-001, note: 记录操作发生时的角色快照，不随角色变更而改变 }
  - { name: change_diff, cn: 变更差异, type: json, required: false, br: BR-AUDIT-002, note: 只记录发生变化的字段，不记录全量快照 }

unique_keys:
  - { table: edu_student, columns: [student_no], br: BR-STU-001, note: 学号全平台唯一，由系统统一发号，序号按年重置 }
  - { table: edu_student, columns: [id_card_no], br: BR-STU-008, note: 允许为空，非空时全平台唯一 }
  - { table: edu_guardian, columns: [phone], br: BR-ACCOUNT-011 }
  - { table: edu_guardian_student, columns: [guardian_id, student_id], br: BR-ACCOUNT-005 }
  - { table: edu_student, columns: [national_student_no], br: BR-STU-022, note: 允许为空，非空时全平台唯一 }
  - { table: edu_teacher, columns: [tenant_id, teacher_no], br: BR-TEACHER-007 }
  - { table: edu_school, columns: [parent_tenant_id, school_code], br: BR-ORG-011 }
  - { table: edu_guardian_student, columns: [guardian_id, student_id, relation], br: BR-ACCOUNT-005 }
  - { table: edu_academic_year, columns: [tenant_id, school_id, academic_year_code], br: BR-TERM-003 }
  - { table: edu_class, columns: [school_id, term_id, stage_code, class_name], br: BR-CLASS-003 }
  - { table: edu_student_class, columns: [term_id, student_id, class_type], note: 仅对行政班生效，见 BR-STU-003 }
  - { table: edu_student_stream, columns: [term_id, student_id], br: BR-STREAM-007 }

index_conventions:
  - rule: 所有教育表的主查询条件第一列必须带 tenant_id 或 school_id 作为前缀索引
  - rule: 列表页的筛选组合必须能命中索引，索引在实际查询场景确定后再建
  - rule: 禁止在低基数列（如 del_flag、gender）上单独建索引
  - rule: 逻辑删除的表使用 del_flag，唯一键需考虑删除后的复用策略，方案在详细设计阶段确定
