- id: CHK-ORPHAN-PROTO
  rule: 原型中每个页面与状态都能追溯到至少一条 REQ
- id: CHK-ORPHAN-API
  rule: OpenAPI 中每个 operationId 都能追溯到至少一条 REQ
- id: CHK-ORPHAN-TABLE
  rule: 每张教育表都能追溯到至少一个领域对象
- id: CHK-ORPHAN-CODE
  rule: 前端每个页面与后端每个 Controller 方法都能追溯到 REQ
- id: CHK-PERMISSION
  rule: 每条 REQ 都声明数据范围，且对应越权测试用例存在
- id: CHK-PROMOTION-IDEMPOTENT
  rule: 升班、选科相关的每条 REQ 都有幂等与并发测试用例
