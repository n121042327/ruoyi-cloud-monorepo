  - id: GAP-116
    title: 教师导入模板缺「登录名」列，导入后的教师账号如何开通未定义
    discovered_at: 2026-10-10
    discovered_by: GAP-094 第四批其三（教师导入执行器，CR-146）
    evidence: "docs/10-prd/modules/teacher/PRD.md 第 4.8 节「导入模板列」9 列为 工号/姓名/性别/所属学校/手机号/邮箱/入职日期/教育角色/备注 —— 没有登录名；同文档 04-business-rules 的 BR-ACCOUNT-001 规定「教师与管理人员使用系统账号登录，登录名由学校统一分配，规则沿用现有基线」；REQ-TCH-018 则要求「保存成功后自动创建教师登录账号」。EduTeacherServiceImpl.insertByBo 只在入参带 loginName 时才调用 RemoteUserService.registerUserInfo 建账号，因此导入（以及教师页新增，表单也没有登录名输入）都不会建账号"
    expected: 导入完成后的教师能有系统账号可用，且登录名与初始密码规则符合学校口径
    actual: 导入只建教师档案与教育角色，不建账号；账号需要管理员后续开通
    impact: |
      **不选会怎样**：导入进来的教师无法登录；若由实现者自行编排登录名与初始密码，
      等于凭空定下两条安全策略（谁能猜到登录名、初始口令多强），与「学校统一分配」冲突且难以收回。
    options:
      - "教师导入模板增加「登录名」「初始密码」两列（阶段 1 产物新版本，需确认），导入时按列建账号（推荐）"
      - "导入后由管理员在教师页逐个开通账号（现状，功能可用但量大时费时）"
      - "由学校统一规则自动生成登录名（如登录名 = 工号、初始密码 = 手机号后六位）——需要用户确认这条安全策略"
    recommended: |
      **推荐方案 1**：模板加列最贴近 BR-ACCOUNT-001 的「学校统一分配」，且与导入「一行一个教师」的形态一致；
      同时把「初始密码」也交给学校填写（或下发一次性激活码，与学生的 BR-ACCOUNT-003 同思路）。
      影响面：教师 PRD 4.8 表格、教师导入页模板说明、`TeacherImportHandler.templateHeaders()`、
      `TeacherImportExecutor` 建账号分支。**在用户确认前保持现状**（导入只建档），并在导入结果与页面提示里
      说明「账号需另行开通」。
    blocking: false
    blocks_stages:
      - stage8
    owner: 用户
    status: open
  - id: GAP-117
    title: 组件内的表格未全部纳入页面结构对照（11 张表缺可用原型）
    discovered_at: 2026-10-10
    discovered_by: 第三轮队列第 5 项（CR-149）
    evidence: "全库扫描 apps/plus-ui/src/views/edu 下含 el-table-column label 的 .vue：共 15 张组件表此前不在 tools/check_fe_page_structure.py 的对照清单里。CR-149 已纳入 4 张（TaskRowsDialog / LogDetailDrawer / CheckResultTable / SubjectStatTable），其余 11 张找不到可对照的原型表：ArchiveSearchDialog、GradeLeaderDialog、GradePromotionDialog、TeacherRoleDialog、GuardianTable、AssignmentTable、StreamHistoryDialog、TeachingClassDetailDrawer、UnselectedStudentDialog、cls_detail 的 TeachingAssignmentTable 与 ClassChangeLogTable（后两者原型表没有 data-role 列标记）"
    expected: 每张有列定义的组件表都与原型表逐列对照
    actual: 4 张已对照；其余 11 张没有可用原型表（原型缺表 / 原型表无列标记 / 首列相同但语义不同）
    impact: |
      **不选会怎样**：这些表的列序与列名变更不会被任何门禁拦住；为了凑覆盖率硬对到语义不同的原型表上，
      则会得到「看起来有门禁、实际比错对象」的假覆盖。已发现的具体例子：`cls_detail` 的任课教师表
      在原型里是左侧选择面板（只有一个「教师」列），班级详情的变更记录表在原型里没有列标记。
    options:
