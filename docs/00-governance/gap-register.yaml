    impact: 阶段 6 的"通过"判定不能只看命令退出码，必须与基线错误数对比
    resolution: 按 decisions.md D-024 执行"新增代码零错误 + 既有错误数不增加"，上游清理单独排期
    blocking: false
    blocks_stages: []
    owner: 我方
    status: answered

