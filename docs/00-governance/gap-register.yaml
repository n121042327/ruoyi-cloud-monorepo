  - id: GAP-021
    title: 学生初始密码策略未确认
    discovered_at: 2026-09-30
    discovered_by: 批次 1-1 学生管理 PRD 撰写
    evidence: BR-ACCOUNT-003 至今仍标注 [待确认]
    expected: 明确学生初始密码如何产生、如何下发、是否强制首改
    actual: 未定义
