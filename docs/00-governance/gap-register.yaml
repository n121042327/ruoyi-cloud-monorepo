  - id: GAP-019
    title: 学生主体是平台级还是学校租户级，上游表述互相矛盾
    discovered_at: 2026-09-30
    discovered_by: 批次 1-1 学生管理 PRD 撰写
    evidence: |
      BR-STU-001 规定学号全平台唯一、BR-STU-020 规定跨校转学学号不变、
      BR-STU-002 却写"一名学生在一个租户内只有一条学生主体记录"，
      而 docs/10-prd/09-guardian-and-onboarding.md 给 edu_student 定义了 tenant_id = 学校租户 ID。
      三者不能同时成立：学生主体若绑定学校租户，跨校转学就必须改行的 tenant_id 或新建行，
      与"不新建学生"矛盾。
    expected: 明确学生主体是平台级实体，还是学校租户级实体；以及跨校转学的数据动作
    actual: 未定义
    impact: |
      决定阶段 5 的表结构：学生主体与在校记录是否拆表、唯一键列组合、
      导入去重规则、跨校转学的写入路径。也决定 NFR-SEC-01 中"所有教育数据查询必须带 tenant_id"
      对学生主表是否成立。
    options:
      - 1a 学生主体为平台级且**不设 tenant_id 列**，把该表加入租户拦截器忽略表，单独实现平台级数据权限；
        学校侧只能经在校记录 / 班级关系两段式取数。语义最干净，报表需 join 在校记录才能得知当前学校
      - 1b 学生主体为平台级但**保留 tenant_id 作为"当前所在学校"冗余列**（同样加入忽略表，不参与隔离），
        跨校转学时更新该列，历史由在校记录承载。需要显式标注"此列不参与隔离"，否则会被误用
      - 1c 学生主体的 tenant_id 填运营方租户 ID。**不推荐**：学校用户的租户上下文是学校租户，
        自动租户过滤会把行的 tenant_id 与上下文比对而导致学校用户查不到任何学生；
        绕开的方式只能是忽略该表，此时这一列已与隔离无关，填运营方 ID 只会误导；
        同时违反 BR-ORG-006（教学数据落学校租户），并让带 tenant_id 的唯一键退化为常量
      - 2 学生主体为学校租户级，跨校转学时把主体行迁移到转入校租户
      - 3 学生主体为学校租户级，跨校转学时在转入校新建主体行，用 national_student_no 关联同一人。
        与 BR-STU-001 / D-027（一个学号只能一行）冲突
    recommended: 1a（语义与 D-027 / D-031 / D-030 一致，且不留可被误用的列）
    blocking: true
    blocks_stages: [stage5]
    owner: 用户
    resolution: |
      用户答复"学生主体为平台级"。
      实现方式定为 1a：edu_student 完全不设 tenant_id 列，加入租户拦截器忽略表，
      学校侧一律经在校记录 / 班级关系两段式取数（DS-DENY-07）。
      理由：列不存在就不会被误用；与 D-030 监护人平台级实体同一机制。
      配套动作：NFR-SEC-01 增加平台级实体例外条款；BR-STU-002 表述待 GAP-022 一并修正。
    resolved_at: 2026-09-30
    status: closed

