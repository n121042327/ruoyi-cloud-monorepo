  - id: GAP-004
    title: 数据权限落地方式未在现有代码中核实
    discovered_at: 2026-09-29
    discovered_by: 仓库扫描
    evidence: ruoyi-common-mybatis 与 ruoyi-common-tenant 存在，但租户管理员放行逻辑、请求级租户隔离机制未逐行核实
    expected: 校园级 / 年级级 / 班级级 / 个人级四层数据权限，且不被租户管理员逻辑绕过
    actual: 未核实
    impact: 若直接沿用现有逻辑，可能造成跨校数据串读；这是本项目的安全红线
    resolution_plan: 阶段 5 开始前，专项核查 ruoyi-common-tenant 与 ruoyi-common-mybatis 的 DataPermission 实现并输出结论
    blocking: false
    blocks_stages: [stage5]
    owner: 我方
    resolution: |
      用户答复：改为"设计相关的表结构关系并落盘"。
      已交付 docs/10-prd/10-data-permission-schema.md：
        六类数据范围各自的权威来源表
        edu_user_role / edu_grade_leader / edu_class.head_teacher_id /
        edu_teaching_assignment / edu_data_grant / edu_data_grant_scope 的字段、唯一键、索引
        五步范围解析流程
        缓存键与版本失效机制
        与现有 ruoyi-common-tenant 的边界
      代码层核查（现有 DataPermission 实现的逐行确认）移交阶段 5 作为实现前置任务，
      不再作为缺项阻塞。
    resolved_at: 2026-09-29
