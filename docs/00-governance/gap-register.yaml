      - B 保留"共享学生数据"为可选能力，只在文档里补一句"默认关闭"
      - C 删除共享授权模型，改为资源复制（复制到自有空间后各自维护）
    recommended: 选项 A（与用户澄清、BR-ORG-008、D-026 一致；首轮无落地对象，只保留表结构，成本最低）
    blocking: false
    blocks_stages: [stage4, stage5, stage6, stage8]
    owner: 用户
    resolution: "裁决 A（2026-09-30 用户同意推荐）：以 05-permission-matrix.yaml 为准，校领导对教师主体只读。经 CR-004 执行：教师 PRD 4.4 字段级可编辑性矩阵改为校领导全列只读；REQ-TCH-022 的「校级管理员」映射为 tenant_admin；权限矩阵新增 field_level_permissions.write_field_admin（granted_roles: [tenant_admin]，applies_to: person.teacher.teacher_no / person.teacher.hire_date）。原型按此实现：列表行内编辑、详情页编辑、角色分配入口都不对校领导渲染。"
    resolved_at: "2026-09-30"
    status: closed

