  - id: GAP-061
    title: 学生资料变更申请「同一学生同一字段只允许一条待审核」缺少数据库级强约束
    discovered_at: 2026-10-01
    discovered_by: 阶段 5 建表脚本 MySQL 8 实证（表结构复核）
    evidence: 'docs/10-prd/modules/student/PRD.md 与 GAP-018 已确认「审核未过能重提，但同一字段同时只允许一条待审核」；

      docs/40-detailed-design/database/schema.yaml 的 edu_student_field_change 原本只有普通索引

      `idx_sfc_pending(student_id, field_name, status)`，没有唯一约束。

      MySQL 唯一索引无法表达「仅 status=pending 时唯一」，因此并发提交两条待审申请时存在被绕过的窗口。

      '
    expected: 同一学生同一字段同时最多一条待审核，且由数据库强制
    actual: 只有普通索引，靠应用层保证
    impact: '不补：并发或重试场景可能出现两条同字段待审，审批人看到重复申请，且「审核通过」会把同一字段写两次，

      后续排查无法判断哪条是有效申请。

      '
    options:
    - A 增加生成列 `pending_guard`（仅 pending 且未删除时取值）+ 唯一键 `uk_sfc_pending`（推荐）
    - B 只用普通索引，靠应用层事务 + 行锁保证
    - C 为待审记录单独建一张表
    recommended: '选项 A。理由：不改查询语义，唯一性由数据库保证；生成列在 pending 之外取 NULL，

      MySQL 唯一索引对多个 NULL 不判重，因此历史记录可以有多条。选项 B 在并发下不可靠；选项 C 增加一次同步成本。

      '
    blocking: false
    blocks_stages:
    - stage6
    - stage7
    owner: 用户
    status: closed
    resolution: '用户 2026-10-01 授权「需要拍板的默认取推荐」，取选项 A 并在阶段 5 落地：

      schema.yaml 增加 generated_columns.pending_guard 与 uk_sfc_pending；tools/gen_schema_artifacts.py 增加生成列支持；

      MySQL 8.4.11 实证 `Duplicate entry ''1:guardian_phone'' for key ''edu_student_field_change.uk_sfc_pending''`，

      9 / 9 语义用例通过（见 evidence/stage5-detailed-design/2026-10-01_generated-column-guard.log 与 decisions.md D-088）。

      '

