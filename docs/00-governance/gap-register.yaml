  - id: GAP-018
    title: 全国学籍号是否需要单独字段
    discovered_at: 2026-09-29
    discovered_by: 学号改为系统统一发号后的推导
    evidence: |
      学号由系统发号后，学校原有的官方学籍号（全国学籍号，通常以 G 或 L 开头）
      在系统里没有归属字段。若学校需要对外报表使用该号码，必须单独存储。
    expected: 明确系统是否需要存储全国学籍号 / 学籍辅号
    actual: 未定
    impact: 影响学生表字段与导入模板列
    options:
      - 新增 national_student_no 字段，全平台唯一且允许为空
      - 不存储，学校自行在自有系统维护
    recommended: 选项 1，字段允许为空，避免影响存量导入
    blocking: false
    blocks_stages: [stage5]
    owner: 用户
    resolution: 用户答复：**加字段**。已落地 BR-STU-022 与字段字典 national_student_no，允许为空，非空时全平台唯一
    resolved_at: 2026-09-29
    status: closed

