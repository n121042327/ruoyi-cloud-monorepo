    actual: 无
    impact: 阶段 6 会出现组件选型不一致、按钮层级混乱
    resolution_plan: 在阶段 3 交付物中新增 component-mapping.yaml 与 business-components.yaml，并在 markup-contract.md 中要求原型元素携带语义标记
    blocking: true
    blocks_stages: [stage6]
    owner: 我方产出，用户确认
    resolution: 用户确认按该方案执行；组件映射的权威文件为 prototypes/high-fidelity/v1/component-mapping.yaml
    resolved_at: 2026-09-29
    status: answered

