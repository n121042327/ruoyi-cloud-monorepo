  - id: GAP-056
    title: 编班表导入模板的列清单未在班级 PRD 枚举（本批按推荐 4 列实现）
    discovered_at: 2026-10-01
    discovered_by: 批次 2-4 交付 PAGE-CLS-ROSTER-IMPORT 时按页面规格自查
    evidence: |
      docs/10-prd/modules/class/PRD.md 第 233 行（REQ-CLS-035）只写「编班（花名册导入）支持『按班级列』的编班表：
      一行一个学生，含目标班级列」，没有像学生 PRD 第 425 行起（14 列）与教师 PRD 第 339 行起（9 列）那样
      列出模板的列清单与必填标记；第 234 / 235 行只约束「两阶段」与「幂等」。
      因此编班表有哪几列、姓名列是否必填、是否需要「班级类型」列，PRD 没有给依据。
    expected: 班级 PRD 或公共前置里给出编班表模板的列清单（列名、必填、说明）
    actual: 只有「一行一学生 + 含目标班级列」的口径，列清单缺失
    impact: |
      不补：阶段 3 的高保真原型与阶段 5 的导入校验规则（BR-IMP-008）没有权威列清单；
      阶段 6 的模板下载接口返回的列定义只能引用本批的推荐值。
      本批已按推荐 4 列实现（学号 / 姓名 / 目标班级 / 班级类型），页面与规格里都标注了来源，不影响批次 2-4 的验收。
    options:
      - A 一次 CR 把 4 列写进班级 PRD 4.6 节（推荐）：与学生 / 教师模板列同口径，明确「学号必填、姓名选填（用于核对）、目标班级必填、班级类型选填（默认行政班）」
      - B 只登记「学号 + 目标班级」两列必填，其余列由阶段 4 接口设计时再定
      - C 不改 PRD，由阶段 5 的导入校验规则文件承载列清单
    recommended: |
      选项 A。理由：学生与教师两个模块的模板列都写在模块 PRD 里，编班表是唯一例外；
      拆分登记会让「模板列只有一个权威来源」这条约定在班级模块失效。
      选项 B 的代价是阶段 3 的模板截图与阶段 6 的模板下载接口各维护一份列定义；
      选项 C 会让 PRD 与实现之间少一层可核对的中间文档。
    blocking: false
    blocks_stages: [stage3, stage5]
    owner: 用户
    status: open

