      这句本身只对资源类对象成立，对在校学生记录不成立，说明口径一直偏向资源但从未写明。
    expected: 共享授权的对象范围在公共前置里写明，并与各模块 PRD 的页面、用例一致
    actual: 对象范围缺失，且学生模块与导入导出模块把它当成学生数据授权
