  - id: GAP-005
    title: 前端包管理锁定文件与 workspace 配置未核实
    discovered_at: 2026-09-29
    discovered_by: 仓库扫描
    evidence: apps/plus-ui/package.json 声明 engines，但根目录与 plus-ui 下锁文件情况未逐一确认
    expected: pnpm-lock.yaml 存在且与 package.json 一致；根级 pnpm-workspace.yaml 与 turbo.json 待建
    actual: 待核实
    impact: 影响 monorepo 编排与依赖可复现性
    blocking: false
    blocks_stages: [stage0]
    owner: 我方
    resolution: |
      已核实：apps/plus-ui 下无 pnpm-lock.yaml、无 package-lock.json、无 node_modules；
      仓库根无 pnpm-workspace.yaml、无 turbo.json、无 package.json。
      结论：workspace 与 Turbo 需从零建立，属阶段 0 下一批工作。
    resolved_at: 2026-09-29
    status: answered

