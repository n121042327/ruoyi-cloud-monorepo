      表结构：edu_data_grant 没有 resource_types / resource_scope，无法表达"共享哪些题库、哪些试卷"。
      验收：AC-STU-115、AC-IMP-110 两条用例方向相反，阶段 8 无法判定通过与否。
      实现：阶段 4 的接口清单与阶段 6 的按钮显隐会被错误口径带偏。
