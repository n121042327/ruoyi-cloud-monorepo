    title: 教师 PRD 4.4 字段级可编辑性矩阵与权限矩阵对「校领导」的口径冲突
    discovered_at: 2026-09-30
    discovered_by: 批次 2-2b-1 编写 PAGE-TCH-EDIT 页面规格时的公共前置反查
    evidence: |
      docs/10-prd/modules/teacher/PRD.md 4.4 的字段级可编辑性矩阵把"校领导"列为：工号可改（需审计）、
      姓名 / 性别可改、联系方式可改、入职日期可改、教育角色为审批、在职状态可改。
      但 docs/10-prd/05-permission-matrix.yaml 中 school_leader 对 person.teacher 只有 ['read']（用 PyYAML 读取 matrix 核对）。
      两份都是已冻结的公共前置 / 模块文档，互不一致。
    impact: |
      原型：列表行内"编辑"、详情页"编辑"是否对校领导渲染；编辑抽屉中工号、入职日期、联系方式对校领导可写还是只读。
      阶段 6：生产前端的 v-hasPermi 与字段 disabled 逻辑会照抄错误的一方。
      阶段 5：不影响表结构。
      阶段 8：教师模块的权限验收用例会出现两个答案。
    options:
      - A 以权限矩阵为准（首轮校领导对教师主体只读）：原型与生产端都不给校领导编辑入口；用一次 CR 把 PRD 4.4 该行改为只读
      - B 以 PRD 4.4 为准：给 school_leader 补 person.teacher:update，并同步 05-permission-matrix.yaml 与教师验收用例
      - C 折中：只放开联系方式等非关键字段（需要把字段级权限矩阵正式纳入权限模型，成本最高）
    recommended: 选项 A（权限矩阵是功能权限的权威来源，且"校领导审核而非录入"与 D-042「每个字段只有一个写入入口」一致；只需一次 CR）
    blocking: false
    blocks_stages: [stage2, stage6]
    owner: 用户
    resolution: "裁决 A（2026-09-30 用户同意推荐）：以 05-permission-matrix.yaml 为准，校领导对教师主体只读。经 CR-004 执行：教师 PRD 4.4 的字段级可编辑性矩阵改为校领导全列只读；REQ-TCH-022 的「校级管理员」映射为 tenant_admin；权限矩阵新增 field_level_permissions.write_field_admin（granted_roles: [tenant_admin]，applies_to: person.teacher.teacher_no 与 person.teacher.hire_date）。原型按此实现：列表行内「编辑」、详情页「编辑」、角色分配入口都不对校领导渲染。"
    resolved_at: "2026-09-30"
    status: closed

