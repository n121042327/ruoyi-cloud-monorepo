      - B 保持 2-1 ~ 2-4 不变，其余页面在阶段 2 只出"页面骨架清单"不出 HTML，等阶段 3 补齐
      - C 把其余模块的页面并入现有 2-1 ~ 2-4，每批页数由 3 ~ 13 增至 20 以上
    recommended: 选项 A（每批 4 ~ 19 个页面，仍可分批验收；原批次内容不变，只做追加）
    blocking: false
    blocks_stages: [stage2, stage3]
    owner: 用户
    resolution: |
