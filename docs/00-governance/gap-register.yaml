  - id: GAP-034
    title: 校领导对 org.grade 的写权限冲突（年级 PRD 写只读，权限矩阵写可写）
    discovered_at: 2026-09-30
    discovered_by: 批次 2-2b-2b 编写 PAGE-GRD-LIST 页面规格前的公共前置反查
    evidence: |
      docs/10-prd/modules/grade/PRD.md 第 2.1 节（第 91 行）把校领导写为「只读全部，审批年级主任变更」；
      同文件第 2.3 节场景覆盖矩阵（第 107 行起）的 SCN-GRADE-01 一行，校领导一列为「审批」；
      第 5.2 节数据范围表（第 253 行）把「校领导 / 教务主任」并列，落地方式同为本校全部年级（DS-04）。
      但 docs/10-prd/05-permission-matrix.yaml 第 191 行，school_leader 的 org.grade 为 [read, create, update]，
      即校领导可以新增、编辑、批量生成年级。
      两份都是已冻结的文档，互相不一致。
    impact: |
      原型：PAGE-GRD-LIST 工具条的「新增」「按学段批量生成」与行内「编辑」「归档」是否对校领导渲染，
      以及 PAGE-GRD-CREATE / PAGE-GRD-BATCH / PAGE-GRD-LEADER / PAGE-GRD-ARCHIVE 四个浮层对校领导是否可见，都无法确定。
      阶段 6：生产前端的 v-hasPermi 与浮层入口会照抄错误的一方。
      阶段 5：不影响表结构。
      阶段 8：AC-GRD-005（年级主任看不到新增与归档、教务主任可见）之外，校领导一行会出现两个答案。
    options:
      - A 以权限矩阵为准，校领导可维护年级，用一次 CR 把年级 PRD 第 2.1 节的「只读全部」改为「可维护年级，并审批年级主任变更」
      - B 以年级 PRD 为准，校领导对 org.grade 只读，用一次 CR 把权限矩阵 school_leader 的 org.grade 收为 [read]
      - C 折中，校领导可改年级名称等非结构性字段，学段与学段内序号与入学年份仍只读，需要把字段级权限正式纳入权限模型，成本最高
    recommended: |
      选项 B。理由是与 GAP-032 已裁决的口径一致（校领导审核而非录入，见 CR-004 第 3 节），
      也与 D-042「每个字段只有一个写入入口」一致；只需改一行矩阵，不动 PRD 的业务语义。
      若选 A，年级模块会成为全平台唯一由校领导直接录入组织数据的模块，与其他模块口径不一致。
    blocking: true
    blocks_stages: [stage2, stage6, stage8]
    owner: 用户
    resolution: "裁决 B（2026-09-30 用户答复「同意」）：以年级 PRD 为准，校领导对 org.grade 只读，年级主任任职的变更走审批。经 CR-005 执行：05-permission-matrix.yaml 的 school_leader 对 org.grade 由 [read, create, update] 收为 [read] 并加条件说明；年级 PRD 2.1 补口径说明；AC-GRD-005 的期望结果补入校领导只读。原型按此实现：校领导在本页只有导出入口，操作列显示只读。"
    resolved_at: "2026-09-30"
    status: closed

  - id: GAP-035
    title: 年级主任与班主任与任课教师对 org.grade 的读权限未在权限矩阵定义
    discovered_at: 2026-09-30
    discovered_by: 批次 2-2b-2b 编写 PAGE-GRD-LIST 页面规格前的公共前置反查
    evidence: |
      docs/10-prd/05-permission-matrix.yaml 中，grade_leader（第 230 行起）、homeroom（第 248 行起）、
      subject_teacher（第 272 行起）三个角色的 entries 里都没有 org.grade 条目，即按矩阵它们对年级没有任何功能权限。
      但 docs/10-prd/modules/grade/PRD.md 第 2.1 节（第 93 行）写「年级主任 只读本人负责的年级信息」，
      第 5.2 节（第 254、255 行）写「年级主任 DS-05 通过 edu_grade_leader 解析负责年级」「班主任 / 任课教师 DS-06 / DS-07 只读年级摘要」，
      docs/10-prd/08-data-scope-model.md 第 23 至 25 行同样定义了 DS-05 / DS-06 / DS-07 三层范围。
      modules/grade/acceptance.md 的 AC-GRD-005、AC-GRD-105、AC-GRD-106、AC-GRD-107 也都在验证「年级主任与班主任能按范围读到年级、越界返回空」。
      两份都是已冻结的文档，互相不一致。
    impact: |
      原型：左侧菜单「年级管理」对年级主任 / 班主任 / 任课教师是否出现；PAGE-GRD-LIST 对这三个角色渲染还是不渲染；
      「至少两种角色形态」的对照角色能不能选年级主任。
      阶段 6：路由与菜单的权限点、v-hasPermi 无法确定。
      阶段 8：AC-GRD-105 / 106 / 107 三条数据范围用例无法判定通过与否。
    options:
      - A 给 grade_leader 与 homeroom 与 subject_teacher 各补 org.grade 的 read，数据范围分别按 DS-05 / DS-06 / DS-07 收窄，用一次 CR 改权限矩阵
      - B 维持矩阵现状，年级列表只对平台运营与租户管理员与校领导与教务主任开放，用一次 CR 改年级 PRD 第 2.1 与 2.3 节并同步删改 acceptance 的 AC-GRD-005 / 105 / 106 / 107
      - C 只给年级主任补 org.grade 的 read，班主任与任课教师不出现年级菜单，年级信息只从班级与学生模块间接看
    recommended: |
      选项 A。理由是 PRD 与验收用例已经是这个口径，且年级本身就是数据范围的第四层（DS-05），
      若年级主任读不到自己负责的年级，DS-05 这条范围在原型与生产端都没有落点；
      三个角色的读范围由数据权限层收窄即可，不需要额外的功能权限设计。
    blocking: true
    blocks_stages: [stage2, stage6, stage8]
    owner: 用户
    resolution: "裁决 A（2026-09-30 用户答复「同意」）：三个角色各补 org.grade 的 read，范围按 DS-05 / DS-06 / DS-07 收窄。经 CR-005 执行：05-permission-matrix.yaml 的 grade_leader / homeroom / subject_teacher 各新增一条带 condition 的 org.grade read；年级 PRD 5.2 与原型页头的数据范围提示按同一口径渲染（GL-05 / GL-06 实测通过）。"
    resolved_at: "2026-09-30"
    status: closed

  - id: GAP-036
    title: 年级的删除入口缺少权限点与页面登记（PRD 要求可删空年级，权限矩阵与页面清单都没有）
    discovered_at: 2026-09-30
    discovered_by: 批次 2-2b-2b 编写 PAGE-GRD-LIST 页面规格前的公共前置反查
    evidence: |
      docs/10-prd/modules/grade/PRD.md 第 4.6 节把能力命名为「归档与删除」，
      REQ-GRD-028（第 213 行）要求「年级下存在班级或学生关系时不允许删除，只允许归档」，
      REQ-GRD-031（第 216 行）要求「删除与归档必须二次确认并填写原因」，
      第 8 节接口清单（第 345 行）给出 removeGrade 的 DELETE /edu/grade/{id}「逻辑删除」。
      modules/grade/acceptance.md 的 AC-GRD-028 期望「对空年级执行删除成功」。
      但 docs/10-prd/05-permission-matrix.yaml 的 org.grade 授权里没有任何角色持有 delete；
      modules/grade/PRD.md 第 6.1 节页面清单（第 275 至 280 行）也没有删除入口；
      prototypes/functional/v1/navigation.yaml 第 90 行只注册了 PAGE-GRD-ARCHIVE（归档确认）。
    impact: |
      原型：PAGE-GRD-LIST 行内是否有「删除」按钮，以及空年级行是否需要不同的按钮组合。
      业务：年级的唯一键是「学校 + 学段 + 入学年份 + 学段内序号」（BR-GRADE-003），
      若不提供删除，建错的年级会永久占用该组合，导致同一学年无法重建正确的年级，只能靠人工改库。
      阶段 6 与阶段 8：AC-GRD-028 没有可验证的入口。
    options:
      - A 首轮不提供删除入口，空年级也走归档，用一次 CR 把 REQ-GRD-028 与 REQ-GRD-031 与 removeGrade 从接口清单移除或改写
      - B 首轮提供删除，给教务主任与租户管理员补 org.grade 的 delete，限定无班级无学生时才可执行，逻辑删除加二次确认加必填原因，新增 DIALOG-GRD-DELETE
      - C 只有租户管理员可删除空年级，教务主任只能归档
    recommended: |
      选项 B。理由是选项 A 会把「建错年级无法回收唯一键」的问题推到阶段 8 才暴露，
      而年级建错是开学季最常见的操作；选项 B 的删除受「无班级无学生」约束、写审计、二次确认并填原因，
      风险可控，且与 REQ-GRD-030「禁止物理删除」不冲突（逻辑删除）。
      字段与表结构不受影响，只是补一个权限点与一个确认弹窗。
    blocking: true
    blocks_stages: [stage2, stage6, stage8]
    owner: 用户
    resolution: "裁决 B（2026-09-30 用户答复「同意」）：教务主任与租户管理员可删「无班级且无学生关系」的年级。经 CR-005 执行：两个角色在 org.grade 上补 delete 并加条件；年级 PRD 4.6 补权限与前置条件、6.1 新增 DIALOG-GRD-DELETE（浮层片段）、6.3 新增删除交互行；原型在空年级行（2021 级 小学六年级）渲染唯一一处删除入口，二次确认含必填原因（GL-03 / GL-17 ~ GL-20 实测通过）。"
    resolved_at: "2026-09-30"
    status: closed

