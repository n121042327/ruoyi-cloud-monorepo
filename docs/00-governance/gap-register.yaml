        - 在读（`REQ-CLS-004` / `REQ-CLS-007` 的"在读人数"、`BR-STU-012` 的"在读成员"）
        - 已停用（`REQ-CLS-043` / `REQ-CLS-044` 的"停用"、`disableClass` 接口）
      可能还需要但你未表态的值：已归档（学年归档后是否把班级一并置为归档？学年学期 PRD 的
      `REQ-TERM-030` 只说"归档后学年不在新建班级的可选列表中"）、已合并（合并延后）、
      待启用、已毕业（毕业年级班级是否单独置状态）。
    impact: |
      不补：阶段 6 的状态标签映射、阶段 5 的建表与字典校验都缺少枚举依据；
      原型只能用"在读 / 已停用"两值，列表的"状态"列无法反映学年归档与合并等真实终态。
      本批次 2-3a 按最小集合实现（在读 / 已停用），verify-class-list 的 CL-06 用实测留档。
    options:
      - A 走一次 CR-010 登记 `class_status` 枚举，先只放「在读 / 已停用」两个值（推荐）
      - B 走 CR-010 一次补足 4 个值：在读 / 已停用 / 已归档 / 已合并
      - C 一次补足 6 个值：在读 / 待启用 / 已停用 / 已归档 / 已合并 / 已毕业
    recommended: |
      选项 A。理由：只有"在读"与"已停用"能从已冻结的 PRD 文本推出，其余值都需要先决定业务语义
      （例如"学年归档后班级状态是否跟着变""毕业年级班级是否单独一个状态"），而这些语义会直接影响
      数据范围解析与列表筛选。先落两个值，等你在阶段 4 概要设计时看到完整链路再决定是否需要扩展，
      比现在一次猜 6 个值再返工便宜。
      如果你更希望一次到位，选 B 或 C；我会按你选的集合补登记，并把新增值的影响写进 CR。
    blocking: true
    blocks_stages: [stage5, stage6]
    owner: 用户
    resolution: "裁决 A（2026-09-30 用户答复「1a2a3a」）：先只登记「在读 / 已停用」两个值。经 CR-010 执行：字段字典新增 `class_status` 枚举（studying / disabled）与 `class_status` 字段；班级 PRD 升 1.0.4-draft，7.1 的 `status` 改名为 `class_status`，新增 7.3 节写明两条口径——学年归档不改变班级状态（REQ-TERM-030 只把归档学年移出新建班级的可选列表）、「已合并」随班级合并（REQ-CLS-045，首轮延后）一并评估。"
    resolved_at: "2026-09-30"
    status: closed

  - id: GAP-045
