      又不会把写权限摊到两个角色上（`DP-01` 的同一原则）。
      若确实需要年级主任调整去向，再用选项 C 之外的方式另立需求，不要在首轮顺手打开。
    resolution: |
      2026-09-30 用户答复「1.a 2.a」，GAP-053 取选项 A，经 CR-012 落地（见 D-069）：
      grade_leader 补 promotion.batch 的 read，范围 DS-05（只读本人负责的年级）；
      调整去向仍只归 academic_director（update）；
