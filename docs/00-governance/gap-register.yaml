      student acceptance 第 84 行准备数据"A 校 → B 校教师的只读授权"、AC-STU-115"有共享授权的账号读取被授权学校数据"；
      import-export acceptance 第 80 行、AC-IMP-110 同型；
      05-permission-matrix.yaml 第 344 行 PM-Q-005 答复"跨校可见性只能来自运营方创建的数据共享授权"。
      批次 2-1 的学生列表原型据此做出了"跨校只读学生列表 + DG-2026-0007 授权提示条"，方向错误。
