  - id: GAP-007
    title: 教育业务关键规则缺少用户口径
    discovered_at: 2026-09-29
    discovered_by: 计划评审
    evidence: 以下规则在任何现有文件中都无依据
    items:
      - 学号是否允许跨校重复、由谁生成
      - 学生是否允许跨校转学，若允许，历史学籍如何保留
      - 一个学生是否允许同时属于多个行政班
      - 班主任是否能修改学生联系方式与监护人信息，还是只能查看
      - 年级与学段的对应关系是否固定（如小学 1-6 年级）
      - 3+1+2 选科变更的截止时点与审批要求
      - 教师是否一人多校、是否允许跨校任教
      - 班级容量上限是否强制校验
    expected: 有明确业务口径
    actual: 无
    impact: 影响 PRD、表结构、唯一键设计与数据权限
    blocking: true
    blocks_stages: [stage1, stage5]
    owner: 用户
    resolution: |
      用户已答复 7 条，剩 1 条未定（3+1+2 选科变更截止与审批），已拆分为 GAP-010：
        学号跨校唯一 = 是，全租户内唯一
        跨校转学 = 允许
        学生与行政班 = 同一时间只能属于一个行政班
        班主任改监护人信息 = 可以
        年级与学段对应 = 固定
        教师跨校任教 = 允许
        班级容量强制校验 = 否，仅提示不拦截
    resolved_at: 2026-09-29
    status: answered

