  - id: GAP-049
    title: 复制班级（REQ-CLS-061）在班级 PRD 第 8 节接口清单里没有对应 operationId
    discovered_at: 2026-09-30
    discovered_by: 批次 2-3c 交付 PAGE-CLS-COPY 时的接口回查
    evidence: |
      docs/10-prd/modules/class/PRD.md 第 213 行 REQ-CLS-061 要求提供「复制班级」：
      以某班级为模板，在指定的学年学期与年级下生成新班级，复制班级类型、容量、校区、教室，不复制花名册与班主任。
      同一份 PRD 第 8 节接口清单（第 436 ~ 454 行共 19 个 operationId）里没有 copyClass 之类的条目，
      最接近的是 addClass（新建）与 batchAddClass（批量生成）。
    expected: 复制班级在接口清单里有明确归属（新增 operationId，或写明复用 addClass）
    actual: 需求登记了复制能力，接口清单未登记对应入口
    impact: |
      原型：PAGE-CLS-COPY 的 data-api 写哪个 operationId。
      阶段 4：接口清单定稿时是否新增路径（会影响网关路由与权限点数量）。
      阶段 6 / 8：前端 api 层函数名与接口测试用例的对应关系。
      本批次按保守读法实现：data-api="addClass"（复制即「以源班级预填 + 新建」），并在页面规格里写明。
    options:
      - A 保持本批次实现：复制 = 预填 + addClass，不新增 operationId（REQ-CLS-061 原文就是「以某班级为模板……生成新班级」）
      - B 走一次 CR 在 PRD 第 8 节补 copyClass POST /edu/class/{id}/copy，把「复制」做成服务端原子操作（可校验源班级是否在同一数据范围）
    recommended: |
      选项 A。理由：REQ-CLS-061 的语义就是「以源班级为模板生成新班级」，复用 addClass 不需要新增权限点与路由；
      源班级的读取权限已在 getClass 上校验过，前端预填后提交仍会走 addClass 的完整校验（名称唯一、数据范围、学年学期状态）。
      选项 B 的价值在于把「读源班级」与「建新班级」合成一次服务端校验，代价是多一个接口与一轮 CR；
      若阶段 4 认为复制需要服务端保证原子性，再切 B。
    resolution: |
      2026-09-30 用户答复「1a2a」，GAP-049 取选项 A：复制班级复用 addClass，不新增 copyClass。
      本批次已按此实现（PAGE-CLS-COPY 的 data-api="addClass"），无需改动；见 D-066。
      阶段 4 接口清单定稿时若认为需要服务端原子校验，走 CR 在班级 PRD 第 8 节补 copyClass。
    blocking: false
    blocks_stages: []
    owner: Codex
    status: closed

  - id: GAP-050
    title: verify-grade-list harness 的 GL-15 断言已过期（「班级数」已由提示改为真实跨页跳转），harness 整条链卡死
    discovered_at: 2026-09-30
    discovered_by: 批次 2-3c 结束时对已交付 harness 做全量回归
    evidence: |
      evidence/stage2-prototype/verify-grade-list.html 的 GL-15 断言写的是
      「点「班级数」提示在批次 2-3 交付（带入年级筛选）」，即期望只弹 toast。
      但 prototypes/functional/v1/pages/grade-list.html 的「班级数」按钮已经带
      data-nav="PAGE-CLS-LIST"，外壳按 markup-contract 第 10 节做真实跳转（D-064 之后交付的形态），
      因此点击后 iframe 直接离开年级列表页。
      又因为该 harness 的 frame.load 监听没有「只启动一次」的守卫，
      跳转触发的第二个 load 会重新启动一条断言链，第二条链在 GL-04（读取已归档年级行）抛
      TypeError: Cannot read properties of undefined (reading 'querySelectorAll')，
      于是渲染函数从未执行，页面长期停在「运行中…」（实测：`--dump-dom` 只有 1 个 li）。
      该文件在批次 2-3a / 2-3b 期间未被修改，属上批遗留的过期断言，不是本批引入。
    expected: harness 的断言与页面当前形态一致，并且 iframe 被导航后仍能把链跑完
    actual: 断言过期 + 缺少 load 守卫，导致 harness 静默失效（页面只剩「运行中…」）
    impact: |
      evidence 里「GL 38/38 通过」的结论在 D-064 之后无法复现；年级模块的回归保护实际处于失效状态。
      若不修，后续任何批次跑全量回归都会看到「年级 harness 不通过」而无法判断是否被自己改坏。
    options:
      - A 按当前形态修正 GL-15：断言「班级数」真实跳转到班级列表页，然后还原 iframe 并继续后续断言；同时补上 load 启动守卫（本批已按此修复）
      - B 回退 grade-list.html 的「班级数」为只弹提示（会把 D-064 登记的跳转关系撤销，不推荐）
    recommended: 选项 A（已执行）。理由：D-064 的跳转是用户确认过的形态，应改断言而不是改页面。
    resolution: |
      2026-09-30 批次 2-3c 修复：verify-grade-list.html 的 GL-15 改为
      「点击 → 断言落在班级列表页 → 还原 iframe 回年级列表页 → 继续后续断言」，
      新增 FRAME_SRC 常量与 load 启动守卫，并补 4 秒兜底避免链条卡死。
      回归结果：GL-01 ~ GL-38 全部通过（38/38）。
    blocking: false
    blocks_stages: []
    owner: Codex
    status: closed

  - id: GAP-051
    title: 「出国留学（保留学籍）」是否计入班级在读人数，样例数据与口径不一致
    discovered_at: 2026-09-30
    discovered_by: 批次 2-3d 交付 PAGE-CLS-MOVE 时按学籍状态推导「在读」人数
    evidence: |
      prototypes/functional/v1/content-samples.json 的 classes 里，高二 (1) 班（class_id 20250101）
      写的是 student_count: 2，class-list.html 的该行也写 data-enrolled="2"。
      但同一个文件的学生样例里，该班只有两名学生：
        徐昊然 2025000001 enrollment_status: studying_abroad（note：出国留学，保留学籍）
        孙悠然 2025000002 enrollment_status: enrolled（在读）
      也就是说：只有把「出国留学」也算成在读，班级的「在读 2」才成立。
      而 04-business-rules 的 BR-STU-012 只规定了「休学学生保留行政班关系但不计入在读名单」，
      没有写出国留学、保留学籍这类状态是否计入。
      同一批数据里 高一 (1) 班（20260101）的 student_count: 2 是「2 名在读 + 1 名休学」的口径
      （D-065 已按 BR-STU-012 把该班在读由 3 修正为 2），说明两类状态的处理并不一致。
    expected: 「在读」口径覆盖所有保留关系的非在读状态（休学 / 出国留学 / 保留学籍），班级统计与样例数据一致
    actual: 休学明确不计入在读，出国留学没有口径；高二 (1) 班的样例数据只有把出国留学算作在读才对得上
    impact: |
      原型：班级列表的「在读」列、批量迁学生与编班的「可迁移成员」、年级详情的在读学生统计，
      这三处都会因为口径不同给出不同数字。
      阶段 5 / 6：统计 SQL 与前端标签映射都要依赖这个口径。
      阶段 8：升班（BR-PROMO-005）按在读学生推进，口径错了会漏人或多人。
      本批次按保守读法实现：批量迁学生只列「学籍状态 = 在读」的成员可迁移，保留学籍类状态显示但不可迁。
    options:
      - A 出国留学 / 保留学籍与休学同口径：保留行政班关系，但**不计入在读**；需要同步修正高二 (1) 班的 student_count 2 → 1（推荐）
      - B 出国留学计入在读但不可迁移：班级「在读」含出国学生，需在 BR-STU-012 里补写这条例外
      - C 由学校配置哪些状态计入在读：新增状态字典配置项，实现成本最高
    recommended: |
      选项 A。理由：BR-STU-012 已经确立了「保留关系但不计入在读」的原则，出国留学与休学在这点上没有本质差别；
      按 A 实现时「在读」= 学籍状态为在读，统计与可迁移成员天然一致，不需要给每个页面单独解释例外。
      代价是要把高二 (1) 班的 student_count 由 2 改成 1（class-list.html 的 data-enrolled 同步），
      这属于样例数据修正，不改任何业务规则。
    resolution: |
      2026-09-30 用户对「推荐 A」答复「同意」，GAP-051 取选项 A，经 CR-011 落地：
      BR-STU-012 扩写为「只有在读（enrolled）计入在读名单，休学 / 转入未报到 / 出国（保留学籍）等非在读状态都不计入」；
      字段字典的 enrollment_status 12 个枚举项各补 counts_as_enrolled（只有 enrolled 为 true）；
      学生 PRD 第 153 行说明、REQ-STU-037 与学籍状态表同步，新增验收用例 AC-STU-408；
      高二 (1) 班 student_count 2 → 1（class-list.html 的 data-enrolled 与单元格同步）；
      受影响的 20 张 class-list 截图已重拍。见 D-068。
    blocking: false
    blocks_stages: []
    owner: Codex
    status: closed

  - id: GAP-052
    title: 升班任务的「预览 / 执行 / 重试 / 取消」在权限矩阵里没有对应动作
    discovered_at: 2026-09-30
    discovered_by: 批次 2-3e 开工前的公共前置反查（PAGE-PRM-LIST 的按钮权限）
    evidence: |
      docs/10-prd/modules/promotion/PRD.md 第 168 行 REQ-PRM-006 要求
      「"新建任务""预览""执行""重试""取消"按钮按功能权限与任务状态动态显示」，
      第 164 行 REQ-PRM-001 的权限列写的是「各角色 promotion.batch 的 read」。
      但用 PyYAML 读取 docs/10-prd/05-permission-matrix.yaml 后，
      promotion.batch 只有三条授权：
        super_admin      : read / create / update / delete / export / approve / import
        school_leader    : read / approve
        academic_director: read / create
      矩阵的 actions 集合里没有 execute / retry / cancel 这类动作，
      而「预览」「执行」「重试」「取消」都是会改变任务状态与数据的写操作（不是 read）。
      也就是说：按矩阵实现时，教务主任能建任务但**不能预览与执行**，
      校领导有 approve 却没有审批流的落点（升班没有审批环节，见 D-041 / PRD 1.2）。
    expected: 五个按钮各自能对应到矩阵里的具体动作，且与任务状态机（8 个状态）不冲突
    actual: 只有「新建任务」能对应到 create；其余四个动作没有权限点
    impact: |
      原型：PAGE-PRM-LIST 与向导四步页的按钮显隐、`data-permission` 无据可依。
      阶段 4：接口清单要给出每个 operationId 对应的权限点（validatePromotionTask / executePromotionTask /
      retryPromotionTask / cancelPromotionTask 四个接口都没有权限点）。
      阶段 6：`v-hasPermi` 会照抄错误的一方；阶段 8：越权用例会出现两种答案。
      本批次因此**暂停 PAGE-PRM-LIST 的按钮实现**，等裁决后一次做对（页面骨架与状态机不受影响）。
    options:
      - A 用矩阵现有的 update 承载「预览 / 执行 / 重试 / 取消」，给 academic_director 补
        promotion.batch 的 update，并在 PRD 里写明这四个动作都属于 update；同时把 school_leader 的
        approve 收回（升班没有审批流），保留只读
      - B 在矩阵的 actions 里新增 execute（或 promotion.execute）这一类动作，把预览 / 执行 / 重试 / 取消
        都归到它下面，与 update 区分开（更精确，但会改动公共前置的 actions 集合与全部角色条目）
      - C 保持矩阵不动，「预览」按 read 放行（只生成预览不落库？），执行 / 重试 / 取消首轮不开放给教务主任
        （等于升班首轮不可执行，不推荐）
    recommended: |
      选项 A。理由：矩阵已把 write 类动作统一成 update，升班的四个动作都属于「改本任务的状态与明细」，
      语义上就是 update；不动 actions 集合、不新增权限点，改动面最小。
      选项 B 更精确（未来若要单独授权「执行」而不给「取消」会更灵活），代价是公共前置的 actions 与
      全部角色的条目都要过一遍，收益与成本不成比例，建议留到阶段 4 若确有细分需求再立 CR。
    resolution: |
      2026-09-30 用户答复「1.a 2.a」，GAP-052 取选项 A，经 CR-012 落地（见 D-069）：
      promotion.batch 的「预览 / 执行 / 重试 / 取消」统一由 update 承载；
      academic_director 补 update（read / create / update）；school_leader 收回 approve、保留 read；
      升班 PRD 2.1 与 2.3 的「校领导审批升班任务」改为只读（升班无审批环节）；
      5.1 的操作集合收敛为 read / create / update；REQ-PRM-006 写明五个按钮的动作映射。
      不新增权限动作、不改任务状态机。
    blocking: false
    blocks_stages: []
    owner: Codex
    status: closed

