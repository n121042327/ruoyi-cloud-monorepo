  - id: GAP-010
    title: 3+1+2 选科变更的截止时点与审批要求未定
    discovered_at: 2026-09-29
    discovered_by: 用户答复中缺少该项口径
    evidence: 用户在 GAP-007 的答复里列出了其余 7 条规则，唯独"3+1+2 变更截止与审批"未给出结论
    expected: 明确"何时之后不允许变更"与"变更是否需要审批、由谁审批"
    actual: 未定
    impact: 阻塞选科相关表结构（是否需要审批流表）与状态机设计
    options:
      - 学校自行配置截止日期，逾期需校级管理员审批
      - 固定截止时点（例如选科学期结束前 N 天），逾期不可变更
      - 不设截止，全程可变更，仅留变更历史
    recommended: 选项 1（可配置截止 + 审批），兼顾灵活与可控
    blocking: true
    blocks_stages: [stage1, stage5]
    owner: 用户
    resolution: |
      用户答复：学校可配置截止日期，逾期需校级管理员审批。
      影响：选科需要"截止时间"字段 + 审批流表（逾期变更单）。
    resolved_at: 2026-09-29
    status: answered

  - id: GAP-009
    title: 内层 .git / .git1 在阶段 0 执行期间从工作区消失，且有未知进程切换分支
    discovered_at: 2026-09-29
    discovered_by: 本阶段 git status 与 git reflog 核查
    evidence: |
      git status 显示 68 个删除项，全部位于 apps/plus-ui/.git1 与 services/RuoYi-Cloud-Plus/.git1；
      git reflog 显示 15:06:24—15:06:47 之间发生四次分支切换，非本阶段发起；
      plus-ui 与 RuoYi-Cloud-Plus 目录修改时间为 15:06:22。
      详见 docs/00-governance/repo-baseline.md 第 9 节。
    expected: 内层 Git 元数据按计划备份后处理，且执行期间仓库无并发写入者
    actual: 四个目录均已从工作区消失；两个 .git1 可从 HEAD 恢复，两个 .git 无法从本仓库恢复
    impact: |
      正面：目录迁移不再需要处理嵌套仓库；
      负面：存在未知并发进程操作本仓库，可能与本项目的分支、文件与验收节奏冲突。
    options:
      - 先排查并发分支切换来源，确认仓库稳定后再继续
      - 接受现状，.git1 保持删除（历史已归档在根仓库），继续迁移
      - 先 git restore 恢复两个 .git1，再迁移
    recommended: 先排查来源，再在"保持删除"与"恢复"之间选一个
    blocking: true
    blocks_stages: [stage0, stage1]
    owner: 用户
    resolution: 用户答复该操作由本人执行，非异常进程；.git1 保持删除（已暂存）
    resolved_at: 2026-09-29
    status: closed

