      缺口集中在：学生模块剩余 5 项、学校与学年学期与学科 19 项、选科与教学班 9 项、
      审计 7 项、异步任务中心与死信 4 项。
    expected: 阶段 2 的批次计划覆盖全部 86 个页面，且每批可独立验收
    actual: 原计划只覆盖约 20 个
