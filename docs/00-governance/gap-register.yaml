      按 A 实现时一个界面只对应一个接口，权限点与校验规则都不需要分叉，也不需要在本批提前引入选科相关字段。
      选项 B 的代价是把批次 2-7 的创建入口提前到本批，并让一个弹窗绑定两个 operationId。
