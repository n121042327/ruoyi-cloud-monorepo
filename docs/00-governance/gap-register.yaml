  - id: GAP-113
    title: 文件引用 / 异步任务缺学校上下文时，下载审计被跳过
    discovered_at: 2026-10-10
    discovered_by: 导入导出预签名链接批次（CR-136）
    evidence: "docs/40-detailed-design/database/schema.yaml 里 edu_audit_log 的 school_id 非空（V4 迁移 DDL 同样为 NOT NULL）；而 edu_file_ref.school_id 与 edu_async_task.school_id 都可能为空（平台级模板 / 非学校上下文发起的任务）。CR-136 里两处下载审计因此写成「schoolId 为空则只记 warn 不写审计」"
    expected: 每次下载模板 / 失败明细 / 结果文件都有一条审计，且审计里的学校归属正确
    actual: 文件引用或任务没有学校上下文时跳过审计（下载仍成功）
    impact: |
      **不选会怎样**：`REQ-IMP-043` 要求下载全部留痕；平台级模板下载会没有审计记录，
      审计模块的「敏感数据访问」与「操作日志」里少一类动作，追溯时说不清谁在什么时候下载了模板。
    options:
      - "文件引用与任务在落库时强制写入学校上下文（学校级资源必须有学校，平台级模板用运营方租户的学校占位），审计不再跳过（推荐）"
      - "把 edu_audit_log.school_id 放宽为可空（要改阶段 5 的 schema 与分区键策略）"
      - "维持现状，审计里允许缺这一类"
    recommended: |
      **推荐方案 1**：符合既有硬约束「学校级资源必须有学校上下文」（`DS-DENY-02`），
      且不需要动冻结的 schema；影响面是文件引用落库处（导入模板 / 结果文件）补一个 schoolId 赋值。
      本批先保证下载不被审计阻塞，缺口登记在此。
    blocking: false
    blocks_stages:
      - stage8
    owner: 用户
    answer: |
      用户 2026-10-10 指令：automation 先做 GAP-114 / 115 / 113（不需要设计，纯实现），按推荐方案 1 落地。
    resolution: |
      CR-154 收口（2026-10-10）：根因是导出任务从不写 `edu_async_task.school_id`，执行器又把空学校搬到
      `edu_file_ref.school_id`。现在 `exportData` 在请求线程调 `resolveExportSchoolId`（唯一学校直接用；
      多所学校拒绝；只有班级范围时按 `edu_class.school_id` 反推）写任务学校；
      `EduAsyncTaskServiceImpl.resolveDownloadSchoolId` 与 `EduImportExportServiceImpl.writeDownloadLog`
      按「任务 → 文件引用 → 登录态唯一学校」兜底，仍取不到时**拒绝下载**（不再只记 warn 跳过），
      保证 `REQ-IMP-043` 的下载留痕不被跳过（D-234）。
      导入侧结果文件 / 失败明细沿用 `edu_import_batch.school_id`（CR-141 起必填）。
    resolved_at: "2026-10-10"
    status: closed
  - id: GAP-114
    title: 后台导出的细粒度数据范围（年级主任 / 班主任 / 任课教师）没有随任务落库
    discovered_at: 2026-10-10
    discovered_by: GAP-094 第二批（学生导出器，CR-138）
    evidence: "edu_async_task 只落了 school_id 与 params_summary（moduleCode / format / termId / gradeId / classId / studentId / keyword / filters）；发起导出时 exportData 只做权限校验，不落解析后的数据范围。执行器（EduAsyncTaskExecutor）在无登录态线程里按 schoolId 取数（D-218），因此年级主任 / 班主任 / 任课教师发起导出时，拿到的仍是本校全量数据"
    expected: 导出范围与发起人的数据范围一致（校领导全校 / 年级主任本年级 / 班主任本班 / 任课教师本人任教班级）
    actual: 后台导出只做到学校级隔离，细粒度范围未落库、执行阶段无法复现
    impact: |
      **不选会怎样**：班主任点「导出学生」，拿到的是全校学生而不是本班 —— 与列表页看到的内容不一致，
      用户会以为导出坏了；更麻烦的是这类「导出比页面多」的情况若被外部使用，等于扩大了数据可见范围。
    options:
      - "发起导出时把解析后的范围（schoolId + gradeIds / classIds）写进任务（params_summary 或新增列），执行器按它过滤（推荐）"
      - "执行器按 ownerId + ownerRole 现场重算范围（需要在无登录态下重放权限判定，复杂且易漏）"
      - "导出入口只对校领导及以上开放（缩小功能，班主任改走打印）"
    recommended: |
      **推荐方案 1**：范围在请求线程里解析最准（那里有完整登录态与数据权限插件），落库后执行阶段只是复现；
      影响面：`exportData` 里调用一次 `DataScopeResolver` 把 gradeIds / classIds 写进 `params_summary`，
      导出器在 wrapper 上加对应 in 条件。
      CR-151 进展（2026-10-10）：已完成范围落库（`params_summary` 增 gradeIds / classIds）与
      `EduExportScopeResolver`（classIds 优先，gradeIds 展开为该年级下的行政班）；
      `class_roster` 与 `teaching_assignment` 两个导出器已按范围过滤。
      **仍未完成**：`student` / `teacher` 两个导出器的范围过滤（要经在校记录 / 任教关系落到行上）。
    blocking: false
    blocks_stages:
      - stage8
    owner: 用户
    answer: |
      用户 2026-10-10 指令：automation 先做 GAP-114 / 115 / 113（不需要设计，纯实现），按推荐方案 1 落地。
    resolution: |
      CR-151 落地范围落库与换算：`params_summary` 增 gradeIds / classIds（空集合不写 = 本校全量），
      `EduExportScopeResolver.effectiveClassIds` 统一把范围换算成班级 ID 列表，
      `class_roster` / `teaching_assignment` 两个导出器按 `class_id in (...)` 过滤。
      CR-152 收口（2026-10-10）：`StudentExportHandler` 经 `edu_class_member`（status='1'）把班级范围
      落到学生 ID 后过滤；`TeacherExportHandler` 经 `edu_teaching_assignment`（status='1'）把班级范围
      落到教师 ID 后过滤；范围内查不到行时返回空表，不退回本校全量（D-232）。
      四个导出器（student / teacher / class_roster / teaching_assignment）均已按发起导出时落库的范围过滤。
    resolved_at: "2026-10-10"
    status: closed
  - id: GAP-115
    title: 多校账号（集团 / 运营方）做导入时缺少「显式选校」入口
    discovered_at: 2026-10-10
    discovered_by: GAP-094 第三批（学生导入校验，CR-141）
    evidence: "EduImportValidateBo 只有 moduleCode / templateVersion / fileId / fileName / termId / targetClassId / strategy，没有 schoolId；edu_import_batch.school_id 为 NOT NULL。CR-141 由 DataScopeResolver 解析学校归属，学校租户下唯一可用；集团 / 运营方账号的 schoolIds 多于一个时直接抛异常拒绝导入"
    expected: 多校账号可以显式选择「导入到哪个学校」，或在页面上先切换学校上下文再导入
    actual: 多校账号导入被拒绝（提示需要显式指定学校）
    impact: |
      **不选会怎样**：集团 / 运营方的教务人员无法使用导入功能，只能逐个学校账号登录操作；
      若改成「取第一个学校」或「留空由数据库默认」，就会出现跨校写错数据且事后难追。
