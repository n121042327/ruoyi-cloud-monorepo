  - id: GAP-038
    title: 年级表单的承载方式与「编辑年级」的页面登记（年级 PRD 6.1 写弹窗、navigation.yaml 写抽屉、编辑无独立页面）
    discovered_at: 2026-09-30
    discovered_by: 批次 2-2b-2b 交付 PAGE-GRD-LIST 样板页时的载体反查
    evidence: |
      docs/10-prd/modules/grade/PRD.md 第 6.1 节（第 278 行）把「新建年级」写为**弹窗**；
      但 prototypes/functional/v1/navigation.yaml 第 87 行把 PAGE-GRD-CREATE 注册为 type: drawer, size: sm。
      同一节（第 276 至 282 行）只登记了六个页面，没有「编辑年级」的页面；
      而 PRD 第 4.4 节有 REQ-GRD-017 ~ REQ-GRD-020 四条编辑需求，第 4.1 节 REQ-GRD-005 也明确列出「编辑」按钮。
      另外 prototypes/functional/v1/prototype-quality-spec.md 第 5 节的组件选择决策表规定：
      「新增 / 编辑 3 个以上字段 → 必须使用抽屉」，而新建年级至少有学校、学段、入学年份、学段内序号、年级名称 5 个字段。
    impact: |
      原型：PAGE-GRD-LIST 的行内「编辑」当前复用 PAGE-GRD-CREATE 的编辑态（data-nav 指向新建页）。
      若裁决为独立页面，只需改这一处 data-nav 与一条动作登记。
      下一批（2-2b-2c）的 PAGE-GRD-CREATE / PAGE-GRD-BATCH 用抽屉还是弹窗，取决于这个裁决。
      阶段 6：前端组件选型与路由表会照抄错误的一方。
    options:
      - A 新建与编辑共用抽屉（type: drawer），编辑态由行内「编辑」进入；用一次 CR 把 PRD 6.1 的「弹窗」改为「抽屉」并补一句编辑复用说明，不改 navigation.yaml
      - B 新建用弹窗（按 PRD 6.1），编辑另立 PAGE-GRD-EDIT 页面并改 navigation.yaml 的页面计数（13 → 14）与 PRD 6.1
