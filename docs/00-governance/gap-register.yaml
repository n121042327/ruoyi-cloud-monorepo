    options:
      - A 与 GAP-035 / GAP-043 同口径：给 grade_leader 补 promotion.batch 的 read（范围 DS-05，只读本人负责年级），
        调整动作仍只归教务主任（update）
      - B 除 read 外再给 grade_leader 一个「调整本人负责年级学生去向」的写权限（需要新增动作或在 update 上做行级限制）
      - C 按矩阵口径：年级主任不参与升班，PRD 6.1 把年级主任从预览 / 调整页的主要角色里去掉
    recommended: |
