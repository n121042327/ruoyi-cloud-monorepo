  - id: GAP-046
    title: 「按学校检索校区」缺少独立入口，且学校→校区→年级→班级→学生 的级联联动规则未定义
    discovered_at: 2026-09-30
    discovered_by: 用户提问「可以根据学校来检索校区，检索年级，检索班级，检索学生吗」
    evidence: |
      现状核对（按已冻结 PRD）：
        - 年级列表（REQ-GRD-002）：筛选项含「学校」，已可按学校检索年级 ✅
        - 班级列表（REQ-CLS-002）：筛选项含「年级、班级类型、班主任、校区」，学校是页面上下文
          （平台运营与超级管理员可切学校）✅
        - 学生列表（REQ-STU-002）：筛选项含「学校、学年学期、年级、班级、学籍状态、性别、入学年份、学段」✅
        - 校区：学校 PRD 把校区定义为学校内的实体（edu_campus），唯一入口是
          「学校管理 → 学校详情 → 校区管理」（PAGE-SCH-CAMPUS，批次 2-6），
          接口是 `listCampus GET /edu/school/{id}/campus`，**没有跨校的校区清单/检索页** ❌
      另外，三处列表的「学校」入口形态不一致：年级列表是筛选项、班级列表是页头上下文、
      学生列表是筛选项；选学校后上级选项是否自动收窄（级联）没有统一规则。
    impact: |
      不定义：平台运营想"看某校有哪些校区"必须先学会"进学校管理 → 点学校行 → 校区管理"这条路径，
      而班级与学生列表里选了某校后，年级/班级下拉仍显示全部选项（需要人为判断哪些属于该校），
      在 65 校 / 10 万学生的目标规模下容易选错。
      不影响批次 2-3a 的班级列表（它已经按 data-school 过滤行，只是下拉选项未联动收窄）。
    options:
      - A 统一级联规则 + 给校区补一个跨校清单入口（推荐）：定义「学校 → 校区 / 年级 / 班级 → 学生」
        逐级收窄（选学校后，下级下拉只列该校数据）；学校管理列表补「校区数」可点入口，
        跳转到校区管理页（复用 PAGE-SCH-CAMPUS，不新增页面）；跨校检索只对平台运营与超级管理员开放
      - B 只统一级联规则，校区维持"只能从学校详情进"：不新增入口，但四个列表的下拉都按已选学校收窄
      - C 维持现状：级联不联动，校区只能从学校详情进，全部靠用户自己判断
    recommended: |
      选项 A。理由：用户问的正是"能不能按学校检索"这四层，而校区是唯一没有检索入口的一层；
      级联收窄在 65 校规模下是必需项，否则下拉里会出现几十所学校的年级与班级。
      实现上不需要新页面：校区清单复用批次 2-6 的 PAGE-SCH-CAMPUS（学校详情下的独立页），
      只在学校管理列表把"校区数"做成可点入口，并给四个列表补一条统一的级联规则（写进 layout-spec 与
      page-actions.yaml 的 common_actions）。选 B 的代价是平台运营仍然要绕路。
    blocking: false
    blocks_stages: [stage3, stage6]
    owner: 用户
    resolution: "裁决 A（2026-09-30 用户对「就按 A 改」答复「同意」）：统一级联规则 + 校区补检索入口。经落地：layout-spec.yaml 新增 filter_cascade（链路 school → campus/grade/class → student、四条规则、入口清单），page-actions.yaml 的 state_rules 同步；班级列表页作为参考实现（学校为第 1 级，校区/年级/班主任为第 2 级，失效值清空为「全部」，页头总数与分页同步），verify-class-list 的 CL-38 / CL-39 实测通过；navigation.yaml 的 jump_map 新增 PAGE-SCH-LIST 行内「校区数」→ PAGE-SCH-CAMPUS（复用批次 2-6 的校区管理页，不新增页面）。已交付的学生 / 年级 / 教师列表的级联对齐登记为 GAP-047。"
    resolved_at: "2026-09-30"
    status: closed

