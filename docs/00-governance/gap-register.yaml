schema_version: "1.0"
purpose: 缺项登记。阻塞性缺项未解决前，不得执行依赖它的下游任务。

status_values: [open, answered, closed, waived]
# blocking 表示该缺项是否阻塞 blocks_stages 中列出的阶段。
# 状态为 answered / closed / waived 的项不再阻塞，阶段门禁按 status 判定，不按 blocking 判定。

gaps:
  - id: GAP-001
    title: services/RuoYi-Cloud-Plus/.claude/agents 目录不存在
    discovered_at: 2026-09-29
    discovered_by: 仓库扫描
    evidence: "Test-Path 'services/RuoYi-Cloud-Plus/.claude' 返回 False；全仓库递归搜索 .claude 目录无结果"
    expected: 用户希望读取其中的智能体定义，判断能否改写为基于 Codex 的技能
    actual: 该目录不存在
    impact: 无法复用其内容；但仓库根 .agents/skills 已有 22 个 superpowers-zh 技能可作为基础
    options:
      - 用户确认目录位置（可能在其它磁盘 / 其它仓库 / 未同步），提供后我再读
      - 直接改用仓库根 .agents/skills 作为基础，另建教育项目专用技能
      - 两者都做：等目录到位后对比，缺位期间先用 .agents/skills
    recommended: 选项 3
    blocking: false
    blocks_stages: []
    owner: 用户
    resolution: 用户答复"目录不存在就算了"，采用 .agents/skills 作为技能基线
    resolved_at: 2026-09-29
    status: waived

  - id: GAP-002
    title: 缺少原型视觉与布局规范（用户明确反馈"空洞"的根因）
    discovered_at: 2026-09-29
    discovered_by: 用户反馈 + 仓库扫描
    evidence: 仓库中不存在任何设计规范、色彩规范、组件规范文件
    expected: 生成原型前应有可量化的视觉与布局约束
    actual: 无
    impact: 若不先补，阶段 2 / 3 仍会产出"看起来像 demo"的页面
    options:
      - 由我基于 Element Plus 设计语言与企业后台通用规范起草一套，交你审核后冻结
      - 用户提供公司现有设计规范 / 品牌色 / 参考系统截图，我据此提炼
      - 用户指定一个参考产品（如钉钉、飞书、某教务系统），我做风格对齐
    recommended: 选项 2 优先，其次选项 1
    blocking: true
    blocks_stages: [stage2, stage3, stage6]
    owner: 用户
    resolution: |
      用户答复：按 Element Plus 设计规范，同时参考现有 apps/plus-ui 的既有设计风格，
      美观度可以在此之上提升。
      落地方式：阶段 3 先产出 design-tokens.json + component-spec.md，经用户验收后冻结为视觉标准。
    resolved_at: 2026-09-29
    status: answered

