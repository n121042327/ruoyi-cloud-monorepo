  - id: GAP-012
    title: 租户模型修订后，学号的唯一范围需要重新确认
    discovered_at: 2026-09-29
    discovered_by: 租户模型由"租户下辖多校"改为"租户即组织单元"后的推导
    evidence: |
      原口径"学号跨校唯一"在旧的租户模型下等价于"租户内唯一"。
      新模型下每个学校是独立租户，"跨校唯一"只能理解为在更上层的集团内唯一。
      当前按"根租户内唯一"处理，唯一键为 (root_tenant_id, student_no)。
    expected: 明确学号唯一范围是"集团内唯一"、"全平台唯一"，还是"仅本校唯一"
    actual: 暂按根租户内唯一实现
    impact: 决定唯一键列组合、导入去重规则、跨校转学时学号是否保留
    options:
      - 集团内唯一（根租户内唯一）：跨校转学保留学号，独立学校租户内唯一
      - 全平台唯一：所有学校的学号都不能重复，实施时需要一个全局发号器
      - 仅本校唯一：各校自行编号，跨校转学必须换号
    recommended: 选项 1（集团内唯一）
    blocking: true
    blocks_stages: [stage1, stage5]
    owner: 用户
    resolution: 用户答复：**按全平台唯一**。edu_student 唯一键为 (student_no)，学生登录名 s+学号 也因此全平台唯一。衍生出 GAP-016（学号生成规则）
    resolved_at: 2026-09-29
    status: closed

  - id: GAP-013
    title: 集团跨学校租户查询的实现方式未定
    discovered_at: 2026-09-29
    discovered_by: 租户模型修订后的架构推导
    evidence: |
      教学数据的 tenant_id = 学校租户 ID。
      集团用户若被授权查看下属学校数据，需要跨多个 tenant_id 查询，
      这与现有 ruoyi-common-tenant 的"单租户上下文 + tenant_id 过滤"模式冲突。
    expected: 明确集团跨租户查询的落地方式
    actual: 未定
    impact: 影响数据权限拦截器、SQL 生成、缓存键设计，是阶段 4 概要设计的核心输入
    options:
      - 范围展开：把允许的学校租户 ID 集合拼进 where（tenant_id in (...)），不改隔离框架
      - 冗余根租户列：教学数据行上冗余 root_tenant_id，集团查询按 root_tenant_id 过滤
      - 租户内多校：不用学校级租户，退回"一个租户下辖多校"的旧模型
    recommended: 选项 1，必要时叠加选项 2
    blocking: true
    blocks_stages: [stage4, stage5]
    owner: 用户
    resolution: |
      用户答复：集团**不看**下属学校教学数据，因此不存在"按租户树自动下钻"的默认诉求。
      跨校共享改为运营方显式授权。方案定为"授权展开"：
      权限解析时把生效中的共享授权展开为额外的学校租户 ID 集合，拼进 where，
      不修改 ruoyi-common-tenant 的隔离框架，也不放宽 tenant_id 条件。
      见 D-028 与 BR-ORG-013 / BR-DATA-011 ~ 013。
    resolved_at: 2026-09-29
    status: closed

