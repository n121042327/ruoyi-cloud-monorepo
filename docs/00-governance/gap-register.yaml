    actual: 矩阵里没有 promotion.batch 的任何授权
    impact: |
      原型：PAGE-PRM-PREVIEW 的「年级主任」形态做不出来；左侧菜单「升班与学籍」对年级主任是否出现无法确定。
      阶段 4 / 6：路由与菜单权限点无法确定；阶段 8：年级主任能否调整去向的用例有两种答案。
