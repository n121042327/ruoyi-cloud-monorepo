  - id: GAP-060
    title: 死信重放需要二次确认（危险动作 + 写审计），但导入导出 PRD 6.1 没有登记该确认片段
    discovered_at: 2026-10-01
    discovered_by: 批次 2-9 开工前的公共前置反查（死信任务）
    evidence: |
      docs/10-prd/modules/import-export/PRD.md 的 REQ-IMP-038 要求「超过最大重试次数的任务进入死信，
      提供运维查看与重放；重放动作写入审计」；prototypes/functional/v1/layout-spec.yaml 的 state_rules 要求
      「危险动作（删除 / 停用 / 归档 / 覆盖）必须二次确认，且文案写清对象与影响范围」。
      重放会复用原批次号重新入队、真的改动业务数据，属于危险动作，必须有二次确认；
      但 6.1 的页面清单只有 4 个页面，没有这个确认片段的编号。
      判定口径沿用 GAP-059：「PRD 6.3 提到的每个浮层都在 6.1 的页面清单里有编号」——
      本条虽未写进 6.3，但由 4.6 的需求 + layout-spec 的强制规则共同推出，不登记就会出现没有编号的浮层。
    expected: 每个危险动作都有二次确认片段且片段在 navigation.yaml 有编号
    actual: 重放确认片段没有编号
    impact: |
      不补：阶段 6 前端要么把重放做成一次点击（违反 layout-spec 的危险动作规则），
