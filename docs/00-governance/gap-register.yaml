  - id: GAP-016
    title: 学号生成规则未定（全平台唯一与各校自编学号冲突）
    discovered_at: 2026-09-29
    discovered_by: 学号改为全平台唯一后的推导
    evidence: |
      各校惯用的学号形如 20260001，跨校必然重复；
      但学号已定为全平台唯一，因此必须引入学校标识或全局发号。
    expected: 明确学号由谁生成、格式如何、导入时如何处理学校自带学号
    actual: 未定
    impact: 影响唯一索引、导入流程、学生账号创建、跨校转学时学号是否保留
    options:
      - 学号 = 学校编码 + 序号（如 BJYZ20260001），学校录入系统校验全局唯一
      - 系统统一发号，学校不自编，导入时忽略源文件学号
      - 学校自编，系统检测冲突后自动加后缀并提示
    recommended: 选项 1，兼顾学校习惯与全局唯一
    blocking: true
    blocks_stages: [stage1, stage5]
    owner: 用户
    resolution: |
      用户答复：**系统统一发号**，学校不自编。
      已落地 BR-STU-001 与 BR-STU-017 ~ 021：
        格式 = 入学年份(4) + 全局序号(6)，如 2026000001，序号按年重置
        学号永不回收、永不重用
        导入时忽略源学号，导入完成后提供学号对照表
        跨校转学学号不变
        修改学号需校级管理员权限并留审计
      技术影响：需要全平台级发号器，且批量导入必须用号段模式。
      衍生问题见 GAP-018。
    resolved_at: 2026-09-29
    status: closed

