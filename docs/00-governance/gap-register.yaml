  - id: GAP-095
    title: 审计视图 v_edu_audit_security_event 缺 tenant_id，不能用于租户隔离查询
    discovered_at: 2026-10-08
    discovered_by: 阶段 7 审计模块纵切时核对迁移脚本的视图定义（CR-092）
    evidence: |
      **这是什么**：`docs/40-detailed-design/migrations/V4__edu_promotion_stream_support.sql` 第 504 行定义
      `CREATE VIEW v_edu_audit_security_event AS SELECT id, log_time, action_type, operator_id,
      operator_role, object_id, action_result, client_ip, detail FROM edu_audit_log WHERE action_type IN (...)`——
      **视图的列里没有 `tenant_id`**（同文件第 500 行的 `v_edu_audit_operator_access` 有 `tenant_id` 与 `school_id`）。
      `REQ-AUD-013` / `BR-AUDIT-005` 要求运营访问与安全事件的记录归属到被访问租户，
      PRD 5.4 的 `DS-DENY-01` 又要求「缺少租户上下文一律拒绝查询日志」。
      直接查该视图时：若把视图加进 `tenant.excludes`，租户隔离彻底失效（返回全租户的登录事件）；
      若不排除，租户拦截器会拼出视图里不存在的 `tenant_id` 列而报 SQL 错误。
    expected: 登录与安全事件查询受租户隔离约束，只返回本租户记录
    actual: 视图列不足以支撑租户隔离；本批改用基表 `edu_audit_log` 加同一组 `action_type` 等价过滤
    impact: |
      **不选会怎样**：安全事件页面会把**其它租户的登录失败、账号锁定、权限变更**记录暴露给当前租户，
      这是跨租户数据泄露，比「查不到」严重得多；若为了绕开而移除租户拦截，则违反 `DS-DENY-01`。
    options:
      - "查询改用基表 edu_audit_log 加同组 action_type 等价过滤（租户隔离交给租户拦截器）——本批采用"
      - "在阶段 5 产物下一版给视图补 tenant_id / school_id 列，再按视图查询（需改冻结的迁移脚本）"
      - "保留视图查询并在应用层二次过滤租户：视图结果里没有租户信息，无从判断，方案不成立"
    recommended: |
      **推荐方案 1**。理由：两个视图都是阶段 5 的**冻结产物**，按 AGENTS 第 3 节「不得就地覆盖已冻结版本」，
      本批不改迁移脚本；基表加同一组 `action_type` 与视图定义**语义完全等价**，且天然带上
      `tenant_id` / `school_id`，租户隔离由 `PlusTenantLineHandler` 保证，不影响任何业务口径。
      阶段 5 产物下一版修订时，建议统一给审计视图补 `tenant_id` 与 `school_id` 两列。
    blocking: false
    blocks_stages:
      - stage7
      - stage8
    owner: 用户
    answer: |
      用户 2026-10-07 授权「遇到需要拍板的按推荐方案走并在 decisions.md 与 gap-register.yaml 各记一条」，
      循环批次按推荐方案 1 落地。
    resolution: |
      已在 CR-092 落地：`EduAuditServiceImpl.buildSecurityWrapper(...)` 用基表 `edu_audit_log`
      加 `action_type IN ('login','account_locked','activation_view','activation_reset',
      'student_no_change','permission_change')` 等价过滤（动作码与视图定义一致），
      结果由 `EduAuditSecurityEventVo` 投影；运营访问记录为保持同一套范围条件与排序，
      同样改用基表 `operator_role = 'platform_ops'` 过滤。
      待办：阶段 5 产物下一版给审计视图补 tenant_id / school_id。
    resolved_at: "2026-10-08"
    status: answered

  - id: GAP-096
    title: 教育域数据范围拦截器默认关闭，启用前需验证范围列映射；解析缓存为进程内；EduPermissionAspect 未落地
    discovered_at: 2026-10-08
    discovered_by: 阶段 7 数据范围组件纵切时对照架构文档第 4.1 / 4.2 节（CR-093）
    evidence: |
      **这是什么**：架构文档 `docs/30-architecture/09-permission-architecture.md` 第 4.1 节列出的组件里，
      `EduDataScope` / `DataScopeContext` / `DataScopeResolver` / `DataScopeCacheInvalidator` /
      `EduDataPermissionHandler` / `DataScopeInterceptor` 已按 CR-093 落地，但有四处没到「可直接上生产」的状态：
      ① `DataScopeInterceptor` 由 `edu.data-scope.enabled` 控制，**当前默认为关闭**
      （`DataScopeInterceptor.java` 的 `@ConditionalOnProperty`）；
      ② 插件链装配方式是把教育域拦截器 `addInnerInterceptor` 追加到 `MybatisPlusInterceptor`
      （`EduDataScopeChainRegistrar.java`），位置在框架的分页插件之后，尚未按执行计划确认顺序；
      ③ `DataScopeResolver` 的缓存是**进程内** `ConcurrentHashMap`（60 秒 TTL），
      架构文档第 4.1 节要求「带 Redis 缓存」，edu 的 `pom.xml` 未引入 `ruoyi-common-redis`；
      ④ 架构文档同节列出的 `EduPermissionAspect`（功能权限注解 + 写审计 + 敏感字段留痕）未落地。
    expected: 拦截器开启后按表清单正确注入范围条件；范围解析走 Redis 缓存并在业务写操作后失效；审计切面自动写日志
    actual: 组件已交付但拦截器默认关闭、缓存为进程内、切面未落地
    impact: |
      **不选会怎样**：若直接置 `edu.data-scope.enabled=true` 而未按表清单核对，
      可能「该拦的没拦」（范围列映射漏表，越权可见）或「多拦了」（join 查询列名歧义直接报 SQL 错误）；
      进程内缓存只覆盖单实例，网关多实例部署时角色变更后的失效不彻底；
      `EduPermissionAspect` 缺失意味着审计依赖各业务模块主动调用 `recordLog` / `recordChange`，
      漏调的模块会「业务成功但无日志」。
    options:
      - "保持默认关闭；阶段 8 联调时按 schema.yaml 表清单逐条核对范围列映射与插件顺序后再开启，同时接入 ruoyi-common-redis 并把缓存换成 Redis、按模块补审计切面（推荐）"
      - "立即开启拦截器并在联调中边跑边修：把范围判定的正确性押在验收瑕疵上，越权风险不可接受"
      - "改共享框架 ruoyi-common-mybatis 的 MybatisPlusConfiguration 让插件链自动收集 InnerInterceptor bean：属于改公共模块，影响所有服务，收益不足"
    recommended: |
      **推荐方案 1**。理由：数据范围是「漏了就会越权、错了就会全站报错」的一类改动，
      必须在可观测的联调环境里逐表验证（每张表的 school_id / grade_id / class_id 是否真的存在、
      join 场景下列名是否需带别名前缀），而不是靠编译通过或一次性放行；
      缓存的 Redis 化与审计切面的补齐也依赖同一轮联调的环境（多实例 + 真实角色数据）。
    blocking: false
    blocks_stages:
      - stage8
