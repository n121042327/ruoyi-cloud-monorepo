  - id: GAP-048
    title: 新建班级弹窗里「班级类型」的可选范围（REQ-CLS-014 要求必填，但教学班有独立的创建接口与页面）
    discovered_at: 2026-09-30
    discovered_by: 批次 2-3c 交付 PAGE-CLS-CREATE 时的公共前置反查
    evidence: |
      docs/10-prd/modules/class/PRD.md 第 165 行 REQ-CLS-014 把「班级类型」列为**新建班级的必填字段**；
      同文件第 205 行 REQ-CLS-038 又写「支持创建教学班：学年学期 + 年级 + 学科（或选科组合）+ 名称」；
      第 8 节接口清单（第 438、454 行）把「新建」与「新建教学班」拆成两个 operationId：
      addClass（POST /edu/class）与 addTeachingClass（POST /edu/teaching-class）。
      prototypes/functional/v1/navigation.yaml 把 PAGE-CLS-TEACHING（教学班管理）排在批次 2-7，
      docs/00-governance/decisions.md 的 D-043 明确教学班「属于首轮实现（表 + 界面 + 接口）」，交付顺序先选科后教学班。
      因此「新建班级」弹窗与「教学班管理」页谁负责建教学班，文档没有直接写。
    expected: 新建班级弹窗的班级类型要么固定为行政班（教学班在 2-7 创建），要么在弹窗内可切换并改调 addTeachingClass
    actual: 两种读法都能自圆其说；差别体现在弹窗字段集与提交接口上
    impact: |
      原型：PAGE-CLS-CREATE 里「班级类型」下拉是可选两项还是只有行政班可选项；选到教学班时字段集是否切换
      （学科必填、班主任与容量隐藏）。
      阶段 4：接口清单定稿时 addClass 是否承载两类，还是界面与接口一对一。
      阶段 6：表单组件与校验规则的分支数量。
      本批次按保守读法实现：行政班唯一可选，教学班选项列出但置灰并指向批次 2-7 的教学班管理页。
    options:
      - A 保持本批次实现（新建班级 = 行政班，教学班在 PAGE-CLS-TEACHING 创建，接口 addTeachingClass）；REQ-CLS-014 的「班级类型」在弹窗内只读展示为行政班
      - B 弹窗内可选两类：选行政班走 addClass，选教学班走 addTeachingClass 并切换字段集（学科必填、班主任与容量隐藏）；教学班管理页只做维护
    recommended: |
      选项 A。理由：接口清单已经把两类拆成两个 operationId，D-043 又把教学班管理排进批次 2-7；
      按 A 实现时一个界面只对应一个接口，权限点与校验规则都不需要分叉，也不需要在本批提前引入选科相关字段。
      选项 B 的代价是把批次 2-7 的创建入口提前到本批，并让一个弹窗绑定两个 operationId。
    resolution: |
      2026-09-30 用户答复「1a2a」，GAP-048 取选项 A：新建班级弹窗只建行政班（addClass），
      「教学班」选项列出但置灰并指向批次 2-7 的教学班管理页（addTeachingClass）。
      本批次已按此实现，无需改动；见 D-066。
    blocking: false
    blocks_stages: []
    owner: Codex
    status: closed

  - id: GAP-055
    title: 升班明细的字段与「调整方式」枚举未登记进字段字典（阻塞向导第 2 ~ 4 步与升班建表）
    discovered_at: 2026-10-01
    discovered_by: 批次 2-3e-s2 交付 PAGE-PRM-CREATE 时对下一步（预览与调整）的前置反查
    evidence: |
      docs/10-prd/modules/promotion/PRD.md 第 379 行起（7.1 逻辑实体与字段）已把升班明细定义为
      task_id / student_id / source_class_id / target_class_id / result_type（升级 / 留级 / 毕业 / 跳过等）/ status / error_msg，
      唯一键 (task_id, student_id)；第 183 行起（4.3 升班预览）的 REQ-PRM-016 / 017 / 018 又要求支持
      「留级、转班、毕业、跳过」四种调整方式与「按源班级整体指定目标班级」的批量调整。
      但 docs/10-prd/06-field-dictionary.yaml 里与升班相关的条目只有 promotion_task_status 一个
      （CR-013 补的 6 个字段都属于任务主体），上述 7 个字段与「调整方式」枚举都没有登记，没有可引用的 FD- 名称。
      原型层面：第 2 步预览与调整的每一行需要 data-field（学号 / 姓名 / 原班级 / 目标班级 / 结果类型 / 调整原因），
      第 3 步校验需要错误维度与错误说明，第 4 步结果的四类清单（成功 / 失败 / 留级 / 毕业）直接依赖 result_type 的取值。
    expected: 06-field-dictionary.yaml 中有 result_type（含枚举）、source_class_id、target_class_id、task_id、student_id、status、error_msg 及其中文名与类型
    actual: 只有 promotion_task_status；升班明细字段只能从 PRD 7.1 的散文表格里读，机器可读层缺失
    impact: |
      不补：2-3e 剩余 5 页（PREVIEW / ADJUST / VALIDATE / EXECUTE / RESULT）的 data-field 无法回溯到字段字典，
      page-specs 自查第 4 条必然不通过；阶段 3 的高保真原型对同一批字段要再判断一次；
      阶段 5 的 5-2 批次（升班 / 选科 / 支撑能力）缺少 edu_promotion_task_item 的字段名与 result_type 的取值依据；
      阶段 6 的 el-tag 映射与 el-select 选项同样没有依据。
      补了以后：5 页可以按同一标准一次铺开，阶段 5 的升班建表可以直接落到列与字典表。
    options:
      - A 一次 CR 补全（推荐）：给 06-field-dictionary.yaml 补 7 个字段 + 1 个 result_type 枚举
        （升级 / 留级 / 转班 / 毕业 / 跳过，与 REQ-PRM-017 的四种调整方式对齐），并在升班 PRD 6.1 / 6.3 补「调整方式」与「目标班级」的字段口径，
        同时把「留级去向 = 目标学年学期的同学段同名年级」写进 BR-PROMO-006 的说明
      - B 只补原型要用的最小集合：只补 result_type（含枚举）与 target_class_id，其余（task_id / student_id / status / error_msg）等阶段 5 建表时再补
      - C 不补：原型页面的 data-field 直接写 PRD 7.1 的字段名、与字段字典脱钩，并在 page-specs 里注明「待 CR 补登」
    recommended: |
      选项 A。理由：7 个字段同属「升班明细」一张表，分两批补会产生两轮 data-field 回溯返工；
      result_type 现在是 PRD 散文里的「升级 / 留级 / 毕业 / 跳过等」，不定枚举就无法写 el-select 选项，
      阶段 5 也无法判断它是列还是字典表。选项 B 的代价是阶段 5 再走一次 CR 并回头改 5 页原型；
      选项 C 会让「每个 data-field 都能回溯到字段字典」这条契约在升班模块失效，后续接手者要重新判断哪些字段真的登记过。
    resolution: |
      2026-10-01 用户对「推荐 A」答复「同意」，GAP-055 取选项 A，经 CR-014 落地（见 D-073）：
      docs/10-prd/06-field-dictionary.yaml 新增 7 个字段（task_id / student_id / source_class_id /
      target_class_id / result_type / status / error_msg）与 3 个枚举（promotion_result_type 五个值、
      promotion_item_status 四个值、promotion_validation_level 三个值），取值全部取自升班 PRD 4.3 / 4.4 / 4.5 的原文；
      BR-PROMO-006 补「留级的去向是目标学年学期的同学段同名年级」；
      升班 PRD 6.1 补字段口径、6.3 补「指定留级 / 指定转班」两行、7.1 修正 result_type 取值（补「转班」）并区分任务与明细两层状态，
