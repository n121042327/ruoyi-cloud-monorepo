    var n = q(k, sel);

        && qa('tcl', '[data-action-id="ACT-TCL-005"]').length === 4
        && text('tcl', '#tcl-rows tr[data-status="已停用"] td.actions').indexOf('已停用') !== -1,
        '详情 ' + qa('tcl', '[data-action-id="ACT-TCL-002"]').length + ' / 停用 ' + qa('tcl', '[data-action-id="ACT-TCL-005"]').length);
      click('tcl', '#tcl-rows tr[data-class="高一 · 物理 A 层"] [data-action-id="ACT-TCL-002"]');
      return delay('tcl').then(function () {
        rec('SB-32', '点行内「详情」打开 DRAWER-CLS-TEACHING 抽屉并带入该教学班（名称 / 年级 / 组合 / 人数 / 任课教师只读）',
          panelOpen('tcl', 'DRAWER-CLS-TEACHING')
          && text('tcl', '#tcl-detail-name') === '高一 · 物理 A 层'
          && text('tcl', '#tcl-d-combination') === '单学科：物理'
          && text('tcl', '#tcl-d-count') === '6 人'
          && text('tcl', '[data-demo-panel="DRAWER-CLS-TEACHING"]').indexOf('REQ-CLS-042') !== -1,
          text('tcl', '#tcl-detail-name') + ' / ' + text('tcl', '#tcl-d-count'));
        w('tcl').PrototypeShell.closePanel('all');
        next();
      });
    },
    function (next) {
      click('tcl', '#tcl-rows tr[data-class="高一 · 物化生 A 层"] [data-action-id="ACT-TCL-005"]');
      return delay('tcl').then(function () {
        var opened = panelOpen('tcl', 'DIALOG-TCL-DISABLE');
        rec('SB-33', '点行内「停用」打开 DIALOG-TCL-DISABLE 二次确认并带入该教学班，写清影响范围（历史成员与考勤保留）',
          opened && text('tcl', '#tcl-disable-name') === '高一 · 物化生 A 层'
          && text('tcl', '[data-demo-panel="DIALOG-TCL-DISABLE"]').indexOf('历史成员') !== -1,
          text('tcl', '#tcl-disable-name'));
        setVal('tcl', '#tcl-disable-reason', '');
        click('tcl', '[data-action-id="ACT-TCL-007"]');
        return delay('tcl');
      }).then(function () {
        rec('SB-34', '停用确认未填原因被字段级拦截：字段标红 + 汇总提示 + 弹窗不关闭（REQ-CLS-047 写审计的前提是原因必填）',
          hasClass('tcl', '[data-demo-panel="DIALOG-TCL-DISABLE"] [data-field="reason"]', 'has-error')
          && !hasClass('tcl', '[data-demo-panel="DIALOG-TCL-DISABLE"] [data-validate-summary]', 'state-hidden')
          && panelOpen('tcl', 'DIALOG-TCL-DISABLE'),
          text('tcl', '[data-field="reason"] .error-text'));
        rec('SB-35', '停用确认动作：ACT-TCL-007 data-api=disableTeachingClass / org.teaching_class:update；取消 ACT-TCL-006 关闭不写入',
          attr('tcl', '[data-action-id="ACT-TCL-007"]', 'data-api') === 'disableTeachingClass'
          && attr('tcl', '[data-action-id="ACT-TCL-007"]', 'data-permission') === 'org.teaching_class:update'
          && Boolean(q('tcl', '[data-action-id="ACT-TCL-006"]')),
          attr('tcl', '[data-action-id="ACT-TCL-007"]', 'data-api'));
        w('tcl').PrototypeShell.closePanel('all');
        setVal('tcl', '#tcl-disable-reason', '');
        next();
      });
    },
    function (next) {
      return role('tcl', 'school_leader', '校领导').then(function () {
        rec('SB-36', '教学班管理：校领导只读（无停用入口，操作列「只读」），详情抽屉仍可用',
          qa('tcl', '[data-action-id="ACT-TCL-005"]').length === 0
          && qa('tcl', '[data-action-id="ACT-TCL-002"]').length === 5
          && text('tcl', '#tcl-rows tr td.actions').indexOf('只读') !== -1,
          text('tcl', '#tcl-rows tr td.actions').trim());
        rec('SB-37', '教学班管理五类状态片段齐全（加载中 / 空数据 / 失败 / 无权限 / 提交中）', statePanels('tcl').length === 0,
          statePanels('tcl').length ? ('缺 ' + statePanels('tcl').join(',')) : '齐全');
        return role('tcl', 'academic_director', '教务主任');
      }).then(next);
    }
  ];

  var EXPECTED = 37;
  var rendered = false;
  function render() {
    rendered = true;
    var ol = document.getElementById('results');
    ol.innerHTML = '';
    var pass = 0;
    RESULTS.forEach(function (r) {
      var li = document.createElement('li');
      li.className = r.pass ? 'ok' : 'bad';
      li.textContent = (r.pass ? '通过  ' : '不通过 ') + r.id + '  ' + r.name + (r.detail ? '  —— ' + r.detail : '');
      ol.appendChild(li);
      if (r.pass) pass += 1;
    });
    var p = document.createElement('p');
    p.className = pass === EXPECTED && RESULTS.length === EXPECTED ? 'sum' : 'sum bad';
    p.textContent = '合计 ' + RESULTS.length + ' / ' + EXPECTED + ' 条，通过 ' + pass + ' 条，不通过 '
      + (RESULTS.length - pass) + ' 条' + (pass === EXPECTED && RESULTS.length === EXPECTED ? ' —— 全部通过' : '');
    ol.appendChild(p);
  }
  function run(index) {
    if (index >= steps.length) { render(); return; }
    var called = false;
    function next() { if (called) return; called = true; run(index + 1); }
    var out;
    try { out = steps[index](next); }
    catch (err) {
      rec('ERR-' + String(index + 1).padStart(2, '0'), '第 ' + (index + 1) + ' 步抛异常', false, String((err && err.message) || err));
      run(index + 1); return;
    }
    if (out && typeof out.then === 'function') {
      out.catch(function (err) {
        rec('ERR-' + String(index + 1).padStart(2, '0'), '第 ' + (index + 1) + ' 步异步断言失败', false, String((err && err.message) || err));
        next();
      });
    }
  }
  window.addEventListener('load', function () { window.setTimeout(function () { run(0); }, 600); });
  window.setTimeout(function () { if (!rendered) { rec('WATCHDOG', '运行超时', false, ''); render(); } }, 60000);
})();
</script>
</body>
</html>
