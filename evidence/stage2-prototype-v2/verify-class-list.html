<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>PAGE-CLS-LIST 交互验证</title>
<style>
  body { margin: 14px; background: #fff; color: #24292f;
         font: 13px/1.55 Consolas, "Microsoft YaHei", monospace; }
  h1 { font-size: 17px; margin: 0 0 8px; }
  ol { margin: 0 0 10px; padding-left: 22px; }
  li.ok { color: #1a7f37; }
  li.bad { color: #c0392b; font-weight: 700; }
  p.sum { font-weight: 700; }
  iframe { width: 1440px; height: 780px; border: 1px solid #dcdfe6; }
</style>
</head>
<body>
<h1>PAGE-CLS-LIST 交互验证（真实事件派发，非人工目视）</h1>
<ol id="results"><li>运行中…</li></ol>
<iframe id="frame" src="file:///D:/work/person_work/ruoyi-cloud-monorepo/prototypes/functional/v2/pages/class-list.html"></iframe>
<script>
(function () {
  'use strict';
  var RESULTS = [];
  var frame = document.getElementById('frame');

  function rec(id, name, pass, detail) {
    RESULTS.push({ id: id, name: name, pass: Boolean(pass), detail: detail || '' });
  }
  function doc() { return frame.contentDocument; }
  function win() { return frame.contentWindow; }

  function rows() { return Array.prototype.slice.call(doc().querySelectorAll('#class-rows tr')); }
  function visibleRows() {
    return rows().filter(function (tr) { return !tr.classList.contains('state-hidden'); });
  }
  function rowOf(nameFragment) {
    return rows().filter(function (tr) {
      return tr.children[0].textContent.indexOf(nameFragment) !== -1;
    })[0];
  }
  function toolButtons() {
    return Array.prototype.filter.call(doc().querySelectorAll('[data-block="toolbar"] .toolbar .btn'), function (b) {
      return !b.classList.contains('role-hidden');
    }).map(function (b) { return b.textContent.trim(); });
  }
  function roleBtn(label) {
    return Array.prototype.find.call(doc().querySelectorAll('[data-demo="role-switcher"] .pbtn'), function (b) {
      return b.textContent.trim() === label;
    });
  }
  function switchRole(label, next) {
    var btn = roleBtn(label);
    if (btn) { btn.click(); }
    else { win().PrototypeShell.applyRole(label === '超级管理员' ? 'super_admin' : label); }
    win().setTimeout(function () { next(Boolean(btn)); }, 90);
  }
  function setRole(code, next) {
    win().PrototypeShell.applyRole(code);
    win().setTimeout(function () {
      // applyRole 只做显隐；数据范围与行内操作要由页面重算一次（等价于点一次「搜索」）
      doc().querySelector('[data-action-id="ACT-COM-001"]').click();
      win().setTimeout(function () { next(); }, 60);
    }, 40);
  }
  function toastText() {
    var host = doc().querySelector('.toast-host');
    return host ? host.textContent : '';
  }
  function clearToasts() {
    var host = doc().querySelector('.toast-host');
    if (host) host.innerHTML = '';
  }
  function setFilter(id, value) {
    var node = doc().getElementById(id);
    node.value = value;
    var frameWindow = win();
    node.dispatchEvent(new frameWindow.Event('change', { bubbles: true }));
  }
  function clickSearch() {
    doc().querySelector('[data-action-id="ACT-COM-001"]').click();
  }
  function clickReset() {
    doc().querySelector('[data-action-id="ACT-COM-002"]').click();
  }
  function actionsOf(row) {
    return Array.prototype.map.call(row.querySelectorAll('td.actions [data-action-id]'), function (b) {
      return b.getAttribute('data-action-id');
    });
  }
  function openMore(row) {
    var t = row.querySelector('[data-more-trigger]');
    if (!t) return null;
    t.click();
    return doc().getElementById('row-more-menu');
  }
  function moreIds(menu) {
    if (!menu) return [];
    return Array.prototype.map.call(menu.querySelectorAll('[data-action-id]'), function (b) {
      return b.getAttribute('data-action-id');
    });
  }
  function closeMore() {
    var m = doc().getElementById('row-more-menu');
    if (m) m.remove();
  }

  var steps = [
    function (next) {
      var btns = toolButtons();
      rec('CL-01', '默认（教务主任）工具栏为 新建 / 批量生成 / 导出，不含「导出（需授权）」',
        btns.indexOf('新建') !== -1 && btns.indexOf('批量生成') !== -1 && btns.indexOf('导出') !== -1
        && btns.indexOf('导出（需授权）') === -1, btns.join(' | '));
      next();
    },
    function (next) {
      var vis = visibleRows();
      var stopped = vis.filter(function (tr) { return tr.getAttribute('data-status') === '已停用'; });
      var over = vis.filter(function (tr) {
        var capacity = tr.getAttribute('data-capacity');
        return capacity && Number(tr.getAttribute('data-enrolled')) > Number(capacity);
      });
      rec('CL-02', '默认渲染本校 11 行（12 行样例扣除 1 行他校数据），其中已停用 1 行、超容量 1 行',
        rows().length === 12 && vis.length === 11 && stopped.length === 1 && over.length === 1,
        '样例 ' + rows().length + ' 行 / 可见 ' + vis.length + ' 行 / 已停用 ' + stopped.length + ' / 超容量 ' + over.length);
      next();
    },
    function (next) {
      var total = doc().getElementById('pg-total').textContent;
      var summary = doc().getElementById('head-summary').textContent;
      rec('CL-03', '分页显示「共 34 条」（取自 list_totals.class_list_total），页头汇总按当前可见样例实时计算',
        total.indexOf('共 34 条') !== -1 && summary.indexOf('本页样例 11 行') !== -1 && total.indexOf('本页显示 11 行样例') !== -1,
        total + ' / ' + summary);
      next();
    },
    function (next) {
      var heads = Array.prototype.map.call(doc().querySelectorAll('#class-table thead th'), function (th) {
        return th.textContent.trim();
      });
      var expected = ['班级名称', '年级', '类型', '班主任', '在读', '容量', '校区', '教室', '状态', '操作'];
      rec('CL-04', '列与 REQ-CLS-004 的默认列一致（含在读与容量两列各自独立）',
        heads.join(',') === expected.join(','), heads.join(' | '));
      next();
    },
    function (next) {
      var row = rowOf('初中一年级 (1) 班');
      var tag = row.querySelector('td:nth-child(5) .el-tag.danger');
      var stillHasWrite = actionsOf(row).indexOf('ACT-CLS-005') !== -1;
      rec('CL-05', '超容量行给出「超容量」提示且不阻止任何操作（BR-CLASS-005 / REQ-CLS-007）',
        Boolean(tag) && stillHasWrite, '提示=' + (tag ? tag.textContent : '（无）') + ' / 编辑入口=' + stillHasWrite);
      next();
    },
    function (next) {
      var row = rowOf('高三 (2) 班');
      var ids = actionsOf(row);
      var tag = row.querySelector('td:nth-child(9) .el-tag');
      rec('CL-06', '已停用行只保留「详情」，状态用 el-tag info',
        ids.length === 1 && ids[0] === 'ACT-CLS-004' && tag.className.indexOf('info') !== -1,
        ids.join(',') + ' / ' + tag.className);
      next();
    },
    function (next) {
      var row = rowOf('物理 A 层');
      var head = row.children[3].textContent.trim();
      var dash = row.children[5].textContent.trim() + row.children[6].textContent.trim() + row.children[7].textContent.trim();
      var ids = actionsOf(row);
      rec('CL-07', '教学班行：班主任列写「教学班不设」、容量 / 校区 / 教室为「—」，且没有「指定班主任」入口',
        head.indexOf('教学班不设') !== -1 && dash === '———' && ids.indexOf('ACT-CLS-006') === -1,
        head + ' / ' + dash + ' / ' + ids.join(','));
      next();
    },
    function (next) {
      var zero = ['高二 (2) 班', '高三 (2) 班'].map(function (n) { return rowOf(n); });
      var zeroHasDelete = zero.every(function (r) { return actionsOf(r).indexOf('ACT-CLS-013') === -1; });
      var emptyMenu = openMore(zero[0]);
      var zeroMenuHasDelete = moreIds(emptyMenu).indexOf('ACT-CLS-013') !== -1;
      closeMore();
      var busyMenu = openMore(rowOf('高一 (1) 班'));
      var busyMenuHasDelete = moreIds(busyMenu).indexOf('ACT-CLS-013') !== -1;
      closeMore();
      rec('CL-08', '删除只在在读人数为 0 的行可用：空班可删，有在读学生的班级不可删（REQ-CLS-043 / BR-CLASS-006）',
        zeroMenuHasDelete && !busyMenuHasDelete, '空班菜单含删除=' + zeroMenuHasDelete + ' / 有在读学生的菜单含删除=' + busyMenuHasDelete);
      next();
    },
    function (next) {
      var menu = openMore(rowOf('高二 (2) 班'));
      var ids = moreIds(menu);
      var texts = Array.prototype.map.call(menu.querySelectorAll('button'), function (b) { return b.textContent.trim(); });
      closeMore();
      // 空班在读人数为 0：批量迁学生没有可迁对象，按契约不渲染
      var expected = ['ACT-CLS-007', 'ACT-CLS-008', 'ACT-CLS-010', 'ACT-CLS-013'];
      rec('CL-09', '「更多」下拉的每一项都带 data-action-id，并按可用条件过滤（空班没有「批量迁学生」）',
        ids.join(',') === expected.join(','), texts.join(' | '));
      next();
    },
    function (next) {
      closeMore();
      var menu = openMore(rowOf('高一 (1) 班'));
      var ids = moreIds(menu);
      closeMore();
      rec('CL-10', '有在读学生的班级：菜单里没有「删除」但有「批量迁学生」',
        ids.indexOf('ACT-CLS-013') === -1 && ids.indexOf('ACT-CLS-009') !== -1, ids.join(','));
      next();
    },
    function (next) {
      switchRole('年级主任', function () {
        var btns = toolButtons();
        var ids = actionsOf(rowOf('高一 (1) 班'));
        var menu = openMore(rowOf('高一 (1) 班'));
        var menuIds = moreIds(menu);
        closeMore();
        rec('CL-11', '年级主任：可建班与编班、无删除权限（矩阵只给 read / create / update）',
          btns.indexOf('批量生成') === -1 && menuIds.indexOf('ACT-CLS-013') === -1
          && ids.indexOf('ACT-CLS-005') !== -1 && ids.indexOf('ACT-CLS-006') !== -1,
          btns.join(' | ') + ' / 菜单 ' + menuIds.join(','));
        next();
      });
    },
    function (next) {
      var vis = visibleRows();
      var grades = vis.map(function (tr) { return tr.getAttribute('data-grade'); });
      var onlySenior1 = grades.every(function (g) { return g === '202601'; });
      rec('CL-12', '年级主任数据范围按 DS-05 收窄到本人负责年级（2026 级 高一 4 行，含教学班）',
        vis.length === 4 && onlySenior1, '可见 ' + vis.length + ' 行 / 年级 ' + grades.join(','));
      next();
    },
    function (next) {
      switchRole('班主任', function () {
        var vis = visibleRows();
        var row = rowOf('高一 (1) 班');
        var ids = actionsOf(row);
        var readonlyMark = win().getComputedStyle(row.querySelector('td.actions'), '::after').content;
        rec('CL-13', '班主任：只看到本人负责的 1 个班级，操作列只有「详情」并显示「只读」（DS-06）',
          vis.length === 1 && ids.length === 1 && ids[0] === 'ACT-CLS-004' && readonlyMark.indexOf('只读') !== -1,
          '可见 ' + vis.length + ' 行 / 行内 ' + ids.join(',') + ' / 标记 ' + readonlyMark);
        next();
      });
    },
    function (next) {
      switchRole('任课教师', function () {
        var vis = visibleRows().map(function (tr) { return tr.children[0].textContent.trim(); });
        var notice = doc().querySelector('[data-role-visible="subject_teacher"]');
        var hidden = notice ? notice.classList.contains('role-hidden') : true;
        rec('CL-14', '任课教师：只看到任教班级 3 行（含教学班），只读，且顶部给出字段裁剪与禁止导出提示（DS-07）',
          vis.length === 3 && !hidden && notice.textContent.indexOf('REQ-CLS-012') !== -1,
          '可见 ' + vis.length + ' 行 / 提示可见=' + !hidden);
        next();
      });
    },
    function (next) {
      switchRole('校领导', function () {
        var vis = visibleRows();
        var btns = toolButtons();
        var ids = actionsOf(rowOf('高一 (1) 班'));
        rec('CL-15', '校领导：本校 11 行只读，工具栏只有「导出」，行内只剩「详情」',
          vis.length === 11 && btns.length === 1 && btns[0] === '导出' && ids.length === 1 && ids[0] === 'ACT-CLS-004',
          btns.join(' | ') + ' / ' + ids.join(','));
        next();
      });
    },
    function (next) {
      switchRole('平台运营', function () {
        var btns = toolButtons();
        var before = visibleRows().length;
        setFilter('f-school', '202');
        win().setTimeout(function () {
          var alertNode = doc().getElementById('ops-scope-alert');
          var after = visibleRows().length;
          var hint = doc().querySelector('[data-role="scope-hint"]').textContent;
          rec('CL-16', '平台运营：只读 + 导出需授权；切到他校后出现协助视图提示并只看他校 1 行',
            btns.indexOf('新建') === -1 && btns.indexOf('导出（需授权）') !== -1
            && !alertNode.classList.contains('state-hidden') && after === 1 && hint.indexOf('协助视图') !== -1,
            btns.join(' | ') + ' / 本校 ' + before + ' 行 → 他校 ' + after + ' 行');
          setFilter('f-school', '201');
          next();
        }, 120);
      });
    },
    function (next) {
      setRole('platform_ops', function () {
        setFilter('f-school', '202');
        win().setTimeout(function () {
          var g = doc().getElementById('f-grade');
          var c = doc().getElementById('f-campus');
          var h = doc().getElementById('f-head');
          var gradeText = g.options.length > 1 ? g.options[1].textContent.trim() : '';
          var headTotal = doc().getElementById('head-total').textContent.trim();
          rec('CL-38', '筛选级联（GAP-046 选项 A）：平台运营切到他校后，年级 / 校区 / 班主任下拉只剩该校数据，页头总数同步',
            g.options.length === 2 && c.options.length === 2 && h.options.length === 2
            && gradeText.indexOf('2026 级 初一') !== -1 && headTotal.indexOf('共 6 个班级') !== -1,
            '年级 ' + g.options.length + ' 项（' + gradeText + '） / 校区 ' + c.options.length + ' 项 / 班主任 '
            + h.options.length + ' 项 / ' + headTotal);
          setFilter('f-school', '201');
          win().setTimeout(function () {
            rec('CL-39', '回到本校后下拉恢复为本校范围（年级 5 项 + 全部、校区 2 项 + 全部、班主任 8 人 + 未指定 + 全部）',
              doc().getElementById('f-grade').options.length === 6
              && doc().getElementById('f-campus').options.length === 3
              && doc().getElementById('f-head').options.length === 10,
              '年级 ' + doc().getElementById('f-grade').options.length + ' / 校区 '
              + doc().getElementById('f-campus').options.length + ' / 班主任 '
              + doc().getElementById('f-head').options.length);
            next();
          }, 120);
        }, 140);
      });
    },
    function (next) {
      switchRole('超级管理员', function () {
        var btns = toolButtons();
        var ids = actionsOf(rowOf('高一 (1) 班'));
        rec('CL-17', '超级管理员：全部工具栏按钮与全部行内操作可见（BR-ORG-014）',
          btns.length === 4 && ids.indexOf('ACT-CLS-005') !== -1 && ids.indexOf('ACT-CLS-006') !== -1
          && ids.indexOf('ACT-CLS-016') !== -1, btns.join(' | ') + ' / ' + ids.join(','));
        next();
      });
    },
    function (next) {
      setRole('tenant_admin', function () {
        var vis = visibleRows();
        var btns = toolButtons();
        var ids = actionsOf(rowOf('高一 (1) 班'));
        rec('CL-18', '租户管理员：可读本校班级，但无任何写入口与导出（矩阵显式禁止 org.class.update）',
          vis.length === 11 && btns.length === 0 && ids.length === 1 && ids[0] === 'ACT-CLS-004',
          '可见 ' + vis.length + ' 行 / 工具栏 ' + btns.join(',') + ' / 行内 ' + ids.join(','));
        setRole('academic_director', next);
      });
    },
    function (next) {
      clickReset();
      win().setTimeout(function () {
        setFilter('f-grade', '202601');
        clickSearch();
        win().setTimeout(function () {
          rec('CL-19', '按年级筛选（2026 级 高一）→ 4 行', visibleRows().length === 4, '可见 ' + visibleRows().length + ' 行');
          next();
        }, 90);
      }, 90);
    },
    function (next) {
      clickReset();
      win().setTimeout(function () {
        setFilter('f-type', 'teaching');
        clickSearch();
        win().setTimeout(function () {
          rec('CL-20', '按班级类型筛选（教学班）→ 1 行，体现行政班与教学班是两套独立关系',
            visibleRows().length === 1, '可见 ' + visibleRows().length + ' 行');
          next();
        }, 90);
      }, 90);
    },
    function (next) {
      clickReset();
      win().setTimeout(function () {
        setFilter('f-head', '__none');
        clickSearch();
        win().setTimeout(function () {
          var vis = visibleRows().length;
          rec('CL-21', '按「未指定班主任」筛选 → 2 行（高一 (3) 班 / 高二 (2) 班）', vis === 2, '可见 ' + vis + ' 行');
          next();
        }, 90);
      }, 90);
    },
    function (next) {
      clickReset();
      win().setTimeout(function () {
        setFilter('f-keyword', '钱学森');
        clickSearch();
        win().setTimeout(function () {
          var vis = visibleRows().length;
          rec('CL-22', '关键字检索班级名称（REQ-CLS-003）→ 1 行超长名称样本', vis === 1, '可见 ' + vis + ' 行');
          next();
        }, 90);
      }, 90);
    },
    function (next) {
      clickReset();
      win().setTimeout(function () {
        setFilter('f-campus', '2011');
        clickSearch();
        win().setTimeout(function () {
      rec('CL-23', '按校区筛选（本部校区）→ 5 行', visibleRows().length === 5, '可见 ' + visibleRows().length + ' 行');
          next();
        }, 90);
      }, 90);
    },
    function (next) {
      clickReset();
      win().setTimeout(function () {
        setFilter('f-term', '202501');
        clickSearch();
        win().setTimeout(function () {
          var vis = visibleRows().length;
          var summary = doc().getElementById('head-summary').textContent;
          rec('CL-24', '切到 2025-2026 学年（已归档）→ 样例集为空，汇总显示 0 行（历史学年只读查询）',
            vis === 0 && summary.indexOf('本页样例 0 行') !== -1, '可见 ' + vis + ' 行 / ' + summary);
          next();
        }, 90);
      }, 90);
    },
    function (next) {
      clickReset();
      win().setTimeout(function () {
        var term = doc().getElementById('f-term').value;
        var keyword = doc().getElementById('f-keyword').value;
        rec('CL-25', '重置：清空条件并回到当前学年学期 + 11 行，且不触发批次跳转提示',
          term === '202601' && keyword === '' && visibleRows().length === 11,
          'term=' + term + ' / keyword=' + (keyword || '（空）') + ' / 可见 ' + visibleRows().length + ' 行');
        next();
      }, 120);
    },
    function (next) {
      clearToasts();
      closeMore();
      var menu = openMore(rowOf('高三 (1) 班'));
      var stop = menu.querySelector('[data-action-id="ACT-CLS-010"]');
      stop.click();
      win().setTimeout(function () {
        var panel = doc().querySelector('[data-demo-panel="DIALOG-CLS-DISABLE"]');
        var title = doc().getElementById('disable-target').textContent.trim();
        rec('CL-26', '行内「停用」打开 DIALOG-CLS-DISABLE 二次确认，标题绑定当前行班级',
          panel.classList.contains('open') && title.indexOf('高三 (1) 班') !== -1,
          '打开=' + panel.classList.contains('open') + ' / 标题=' + title);
        next();
      }, 180);
    },
    function (next) {
      clearToasts();
      var confirm = doc().querySelector('[data-action-id="ACT-CLS-011"]');
      confirm.click();
      win().setTimeout(function () {
        var panel = doc().querySelector('[data-demo-panel="DIALOG-CLS-DISABLE"]');
        var err = panel.querySelector('.field.has-error .error-text');
        rec('CL-27', '停用确认不填原因：字段级校验拦截，弹窗保持打开（不写入）',
          panel.classList.contains('open') && Boolean(err) && err.textContent.indexOf('原因') !== -1,
          '打开=' + panel.classList.contains('open') + ' / 错误=' + (err ? err.textContent.slice(0, 24) : '（无）'));
        next();
      }, 200);
    },
    function (next) {
      doc().querySelector('[data-close-panel="DIALOG-CLS-DISABLE"]').click();
      win().setTimeout(function () {
        var stillOpen = Array.prototype.some.call(doc().querySelectorAll('.overlay'), function (o) {
          return o.classList.contains('open');
        });
        rec('CL-28', '取消停用：弹窗关闭且不产生任何写入', !stillOpen, '仍有打开浮层=' + stillOpen);
        next();
      }, 200);
    },
    function (next) {
      clearToasts();
      closeMore();
      var menu = openMore(rowOf('高二 (2) 班'));
      menu.querySelector('[data-action-id="ACT-CLS-013"]').click();
      win().setTimeout(function () {
        var panel = doc().querySelector('[data-demo-panel="DIALOG-CLS-DELETE"]');
        var title = doc().getElementById('delete-target').textContent.trim();
        doc().querySelector('[data-action-id="ACT-CLS-014"]').click();
        win().setTimeout(function () {
          var err = panel.querySelector('.field.has-error .error-text');
          rec('CL-29', '删除二次确认：标题绑定空班行，且不填原因被字段级校验拦截',
            panel.classList.contains('open') && title.indexOf('高二 (2) 班') !== -1 && Boolean(err),
            '打开=' + panel.classList.contains('open') + ' / 标题=' + title);
          doc().querySelector('[data-close-panel="DIALOG-CLS-DELETE"]').click();
          next();
        }, 200);
      }, 180);
    },
    function (next) {
      win().setTimeout(function () {
        var codes = ['loading', 'empty', 'error', 'forbidden', 'submitting', 'partial', 'queued'];
        var missing = codes.filter(function (c) {
          return !doc().querySelector('[data-demo-state-panel="' + c + '"]');
        });
        rec('CL-30', '七类页面状态片段齐全（layout-spec 的 required_states + 部分失败 + 排队中）',
          missing.length === 0, missing.length ? '缺 ' + missing.join(',') : '全部存在');
        next();
      }, 90);
    },
    function (next) {
      var forbidden = doc().querySelector('[data-demo-state-panel="forbidden"]').textContent;
      var error = doc().querySelector('[data-demo-state-panel="error"]').textContent;
      rec('CL-31', '无权限态写明不降级为全量（DS-DENY-03），错误态给出请求编号',
        forbidden.indexOf('DS-DENY-03') !== -1 && error.indexOf('REQ-20260930-000412') !== -1,
        '请求编号存在=' + (error.indexOf('REQ-20260930-000412') !== -1));
      next();
    },
    function (next) {
      var html = doc().documentElement.innerHTML;
      var placeholders = ['张三', '李四', '王五', '赵六', '测试班级', '测试学校', 'lorem'];
      var hit = placeholders.filter(function (w) { return html.indexOf(w) !== -1; });
      var everyRowHasTag = rows().every(function (tr) {
        return Boolean(tr.querySelector('td:nth-child(9) .el-tag')) || Boolean(tr.querySelector('td:first-child .el-tag'));
      });
      rec('CL-32', '无占位数据，且每行都有状态或标识类字段（状态标签 / 边界标记）',
        hit.length === 0 && everyRowHasTag, hit.length ? '占位 ' + hit.join(',') : '每行都有标签');
      next();
    },
    function (next) {
      win().location.hash = '#head=__none';
      win().setTimeout(function () {
        var vis = visibleRows().length;
        win().location.hash = '';
        win().setTimeout(function () {
          rec('CL-33', '深链接 #head=__none 在已打开的页面上生效（hashchange 重放筛选）',
            vis === 2, '生效时可见 ' + vis + ' 行 / 还原后 ' + visibleRows().length + ' 行');
          next();
        }, 120);
      }, 180);
    },
    function (next) {
      var allowed = ['ACT-COM-001', 'ACT-COM-002', 'ACT-COM-003', 'ACT-COM-004', 'ACT-COM-005', 'ACT-COM-006', 'ACT-COM-007'];
      // 本页同时承载批次 2-3c 的四个弹窗（class_create / class_batch / class_copy / class_leader），
      // 因此 001 ~ 047 都属于本页可出现的已登记集合（017 ~ 029 属班级详情页，本页未用）。
      for (var i = 1; i <= 47; i += 1) { allowed.push('ACT-CLS-' + String(i).padStart(3, '0')); }
      var used = {};
      Array.prototype.forEach.call(doc().querySelectorAll('[data-action-id]'), function (n) {
        used[n.getAttribute('data-action-id')] = true;
      });
      var unknown = Object.keys(used).filter(function (id) { return allowed.indexOf(id) === -1; });
      rec('CL-34', '页面用到的动作编号全部落在 common_actions 与 class_* 各动作组已登记集合内',
        unknown.length === 0, unknown.length ? '未登记 ' + unknown.join(',') : Object.keys(used).length + ' 个编号');
      next();
    },
    function (next) {
      var wrap = doc().querySelector('.table-scroll');
      var table = doc().getElementById('class-table');
      rec('CL-35', '1440 下表格无内部横向滚动（列宽之和 = 表格 min-width 1116px）',
        table.scrollWidth <= wrap.clientWidth + 1,
        '表格 ' + table.scrollWidth + 'px vs 容器 ' + wrap.clientWidth + 'px');
      next();
    },
    function (next) {
      clearToasts();
      closeMore();
      rowOf('高一 (1) 班').querySelector('[data-action-id="ACT-CLS-004"]').click();
      window.setTimeout(function () {
        // 不读 location（file:// 下跨文档读 location 可能抛 SecurityError），改看新文档的页面编号与标题
        var pageId = '';
        var title = '';
        try {
          var root = doc().querySelector('#page-root');
          pageId = root ? root.getAttribute('data-page') : '';
          var h1 = doc().querySelector('.page-head h1');
          title = h1 ? h1.textContent.trim() : '';
        } catch (err) { /* 读不到就按失败记录 */ }
        rec('CL-36', '批次 2-3b 起：行内「详情」不再只弹提示，真实跳转到班级详情独立页',
          pageId === 'PAGE-CLS-DETAIL' && title.indexOf('高一 (1) 班') !== -1,
          '页面编号=' + (pageId || '（读不到）') + ' / 标题=' + (title || '（读不到）'));
        next();
      }, 600);
    },
    function (next) {
      // 回到列表页再验证列宽（上一步已跳到详情页）
      frame.src = 'file:///D:/work/person_work/ruoyi-cloud-monorepo/prototypes/functional/v2/pages/class-list.html';
      window.setTimeout(function () { next(); }, 900);
    },
    function (next) {
      var widths = Array.prototype.map.call(doc().querySelectorAll('#class-table thead th'), function (th) {
        return Number((th.getAttribute('style') || '').replace(/[^\d]/g, ''));
      });
      var sum = widths.reduce(function (a, b) { return a + b; }, 0);
      var minWidth = Number((doc().getElementById('class-table').getAttribute('style') || '').replace(/[^\d]/g, '').slice(0, 4));
      // 1366×768 下主内容区可用宽度 = 1366 − 侧边栏 200 − 页面内边距 16 − 卡片内边距 32 ≈ 1118
      rec('CL-37', '列宽之和 = 表格 min-width 且 ≤ 1118px，保证 1366×768 下不出现表格内横向滚动',
        sum === 1116 && minWidth === 1116 && sum <= 1118, '列宽之和 ' + sum + ' / min-width ' + minWidth);
      next();
    }
  ];

  var EXPECTED = 39;

  function render() {
    var ol = document.getElementById('results');
    ol.innerHTML = '';
    var pass = 0;
    RESULTS.forEach(function (r) {
      var li = document.createElement('li');
      li.className = r.pass ? 'ok' : 'bad';
      li.textContent = (r.pass ? '通过  ' : '不通过 ') + r.id + '  ' + r.name + (r.detail ? '  —— ' + r.detail : '');
      ol.appendChild(li);
      if (r.pass) pass += 1;
    });
    var p = document.createElement('p');
    p.className = pass === EXPECTED ? 'sum' : 'sum bad';
    p.textContent = '合计 ' + RESULTS.length + ' / ' + EXPECTED + ' 条，通过 ' + pass + ' 条，不通过 '
      + (RESULTS.length - pass) + ' 条' + (pass === EXPECTED && RESULTS.length === EXPECTED ? ' —— 全部通过' : '');
    ol.appendChild(p);
  }

  function run(index) {
    if (index >= steps.length) { render(); return; }
    var called = false;
    function next() {
      if (called) return;
      called = true;
      run(index + 1);
    }
    try {
      steps[index](next);
    } catch (err) {
      rec('ERR-' + String(index + 1).padStart(2, '0'), '第 ' + (index + 1) + ' 步抛异常（后续步骤已跳过）', false, String(err && err.message || err));
      run(index + 1);
    }
  }

  var started = false;
  frame.addEventListener('load', function () {
    // 只在首次加载时启动；CL-36 之后会重新加载 iframe 回到列表页验证列宽
    if (started) return;
    started = true;
    window.setTimeout(function () { run(0); }, 400);
  });
})();
</script>
