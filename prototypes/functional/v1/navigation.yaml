  - { from: PAGE-AUDIT-LOG-LIST, trigger: 点击行, to: PAGE-AUDIT-LOG-DETAIL, overlay: detail }
  - { from: PAGE-AUDIT-LOG-DETAIL, trigger: "对象标识", to: PAGE-AUDIT-OBJECT-TIMELINE, overlay: block }
  - { from: PAGE-SCH-LIST, trigger: "行内「校区数」", to: PAGE-SCH-CAMPUS, overlay: page, note: "GAP-046 选项 A：校区检索入口复用学校详情下的校区管理页，不新增页面" }

back_rules:
  - 抽屉与弹窗关闭后回到来源页面，且保留筛选条件与分页位置
  - 详情页返回列表时保留筛选条件、分页与列配置
  - 向导页的"取消"需二次确认，确认后回到列表并丢弃草稿

# ---------------------------------------------------------------------------
# 6. 入口条件（谁能看到入口）
# ---------------------------------------------------------------------------
entry_rules:
  - 无功能权限时不渲染入口，且后台接口同样拒绝（NFR-SEC-05）
  - 无数据范围时页面显示"当前账号没有可查看的数据"状态，不显示空表格
  - 教师模块的任课教师：只能看到本人任教相关入口，不出现导入按钮
  - 学生模块的班主任：不出现"新增 / 导入"，出现"编辑监护人信息"
  - 平台运营：默认只读，不出现任何写操作入口，导出需显式授权
  - 集团用户：只出现集团自有数据入口，不出现下属学校教学数据入口

# ---------------------------------------------------------------------------
# 7. 自查清单
# ---------------------------------------------------------------------------
checks:
  - 每个页面都能在 page-actions.yaml 中找到它的动作
  - 每条 jump_map 的两个端点都在 pages 中注册
  - 每个页面的 batch 都在 delivery_batches 中有定义
  - 菜单项的 permission 都能在 05-permission-matrix.yaml 中找到
