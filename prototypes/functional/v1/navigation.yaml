# 4. 交付批次（页面总数与 README 的对照表必须一致）
# ---------------------------------------------------------------------------
delivery_batches:
  - { batch: "2-0", content: 原型规范（layout-spec / navigation / page-actions / markup-contract / 样例数据）, pages: 0, status: 本批 }
  - { batch: "2-1", content: 学生管理列表 + 新增/编辑抽屉（样板）, pages: 3, status: 待验收 }
  - { batch: "2-2", content: "教师管理 + 年级管理（执行时拆为 2-2a 教师列表 1 页 / 2-2b-1 教师详情与新增编辑 3 项 / 2-2b-2 角色与任教 2 项 / 2-2b-2b 年级 6 页）", pages: 13, status: "2-2a、2-2b-1、2-2b-2 已产出待验收；2-2b-2b 的年级 6 页全部产出待验收（含删除确认浮层片段 DIALOG-GRD-DELETE 与 ACT-GRD-001 ~ 029）" }
  - { batch: "2-3", content: 班级管理 + 班级详情 + 升班向导, pages: 17, status: "已全部产出待验收：2-3a 班级列表、2-3b 班级详情（含花名册）、2-3c 四个弹窗、2-3d 编班 / 批量迁学生 / 移出与调班、2-3e 升班 6 页（PAGE-PRM-LIST / CREATE / PREVIEW / VALIDATE / EXECUTE / RESULT）+ 2 个同页片段（DIALOG-PRM-CANCEL、PAGE-PRM-ADJUST）；动作 ACT-CLS-001 ~ 064、ACT-PRM-001 ~ 043 已登记" }
  - { batch: "2-4", content: 导入向导 + 登录 + 异常页, pages: 11, status: "已全部产出待验收：PAGE-IMP-WIZARD（含 TEMPLATE / VALIDATE / EXECUTE 三个区块）、PAGE-STU-IMPORT / PAGE-TCH-IMPORT / PAGE-CLS-ROSTER-IMPORT（模块快捷入口）、PAGE-LOGIN / PAGE-403 / PAGE-404 / PAGE-500（不套管理外壳）；动作 ACT-IMP-001 ~ 010、ACT-IO-001 ~ 002、ACT-AUTH-001 ~ 003、ACT-ERR-001 ~ 005 已登记" }
  - { batch: "2-5", content: 学生模块剩余（详情 / 学籍异动 / 调班 / 跨校转学 / 变更记录）, pages: 8, status: "已全部产出待验收：PAGE-STU-DETAIL（抽屉，含 PAGE-STU-HISTORY 区块）与三个同页弹窗（PAGE-STU-STATUS / PAGE-STU-TRANSFER / PAGE-PRM-CHANGE）、PAGE-STU-CROSS-TRANSFER / PAGE-PRM-TRANSFER（转出校 / 转入校两侧向导）、PAGE-PRM-HISTORY（异动历史列表）；动作 ACT-STU-023 ~ 034、ACT-STU-040 ~ 043、ACT-PRM-044 ~ 048、ACT-PRM-050 ~ 054 已登记" }
  - { batch: "2-6", content: 学校管理 + 学年学期 + 学科与配置, pages: 19, status: "已全部产出待验收：2-6a 学校管理 6 页、2-6b 校区 / 开通初始化 / 学年学期 4 页、2-6c 学科与配置 6 页（ACT-SUB-001 ~ 018）；本批 9 条表单浮层已按 CR-015 由抽屉改为弹窗" }
  - { batch: "2-7", content: 选科与教学班, pages: 9, status: "2-7a 已产出待验收（选科配置 / 学生选科 / 选科清单（含变更申请弹窗与选科历史区块）5 个页面编号，ACT-STR-001 ~ 025）；2-7b 待铺开（组合分布统计 / 变更审批待办 / 按组合生成教学班 / 教学班管理 4 个页面编号）" }
  - { batch: "2-8", content: 审计与操作日志, pages: 7, status: 已确认（D-050），待开始 }
  - { batch: "2-9", content: 异步任务中心 + 死信 + 导出配置, pages: 4, status: 已确认（D-050），待开始 }
  - { batch: deferred, content: "已延后页面（PRD 标注本轮不做）", pages: 1, status: 已延后 }

