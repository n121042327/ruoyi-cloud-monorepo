schema_version: "1.0"
purpose: |
  原型导航规范：菜单树、页面注册表、跳转关系、入口条件。
  页面总数、类型与批次以本文件为准；页面看不到的入口，原型里也不允许出现。

source_of_truth:
  - "docs/10-prd/**（各模块 PRD 第 6 节「界面需求」定义了页面清单，本文件是它们的汇总）"
  - "docs/10-prd/05-permission-matrix.yaml（入口条件取自功能权限）"

# ---------------------------------------------------------------------------
# 1. 模块索引
# ---------------------------------------------------------------------------
module_index:
  student:       { name: 学生管理,       prd: docs/10-prd/modules/student/PRD.md }
  teacher:       { name: 教师管理,       prd: docs/10-prd/modules/teacher/PRD.md }
  class:         { name: 班级管理,       prd: docs/10-prd/modules/class/PRD.md }
  grade:         { name: 年级管理,       prd: docs/10-prd/modules/grade/PRD.md }
  school:        { name: 学校管理,       prd: docs/10-prd/modules/school/PRD.md }
  term:          { name: 学年学期,       prd: docs/10-prd/modules/term/PRD.md }
  subject:       { name: 学科与配置,     prd: docs/10-prd/modules/subject/PRD.md }
  promotion:     { name: 升班与学籍异动, prd: docs/10-prd/modules/promotion/PRD.md }
  stream:        { name: 选科与教学班,   prd: docs/10-prd/modules/stream/PRD.md }
  import-export: { name: 导入导出与异步任务, prd: docs/10-prd/modules/import-export/PRD.md }
  audit:         { name: 审计与操作日志, prd: docs/10-prd/modules/audit/PRD.md }

# ---------------------------------------------------------------------------
# 2. 菜单树（左侧导航，顺序即展示顺序）
# ---------------------------------------------------------------------------
menus:
  - id: edu
    name: 教育管理
    children:
      - { id: menu-student, name: 学生管理, route: /edu/student/list, permission: "person.student:read" }
      - { id: menu-teacher, name: 教师管理, route: /edu/teacher/list, permission: "person.teacher:read" }
      - { id: menu-class, name: 班级管理, route: /edu/class/list, permission: "org.class:read" }
      - { id: menu-grade, name: 年级管理, route: /edu/grade/list, permission: "org.grade:read" }
      - { id: menu-promotion, name: 升班与学籍, route: /edu/promotion/list, permission: "promotion.batch:read" }
      - { id: menu-stream, name: 选科与教学班, route: /edu/stream/list, permission: "stream.selection:read" }
  - id: org
    name: 组织与配置
    children:
      - { id: menu-school, name: 学校管理, route: /edu/school/list, permission: "org.school:read" }
      - { id: menu-term, name: 学年学期, route: /edu/term/list, permission: "org.term:read" }
      - { id: menu-subject, name: 学科与配置, route: /edu/subject/list, permission: "org.subject:read" }
  - id: ops
    name: 平台与运维
    children:
      - { id: menu-import, name: 导入导出, route: /edu/import/wizard, permission: "data.import:import" }
      - { id: menu-task, name: 异步任务, route: /edu/async-task/list, permission: "data.async_task:read" }
      - { id: menu-audit, name: 审计日志, route: /edu/audit/log/list, permission: "audit.log:read" }

menu_rules:
  - 菜单项按功能权限显隐；无任一子项可见时隐藏整个分组
  - 菜单顺序固定，不按使用频率动态排序
  - 需要多校切换的角色（集团管理员 / 平台运营）在顶部导航切换学校，不在菜单里重复

# ---------------------------------------------------------------------------
# 3. 页面注册表（91 项，含页面 / 详情 / 抽屉 / 弹窗 / 向导 / 页面内区块）
#    type: page 独立页 | detail 详情 | drawer 抽屉 | dialog 弹窗 | wizard 向导 | block 页面内区块 | standalone 独立于菜单
#    batch: 见第 4 节 delivery_batches；deferred 表示本轮不做
# ---------------------------------------------------------------------------
pages:
  # ---- 学生管理 ----
  - { id: PAGE-STU-LIST, name: 学生管理列表, module: student, type: page, route: /edu/student/list, template: TPL-LIST, batch: "2-1" }
  - { id: PAGE-STU-CREATE, name: 新增学生, module: student, type: dialog, size: md, parent: PAGE-STU-LIST, batch: "2-1", note: "CR-008 / D-059：表单类浮层统一用弹窗（与 apps/plus-ui 一致），三步仍在一个弹窗内" }
  - { id: PAGE-STU-EDIT, name: 编辑学生, module: student, type: dialog, size: md, parent: PAGE-STU-LIST, batch: "2-1", note: "CR-008 / D-059：表单类浮层统一用弹窗" }
  - { id: PAGE-STU-DETAIL, name: 学生详情, module: student, type: detail, container: drawer, size: lg, route: /edu/student/detail, parent: PAGE-STU-LIST, batch: "2-5", note: "2-5 已交付：抽屉三个分区（基本信息 / 监护人 / 变更记录）+ 操作条；敏感字段默认掩码，证件号需 read_sensitive、联系电话需 read_contact 并留痕；详情是只读视图（DP-01）" }
  - { id: PAGE-STU-STATUS, name: 学籍异动, module: student, type: dialog, size: md, parent: PAGE-STU-DETAIL, batch: "2-5", note: "2-5 已交付：异动类型由当前状态决定（listEnrollmentStatusOption）、生效日期与原因必填、开除在义务教育阶段不可用且后端拒绝（REQ-PRM-043）、提交流转合法性与审计（BR-PROMO-012）" }
  - { id: PAGE-STU-TRANSFER, name: 调班, module: student, type: dialog, size: sm, parent: PAGE-STU-DETAIL, batch: "2-5", note: "2-5 已交付：目标班级必填、已停用班级不可选、只改班级关系（学号与学籍状态不变，BR-STU-016）" }
  - { id: PAGE-STU-HISTORY, name: 变更记录, module: student, type: block, parent: PAGE-STU-DETAIL, batch: "2-5", note: "2-5 已交付：时间线（班级变更 / 学籍状态 / 监护人变更）+「查看全部」跳审计日志；追加式不可删除（BR-AUDIT-003）" }
  - { id: PAGE-STU-CROSS-TRANSFER, name: 跨校转学, module: student, type: wizard, route: /edu/student/cross-transfer, batch: "2-5", note: "2-5 已交付：转出校视角四步（选择学生 → 转入校与目标班级 → 确认提交 → 结果）；只暴露必要字段（REQ-PRM-055）、学号不变（BR-STU-020）、未完成转学单不允许再次发起（REQ-PRM-057）" }
  - { id: PAGE-STU-IMPORT, name: 批量导入向导, module: student, type: wizard, route: /edu/student/import, batch: "2-4", note: "2-4 已交付：学生管理列表工具条「导入」的模块快捷入口；14 列模板（REQ-STU-052，不含学号列 BR-STU-019）、两阶段校验、导入后不给行政班（REQ-STU-062）、学号对照表（REQ-IMP-021 ~ 023）" }

  # ---- 教师管理 ----
  - { id: PAGE-TCH-LIST, name: 教师管理列表, module: teacher, type: page, route: /edu/teacher/list, template: TPL-LIST, batch: "2-2" }
  - { id: PAGE-TCH-DETAIL, name: 教师详情, module: teacher, type: detail, container: drawer, size: lg, parent: PAGE-TCH-LIST, batch: "2-2", note: "PRD 6.1 写明详情页以抽屉承载；内含基本信息 / 教育角色 / 任教关系 / 班主任任职 / 账号 / 变更记录 6 个分区" }
  - { id: PAGE-TCH-CREATE, name: 新增教师, module: teacher, type: dialog, size: md, parent: PAGE-TCH-LIST, batch: "2-2", note: "CR-008 / D-059：表单类浮层统一用弹窗，三步仍在同一个弹窗内" }
  - { id: PAGE-TCH-EDIT, name: 编辑教师, module: teacher, type: dialog, size: md, parent: PAGE-TCH-LIST, batch: "2-2", note: "CR-008 / D-059：表单类浮层统一用弹窗" }
  - { id: PAGE-TCH-ROLE, name: 教育角色分配, module: teacher, type: dialog, size: sm, parent: PAGE-TCH-LIST, batch: "2-2" }
  - { id: PAGE-TCH-ASSIGN, name: 任教关系设置, module: teacher, type: page, route: /edu/teacher/assignment, parent: PAGE-TCH-LIST, batch: "2-2", note: "PRD 6.1 写明为独立页，双栏承载教师视角 / 班级视角；批次 2-2b-2 交付" }
  - { id: PAGE-TCH-LEAVE, name: 离职与调离登记, module: teacher, type: dialog, size: sm, parent: PAGE-TCH-LIST, batch: "2-2" }
  - { id: PAGE-TCH-IMPORT, name: 教师导入向导, module: teacher, type: wizard, route: /edu/teacher/import, batch: "2-4", note: "2-4 已交付：教师管理列表工具条「导入」的模块快捷入口；9 列模板（REQ-TCH-050）、工号租户内唯一（BR-TEACHER-002）、教育角色列可多值" }

  # ---- 年级管理 ----
  - { id: PAGE-GRD-LIST, name: 年级管理列表, module: grade, type: page, route: /edu/grade/list, template: TPL-LIST, batch: "2-2" }
  - { id: PAGE-GRD-DETAIL, name: 年级详情, module: grade, type: detail, container: drawer, size: lg, parent: PAGE-GRD-LIST, batch: "2-2", note: "PRD 6.1 写明详情页以抽屉承载；内含基本信息 / 下辖班级 / 在读学生统计 / 年级主任任职历史 / 变更记录 5 个分区" }
  - { id: PAGE-GRD-CREATE, name: 新建 / 编辑年级, module: grade, type: dialog, size: md, parent: PAGE-GRD-LIST, batch: "2-2", note: "PRD 6.1 写明为弹窗；编辑复用同一弹窗的编辑态，不另立页面（GAP-038 裁决 A / CR-007）" }
  - { id: PAGE-GRD-BATCH, name: 按学段批量生成, module: grade, type: dialog, size: md, parent: PAGE-GRD-LIST, batch: "2-2", note: "PRD 6.1 写明为弹窗；预览用列表而非表格（layout-spec 禁止在弹窗内放表格）" }
  - { id: PAGE-GRD-LEADER, name: 指定年级主任, module: grade, type: dialog, size: md, parent: PAGE-GRD-LIST, batch: "2-2", note: "PRD 6.1 写明为弹窗；任职清单用列表渲染，不在弹窗内放表格" }
  - { id: PAGE-GRD-ARCHIVE, name: 归档确认, module: grade, type: dialog, size: sm, parent: PAGE-GRD-LIST, batch: "2-2" }

  # ---- 班级管理 ----
  - { id: PAGE-CLS-LIST, name: 班级管理列表, module: class, type: page, route: /edu/class/list, template: TPL-LIST, batch: "2-3" }
  - { id: PAGE-CLS-DETAIL, name: 班级详情, module: class, type: detail, route: /edu/class/detail, parent: PAGE-CLS-LIST, batch: "2-3", note: "PRD 6.1 写明为详情页（独立页）；顶部基本信息卡 + 4 个页签（花名册 / 任课教师 / 班主任任职历史 / 变更记录）；已交付（2-3b），外壳登记在 EXTRA_PAGES" }
  - { id: PAGE-CLS-CREATE, name: 新建班级, module: class, type: dialog, size: md, parent: PAGE-CLS-LIST, batch: "2-3", note: "CR-009 / D-059：表单类浮层用弹窗（原登记为 drawer，与 D-059 冲突）" }
  - { id: PAGE-CLS-BATCH, name: 批量生成班级, module: class, type: dialog, size: md, parent: PAGE-CLS-LIST, batch: "2-3", note: "CR-009：PRD 6.1 写明为弹窗，原登记的 drawer 与 PRD 不一致，按上游优先修正" }
  - { id: PAGE-CLS-ROSTER-ADD, name: 添加学生, module: class, type: page, route: /edu/class/roster/add, parent: PAGE-CLS-DETAIL, batch: "2-3", note: "CR-009 / D-059：含检索列表（等价含表格）用独立页，原登记为 drawer" }
  - { id: PAGE-CLS-TRANSFER, name: 调班, module: class, type: dialog, size: sm, parent: PAGE-CLS-DETAIL, batch: "2-3" }
  - { id: PAGE-CLS-LEADER, name: 指定 / 变更班主任, module: class, type: dialog, size: md, parent: PAGE-CLS-LIST, batch: "2-3", note: "CR-009 补登记：REQ-CLS-006 / 048 / 050 要求，班主任的唯一写入入口（DP-01）" }
  - { id: PAGE-CLS-COPY, name: 复制班级, module: class, type: dialog, size: md, parent: PAGE-CLS-LIST, batch: "2-3", note: "CR-009 补登记：REQ-CLS-061，不复制花名册与班主任" }
  - { id: PAGE-CLS-MOVE, name: 批量迁学生, module: class, type: page, route: /edu/class/move-students, parent: PAGE-CLS-LIST, batch: "2-3", note: "CR-009 补登记：REQ-CLS-062，含影响预览表格，按 D-059 用独立页" }
  - { id: PAGE-CLS-ROSTER-IMPORT, name: 编班表导入向导, module: class, type: wizard, route: /edu/class/import-roster, batch: "2-4", note: "2-4 已交付：按班级列的编班表（一行一学生含目标班级列，REQ-CLS-035）、两阶段校验（REQ-CLS-036）、导入幂等（REQ-CLS-037）；模板 4 列见 GAP-056" }
  - { id: PAGE-CLS-TEACHING, name: 教学班管理, module: class, type: page, route: /edu/class/teaching, template: TPL-LIST, batch: "2-7", note: "2-7b 待产出：教学班列表（组合 / 班级名 / 人数 / 任课教师 / 状态）；行政班与教学班两套独立关系（PRD 硬约束）" }
  - { id: PAGE-CLS-MERGE, name: 班级合并, module: class, type: wizard, route: /edu/class/merge, batch: deferred, note: "PRD 已标明延后，本轮不做" }

  # ---- 升班与学籍异动 ----
  - { id: PAGE-PRM-LIST, name: 升班任务列表, module: promotion, type: page, route: /edu/promotion/list, template: TPL-LIST, batch: "2-3", note: "2-3e 首件样板已交付（2-3e-s1）：列表页 + 同页确认片段 DIALOG-PRM-CANCEL；按钮与权限按 CR-012（新建 = create，预览 / 执行 / 重试 / 取消 = update，read 决定列表可见性）" }
  - { id: DIALOG-PRM-CANCEL, name: 取消升班任务确认, module: promotion, type: dialog, size: sm, parent: PAGE-PRM-LIST, batch: "2-3", note: "CR-013 补登记：PRD 6.1 的同页浮层片段，原因必填；取消后保留已完成部分、不做整批回滚（已确认 4 / REQ-PRM-036）" }
  - { id: PAGE-PRM-CREATE, name: 新建升班任务, module: promotion, type: wizard, route: /edu/promotion/create, batch: "2-3", note: "2-3e-s2 已交付：向导第一步（选择源 / 目标学年学期 + 目标年级班级齐备性校验 + 在读规模与耗时预估）；步骤条可点，第 2 ~ 4 步为后续小批，点击给批次提示" }
  - { id: PAGE-PRM-PREVIEW, name: 升班预览与调整, module: promotion, type: wizard, route: /edu/promotion/preview, batch: "2-3", note: "2-3e-s3 已交付：双栏（左源班级按 REQ-PRM-013 分组 + 批量指定目标班级 REQ-PRM-018，右逐学生明细）；只读角色无调整入口；含调整弹窗片段 PAGE-PRM-ADJUST" }
  - { id: PAGE-PRM-ADJUST, name: 调整学生去向, module: promotion, type: dialog, size: md, parent: PAGE-PRM-PREVIEW, batch: "2-3", note: "CR-009 补登记：promotion PRD 6.3 与 REQ-PRM-017 / 018 要求；留级 / 转班 / 毕业 / 跳过。2-3e-s3 已交付：处理方式决定结果类型与必填项（留级去向 = 同学段同名年级，BR-PROMO-006；转班必须指定目标班级）" }
  - { id: PAGE-PRM-VALIDATE, name: 升班校验结果, module: promotion, type: wizard, route: /edu/promotion/validate, batch: "2-3", note: "2-3e-s4 已交付：通过 / 警告 / 错误三分类统计（REQ-PRM-023）+ 按维度下钻（REQ-PRM-026）+ 错误项「标记跳过」放行（REQ-PRM-025）+ 存在错误时确认执行被拦；容量超限只警告（REQ-PRM-024）" }
  - { id: PAGE-PRM-EXECUTE, name: 执行与进度, module: promotion, type: wizard, route: /edu/promotion/execute, batch: "2-3", note: "2-3e-s4 已交付：进度条（已处理 / 总数 REQ-PRM-031）+ 成功 / 失败 / 留级 / 毕业计数 + 最近处理记录时间线 + 「可离开页面」口径 + 排队中形态；取消入口指向任务列表的行内取消" }
  - { id: PAGE-PRM-RESULT, name: 执行结果与重试, module: promotion, type: page, route: /edu/promotion/result, batch: "2-3", note: "2-3e-s4 已交付：四类清单切换（成功 / 失败 / 留级 / 毕业 REQ-PRM-034）+ 失败原因逐条（REQ-PRM-032）+ 只重试失败项 / 继续执行剩余项 + 结果导出（DS-DENY-04 重新解析范围）" }
  - { id: PAGE-PRM-CHANGE, name: 学籍异动登记, module: promotion, type: dialog, size: md, parent: PAGE-STU-DETAIL, batch: "2-5", note: "2-5 已交付：与 PAGE-STU-STATUS 同字段集、同接口 changeEnrollmentStatus（字段只有一个写入口，DP-01）；额外强制阶段限制（义务教育不得开除）与审批要求（退学 / 开除 / 死亡需校级管理员审批）" }
  - { id: PAGE-PRM-TRANSFER, name: 跨校转学, module: promotion, type: wizard, route: /edu/promotion/transfer, batch: "2-5", note: "2-5 已交付：转入校视角四步（待接收清单 → 核对与接收 → 接收确认 → 报到）；接收动作本身即审批（已确认 3）、接收前不计入在读数（REQ-PRM-053）、未报到前可撤销接收（REQ-PRM-054）" }
  - { id: PAGE-PRM-HISTORY, name: 异动历史, module: promotion, type: page, route: /edu/promotion/history, template: TPL-LIST, batch: "2-5", note: "2-5 已交付：筛选（类型 / 学年学期 / 年级 / 生效日期）+ 追加式记录表（类型·生效日期·原状态·新状态·操作人·原因）+ 行内「查看学生」+「异动登记」入口唯一（跳学生列表并由 data-panel-hash 打开 PAGE-PRM-CHANGE）" }

  # ---- 学校管理 ----
  - { id: PAGE-SCH-LIST, name: 学校管理列表, module: school, type: page, route: /edu/school/list, template: TPL-LIST, batch: "2-6" , note: "2-6a 已交付：学校列表（名称 / 编码 / 学段 / 校区数 / 班级数 / 在读学生 / 状态 / 所属租户）；校区数可点跳校区管理（GAP-046 选项 A）；空数据 / 加载中 / 查询失败 / 无权限 / 提交中五类状态" }
  - { id: PAGE-SCH-DETAIL, name: 学校详情, module: school, type: detail, parent: PAGE-SCH-LIST, batch: "2-6" , note: "2-6a 已交付：详情抽屉三个分区（基本信息 / 规模概览 / 学段配置）+ 底部操作条（编辑 / 校区管理 / 学段配置 / 停用学校）" }
  - { id: PAGE-SCH-CREATE, name: 新建学校, module: school, type: dialog, size: md, parent: PAGE-SCH-LIST, batch: "2-6" , note: "2-6a 已交付：新建学校弹窗（CR-015 由抽屉改为弹窗）：名称必填、所属租户必选、至少一个学段、编码系统生成" }
  - { id: PAGE-SCH-EDIT, name: 编辑学校, module: school, type: dialog, size: md, parent: PAGE-SCH-LIST, batch: "2-6" , note: "2-6a 已交付：编辑学校弹窗；编码与所属租户只读（编码变更走 updateSchoolCode 并写审计）" }
  - { id: PAGE-SCH-CAMPUS, name: 校区管理, module: school, type: page, route: /edu/school/campus, parent: PAGE-SCH-DETAIL, batch: "2-6", note: "CR-008 / D-059：含表格与分页的内容用独立页，不用抽屉或弹窗" }
  - { id: PAGE-SCH-STAGE, name: 学段配置, module: school, type: dialog, size: sm, parent: PAGE-SCH-DETAIL, batch: "2-6" , note: "2-6a 已交付：学段配置弹窗；学段序号固定映射（小学 1–6、初中 / 高中 1–3，RV-GRD-03）" }
