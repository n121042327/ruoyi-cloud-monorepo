schema_version: "1.0"
purpose: |
  动作清单：把每个页面上的按钮、链接、行操作、表单提交，翻译成"触发 → 条件 → 结果 → 权限 → 接口"。
  原型里出现的任何可点击元素都必须在这里登记；这里没有登记的元素不允许出现在原型中。

naming:
  action_id: "ACT-<模块缩写>-<三位序号>，一经登记不得重排"
  api: "建议 operationId，阶段 4 概要设计定稿后才算权威值"
  status_values: [待开始, 待验收, 已验收, 已实现]

fields:
  id: 动作编号
  page: 所属页面（对应 navigation.yaml 的 pages.id）
  element: 页面上显示的文字或图标
  trigger: 触发方式
  condition: 显示或可用条件
  permission: 所需功能权限（05-permission-matrix.yaml 的「角色 / 资源 / 操作」）
  confirm: 是否需要二次确认，需要时写清文案要素
  api: 建议接口
  result: 触发后的结果（含跳转与提示）
  audit: 是否写入审计
  batch: 归属批次

# ---------------------------------------------------------------------------
# 1. 通用动作（所有列表页共用，原型中按同一形态实现）
# ---------------------------------------------------------------------------
common_actions:
  - { id: ACT-COM-001, element: 搜索, trigger: 点击 / 回车, condition: 有查询权限, permission: "继承当前页面 read", api: "当前页面 list 接口", result: 按筛选条件重新查询并回到第 1 页, batch: "2-1" }
  - { id: ACT-COM-002, element: 重置, trigger: 点击, condition: 始终可用, permission: "继承当前页面 read", api: "-", result: 清空筛选条件并重新查询, batch: "2-1" }
  - { id: ACT-COM-003, element: 显示搜索 / 隐藏搜索, trigger: 点击, condition: 始终可用, permission: "-", api: "-", result: 折叠或展开搜索卡片，状态写入用户偏好, batch: "2-1" }
  - { id: ACT-COM-004, element: 列配置, trigger: 点击, condition: 始终可用, permission: "-", api: "-", result: 打开列选择浮层，勾选后立即生效并写入用户偏好, batch: "2-1" }
  - { id: ACT-COM-005, element: 刷新, trigger: 点击, condition: 始终可用, permission: "-", api: "当前页面 list 接口", result: 按当前条件重新查询，不重置页码, batch: "2-1" }
  - { id: ACT-COM-006, element: 分页器, trigger: 翻页 / 改每页条数 / 跳页, condition: 总数大于 0, permission: "继承当前页面 read", api: "当前页面 list 接口", result: 加载对应页数据，保留筛选条件, batch: "2-1" }
  - { id: ACT-COM-007, element: 导出, trigger: 点击, condition: 有导出权限, permission: "data.export:export", confirm: "导出行数超过 2000 时提示转异步", api: "exportData", result: "少于等于 2000 行直接下载，否则转异步任务并提示任务编号", audit: 是, batch: "2-1" }
  - { id: ACT-COM-008, element: 批量选择, trigger: 勾选行 / 全选, condition: 页面启用批量操作, permission: "-", api: "-", result: "批量按钮由禁用变为可用；单选限制时只有一个勾选才可用", batch: "2-1" }

# ---------------------------------------------------------------------------
# 2. 学生管理列表（PAGE-STU-LIST）——批次 2-1 样板页
# ---------------------------------------------------------------------------
student_list:
  page: PAGE-STU-LIST
  actions:
    - id: ACT-STU-001
      element: 新增
      trigger: 点击
      condition: 有新增权限
      permission: "academic_director / person.student / create"
      api: "-"
      result: 打开 PAGE-STU-CREATE 抽屉，重置为默认值
      audit: 否
      batch: "2-1"
    - id: ACT-STU-002
      element: 导入
      trigger: 点击
      condition: 有导入权限
      permission: "data.import:import"
      api: "-"
      result: 打开 PAGE-STU-IMPORT 导入向导
      audit: 否
      batch: "2-1"
    - id: ACT-STU-003
      element: 导出
      trigger: 点击
      condition: 有导出权限
      permission: "data.export:export"
      confirm: 需要，提示"将按当前筛选条件导出，超出 2000 行转后台任务"
      api: exportStudent
      result: 下载文件或返回任务编号
      audit: 是
      batch: "2-1"
    - id: ACT-STU-004
      element: 下载模板
      trigger: 点击
      condition: 有导入权限
      permission: "data.import:import"
      api: downloadStudentImportTemplate
      result: 下载当前版本的导入模板，版本号在文件内可见
      audit: 是
      batch: "2-1"
    - id: ACT-STU-005
      element: 行内编辑
      trigger: 点击行内按钮
      condition: 有编辑权限且行在数据范围内
      permission: "homeroom / person.student_contact / update；academic_director / person.student / update"
      api: "-"
      result: 打开 PAGE-STU-EDIT 抽屉，按字段级权限渲染只读与可写
      audit: 否
      batch: "2-1"
    - id: ACT-STU-006
      element: 行内异动
      trigger: 点击行内按钮
      condition: 当前学籍状态存在可选流转
      permission: "enrollment.transfer:create"
      api: "-"
      result: 打开 PAGE-STU-STATUS 弹窗，选项按当前状态动态计算；终态学生该按钮不出现
      audit: 否
      batch: "2-5"
    - id: ACT-STU-007
      element: 行内调班
      trigger: 点击行内按钮
      condition: 当前学年学期且行在数据范围内
      permission: "academic_director / org.class / update"
      api: "-"
      result: 打开 PAGE-STU-TRANSFER 弹窗
      audit: 否
      batch: "2-5"
    - id: ACT-STU-008
      element: 点击行
      trigger: 单击数据行
      condition: 有读取权限
      permission: "person.student:read"
      api: getStudent
      result: 打开 PAGE-STU-DETAIL 详情，关闭后回到列表并保留筛选与页码
      audit: 否
      batch: "2-1"
    - id: ACT-STU-009
      element: 证件号后四位
      trigger: 输入并回车
      condition: 具备敏感字段读取权限
      permission: "read_sensitive"
      api: listStudent
      result: 精确匹配证件号后四位；无该权限时该筛选项整体不出现
      audit: 否
      batch: "2-1"
    - id: ACT-STU-010
      element: 查看完整证件号
      trigger: 点击掩码旁图标
      condition: 具备敏感字段读取权限
      permission: "read_sensitive"
      confirm: 需要，提示"查看完整证件号将记录访问日志"
      api: "-"
      result: 就地展示完整值，并写入访问日志
      audit: 是
      pages: [PAGE-STU-LIST, PAGE-STU-EDIT, PAGE-STU-DETAIL]
      note: 该动作在列表、编辑抽屉与详情页三处复用；角色归属（read_sensitive）待确认，见 GAP-026
      batch: "2-1"

# ---------------------------------------------------------------------------
# 3. 学生新增 / 编辑抽屉（PAGE-STU-CREATE / PAGE-STU-EDIT）——批次 2-1 样板
# ---------------------------------------------------------------------------
student_form:
  page: [PAGE-STU-CREATE, PAGE-STU-EDIT]
  actions:
    - id: ACT-STU-011
      element: 下一步
      trigger: 点击
      condition: 当前步骤校验通过
      permission: "继承当前页面"
      api: "-"
      result: 进入下一步；校验失败时停留并高亮错误字段
      audit: 否
      batch: "2-1"
    - id: ACT-STU-012
      element: 上一步
      trigger: 点击
      condition: 非第一步
      permission: "继承当前页面"
      api: "-"
      result: 返回上一步，已填内容保留
      audit: 否
      batch: "2-1"
    - id: ACT-STU-013
      element: 保存
      trigger: 点击
      condition: 必填与唯一性校验通过
      permission: "academic_director / person.student / create 或 update"
      confirm: 否
      api: addStudent / updateStudent
      result: 保存成功；新增时展示系统发号结果与"继续新增 / 查看详情"两个后续动作
      audit: 是
      batch: "2-1"
    - id: ACT-STU-014
      element: 取消 / 关闭
      trigger: 点击
      condition: 始终可用
      permission: "继承当前页面"
      confirm: 需要，提示"已填写的内容不会保存"
      api: "-"
      result: 关闭抽屉，不保存任何数据
      audit: 否
      batch: "2-1"
    - id: ACT-STU-015
      element: 添加监护人
      trigger: 点击
      condition: 已填监护人数少于上限
      permission: "homeroom / person.student_guardian / update"
      api: saveStudentGuardian
      result: 新增一行监护人录入项；达到上限时按钮禁用并说明上限来源
      audit: 是
      batch: "2-1"
    - id: ACT-STU-016
      element: 删除监护人
      trigger: 点击行内删除
      condition: 至少保留一行或允许全空
      permission: "homeroom / person.student_guardian / update"
      confirm: 需要，提示"删除后需保存才生效"
      api: saveStudentGuardian
      result: 移除该行
      audit: 是
      batch: "2-1"
    - id: ACT-STU-017
      element: 设为主要联系人
      trigger: 点击单选
      condition: 监护人至少一行
      permission: "homeroom / person.student_guardian / update"
      api: saveStudentGuardian
      result: 同一学生只允许一个主要联系人，选中后其余自动取消
      audit: 是
      batch: "2-1"
    - id: ACT-STU-018
      element: 修改学号（首轮不提供）
      trigger: 抽屉内"高级操作"菜单
      condition: 首轮不渲染该入口；学号一经发出不可改（GAP-030 裁决 B，2026-09-30 用户确认）
      permission: "-"
      api: "-"
      result: 首轮任何角色都看不到修改学号入口；确需更正时由平台运营创建工单处理
      audit: 是
      batch: "deferred"
      note: 学号是登录名来源（s + 学号），改号会导致学生无法登录；延后实现，见 CR-003
    - id: ACT-STU-019
      element: 批量导出
      trigger: 勾选多行后点击
      condition: 已勾选至少 1 行且有 data.export:export 权限
      permission: "data.export:export"
      confirm: 需要，提示"将导出当前筛选条件下的 N 行；超出 2000 行转后台任务"
      api: exportStudent
      result: 少于等于 2000 行直接下载，否则转异步并提示任务编号
      audit: 是
      batch: "2-1"
    - id: ACT-STU-020
      element: 批量调班
      trigger: 勾选多行后点击
      condition: 当前学年学期且在数据范围内（CR-035 / GAP-066 后：批量调班复用班级模块的 transferClass，单条 = 调班，多条 = 批量迁移）
      permission: "academic_director / org.class / update"
      confirm: 需要，提示"将把 N 名学生调整到 X 班；逐条校验范围，任一条越权则整体拒绝"
      api: transferClass
      result: 打开批量调班弹窗（目标班级 + 生效日期 + 原因），确认后执行并写审计
      audit: 是
      batch: "2-1"
    - id: ACT-STU-021
      element: 上传 / 更换学生照片
      trigger: 抽屉内点击
      condition: 有 person.student 的 create 或 update 权限
      permission: "person.student:create / update"
      api: uploadStudentPhoto
      result: 单张上传；保存后只展示缩略图；格式与大小限制由文件服务统一校验
      audit: 是
      batch: "2-1"
    - id: ACT-STU-022
      element: 查看照片原图
      trigger: 点击缩略图
      condition: 具备 read_sensitive
      permission: "read_sensitive"
      api: getStudentPhoto
      result: 展示原图并写入访问日志（查看人、对象、字段、时间、用途说明）
      audit: 是
      batch: "2-1"

# ---------------------------------------------------------------------------
# 3.1 教师管理列表（PAGE-TCH-LIST）——批次 2-2a 样板页
# ---------------------------------------------------------------------------
teacher_list:
  page: PAGE-TCH-LIST
  actions:
    - id: ACT-TCH-001
      element: 新增
      trigger: 点击
      condition: 有 person.teacher:create 权限
      permission: "academic_director / tenant_admin / person.teacher / create"
      api: "-"
      result: 打开 PAGE-TCH-CREATE 三步抽屉（基本信息 → 联系方式 → 任职信息），重置为默认值
      audit: 否
      batch: "2-2"
    - id: ACT-TCH-002
      element: 导入
      trigger: 点击
      condition: 有 data.import:import 权限
      permission: "data.import:import"
      api: "-"
      result: 打开 PAGE-TCH-IMPORT 导入向导（批次 2-4）
      audit: 否
      batch: "2-4"
      pages: [PAGE-TCH-LIST]
    - id: ACT-TCH-003
      element: 导出
      trigger: 点击
      condition: 有 data.export:export 权限
      permission: "data.export:export"
      confirm: 需要，提示"将按当前筛选条件导出，超出 2000 行转后台任务"
      api: exportTeacher
      result: 直接下载或返回任务编号
      audit: 是
      batch: "2-2"
    - id: ACT-TCH-004
      element: 下载模板
      trigger: 点击
      condition: 有 data.import:import 权限
      permission: "data.import:import"
      api: downloadTeacherImportTemplate
      result: 下载当前版本的教师导入模板
      audit: 是
      batch: "2-2"
    - id: ACT-TCH-005
      element: 批量设置任教
      trigger: 勾选多行后点击
      condition: 已勾选至少 1 行且有 person.teaching_assignment:create 权限
      permission: "academic_director / grade_leader / person.teaching_assignment / create"
      confirm: 需要，提示"将为 N 名教师设置任教关系；逐条校验数据范围，任一条越权则整体拒绝（DS-DENY-06）"
      api: batchSaveTeachingAssignment
      result: 打开 PAGE-TCH-ASSIGN 任教关系页并带入已选教师（批次 2-2b）
      audit: 是
      batch: "2-2"
    - id: ACT-TCH-006
      element: 行内编辑
      trigger: 点击行内按钮
      condition: 有 person.teacher:update、行在数据范围内且当前状态为在职（CR-030 / GAP-075 裁决 A）
      permission: "academic_director / tenant_admin / person.teacher / update"
      api: "-"
      result: 打开 PAGE-TCH-EDIT 抽屉，按字段级权限渲染只读与可写；详情页内的"编辑"复用同一动作
      audit: 否
      batch: "2-2"
      pages: [PAGE-TCH-LIST, PAGE-TCH-DETAIL]
    - id: ACT-TCH-007
      element: 行内角色
      trigger: 点击行内按钮
      condition: 有 person.teacher:update 权限且当前状态为在职（CR-030 / GAP-075 裁决 A）
      permission: "academic_director / tenant_admin / person.teacher / update"
      api: "-"
      result: 打开 PAGE-TCH-ROLE 弹窗；选年级主任时必须选学年学期与年级
      audit: 是
      batch: "2-2"
      pages: [PAGE-TCH-LIST, PAGE-TCH-DETAIL, PAGE-TCH-ROLE]
      pages: [PAGE-TCH-LIST, PAGE-TCH-DETAIL]
    - id: ACT-TCH-008
      element: 行内任教
      trigger: 点击行内按钮
      condition: 有 person.teaching_assignment 的 read 权限且当前状态为在职（CR-030 / GAP-075 裁决 A）
      permission: "person.teaching_assignment:read"
      api: "-"
      result: 打开 PAGE-TCH-ASSIGN 任教关系页，默认按当前学年学期加载
      audit: 否
      batch: "2-2"
      pages: [PAGE-TCH-LIST, PAGE-TCH-DETAIL, PAGE-TCH-ASSIGN]
      pages: [PAGE-TCH-LIST, PAGE-TCH-DETAIL]
    - id: ACT-TCH-009
      element: 行内离职 / 调离
      trigger: 点击行内按钮
      condition: 有 person.teacher:update 且当前状态为在职
      permission: "academic_director / tenant_admin / person.teacher / update"
      confirm: 需要，提示"登记离职后该教师不再出现在任教关系选择项中，历史关系保留"
      api: "-"
      result: 打开 PAGE-TCH-LEAVE 弹窗，登记类型、生效日期与原因（批次 2-2b）
      audit: 是
      batch: "2-2"
      pages: [PAGE-TCH-LIST, PAGE-TCH-DETAIL]
    - id: ACT-TCH-040
      element: 行内撤销离职 / 调离登记
      trigger: 点击行内按钮
      condition: 有 person.teacher:update 且当前状态为离职或调离（CR-030 / GAP-075 裁决 A）
      permission: "academic_director / tenant_admin / person.teacher / update"
      api: revokeTeacherLeave
      result: 打开 DIALOG-TCH-REVOKE 二次确认；撤销后该教师恢复在职、账号自动重新启用，教育角色不自动恢复（REQ-TCH-071），原登记与本次撤销都写审计（REQ-TCH-062）
      audit: 是
      batch: "2-2"
      pages: [PAGE-TCH-LIST]
    - id: ACT-TCH-010
      element: 点击行
      trigger: 单击数据行
      condition: 有 person.teacher:read 权限
      permission: "person.teacher:read"
      api: getTeacher
      result: 打开 PAGE-TCH-DETAIL 详情抽屉（基本信息 / 教育角色 / 任教关系 / 班主任任职 / 账号 / 变更记录），关闭后回到列表并保留筛选
      audit: 否
      batch: "2-2"
    - id: ACT-TCH-011
      element: 查看完整手机号
      trigger: 点击掩码旁图标
      condition: 具备 read_contact
      permission: "read_contact"
      confirm: 需要，提示"查看完整手机号将记录访问日志"
      api: "-"
      result: 就地展示完整值并写访问日志
      audit: 是
      batch: "2-2"
      pages: [PAGE-TCH-LIST, PAGE-TCH-DETAIL, PAGE-TCH-EDIT]

# ---------------------------------------------------------------------------
# 3.2 教师详情（PAGE-TCH-DETAIL）——批次 2-2b-1
# ---------------------------------------------------------------------------
teacher_detail:
  page: PAGE-TCH-DETAIL
  actions:
    - id: ACT-TCH-012
      element: 解除教育角色
      trigger: 点击教育角色行内"解除"
      condition: 有 person.teacher:update 权限且该角色在操作人管理范围内
      permission: "academic_director / tenant_admin / person.teacher / update"
      confirm: 需要，提示"解除 {role_name} 后立即失效该用户的数据范围缓存，历史任职记录保留"
      api: removeTeacherEduRole
      result: 角色解除并写审计；随后刷新详情与列表的"教育角色"列
      audit: 是
      batch: "2-2"
      pages: [PAGE-TCH-DETAIL, PAGE-TCH-ROLE]
    - id: ACT-TCH-013
      element: 停用 / 启用账号
      trigger: 点击
      condition: 有 person.teacher:update 权限
      permission: "academic_director / tenant_admin / person.teacher / update"
      confirm: 需要，提示"停用后该教师登录被拒绝；历史任教关系与审计记录保留"
      api: changeTeacherAccountStatus
      result: 账号状态切换并写审计；离职登记会自动停用账号（REQ-TCH-061）
      audit: 是
      batch: "2-2"
    - id: ACT-TCH-014
      element: 重置密码
      trigger: 点击
      condition: 有 person.teacher:update 权限
      permission: "academic_director / tenant_admin / person.teacher / update"
      confirm: 需要，提示"旧凭据立即失效；新的一次性凭据由学校分发，首次登录强制修改"
      api: resetTeacherPassword
      result: 生成一次性初始凭据并写审计；任何位置都不展示明文密码
      audit: 是
      batch: "2-2"
    - id: ACT-TCH-015
      element: 复制上一学年的任教关系
      trigger: 点击
      condition: 有 person.teaching_assignment:create 权限且存在可复制的历史学年学期
      permission: "academic_director / person.teaching_assignment / create"
      confirm: 需要，提示"将按 教师 + 学科 + 班级 整体复制到目标学年学期；目标已存在的有效关系跳过"
      api: copyTeachingAssignment
      result: 展示源与目标学年学期、冲突清单预览；确认后异步执行并返回任务编号（REQ-TCH-070）
      audit: 是
      batch: "2-2"
      pages: [PAGE-TCH-DETAIL, PAGE-TCH-ASSIGN]
    - id: ACT-TCH-016
      element: 前往班级详情
      trigger: 点击班主任任职分组内的链接
      condition: 有 org.class:read 权限且该班级在数据范围内
      permission: "org.class:read"
      api: getClass
      result: 跳转 PAGE-CLS-DETAIL（批次 2-3）；班主任关系只读，修改入口在班级模块
      audit: 否
      batch: "2-3"
      pages: [PAGE-TCH-DETAIL, PAGE-TCH-ASSIGN]
    - id: ACT-TCH-017
      element: 展开 / 收起学年学期分组
      trigger: 点击分组标题右侧链接
      condition: 任教关系分组存在
      permission: "person.teaching_assignment:read"
      api: "-"
      result: 折叠或展开该学年学期的任教关系；当前学年学期默认展开，折叠状态写入用户偏好
      audit: 否
      batch: "2-2"
      pages: [PAGE-TCH-DETAIL, PAGE-TCH-ASSIGN]
    - id: ACT-TCH-018
      element: 关闭详情
      trigger: 点击
      condition: 始终可用
      permission: "person.teacher:read"
      api: "-"
      result: 关闭详情抽屉并回到列表，保留筛选条件、页码与列配置
      audit: 否
      batch: "2-2"
    - id: ACT-TCH-029
      element: 查看全部变更记录
      trigger: 点击变更记录分组内"查看全部"
      condition: 有 audit.log:read 权限
      permission: "audit.log:read"
      api: listAuditLog
      result: 跳转 PAGE-AUDIT-LOG-LIST（批次 2-8）并按当前教师对象预置筛选条件
      audit: 是
      batch: "2-8"
      note: 详情页内只展示近 5 条时间线形态，全量查询在审计模块

# ---------------------------------------------------------------------------
# 3.3 教师新增 / 编辑抽屉（PAGE-TCH-CREATE / PAGE-TCH-EDIT）——批次 2-2b-1
# ---------------------------------------------------------------------------
teacher_form:
  page: [PAGE-TCH-CREATE, PAGE-TCH-EDIT]
  actions:
    - id: ACT-TCH-019
      element: 下一步
      trigger: 点击
      condition: 当前步骤校验通过（新增抽屉三步）
      permission: "继承当前页面"
      api: "-"
      result: 进入下一步；校验失败时停留、字段标红并显示顶部汇总
      audit: 否
      batch: "2-2"
    - id: ACT-TCH-020
      element: 上一步
      trigger: 点击
      condition: 非第一步
      permission: "继承当前页面"
      api: "-"
      result: 返回上一步，已填内容保留
      audit: 否
      batch: "2-2"
    - id: ACT-TCH-021
      element: 保存
      trigger: 点击
      condition: 必填、格式与唯一性校验通过；编辑时字段级权限允许
      permission: "academic_director / tenant_admin / person.teacher / create 或 update"
      confirm: 否
      api: addTeacher / updateTeacher
      result: 新增成功后展示登录名与一次性凭据说明，并给出"继续新增 / 查看详情 / 立即设置任教"；编辑成功后就地刷新详情与列表
      audit: 是
      batch: "2-2"
    - id: ACT-TCH-022
      element: 取消 / 关闭
      trigger: 点击
      condition: 始终可用
      permission: "继承当前页面"
      confirm: 需要，打开 DIALOG-TCH-DISCARD 确认"已填写的内容不会保存"
      api: "-"
      result: 打开放弃确认弹窗；确认后关闭抽屉且不保存任何数据
      audit: 否
      batch: "2-2"
      pages: [PAGE-TCH-CREATE, PAGE-TCH-EDIT, PAGE-TCH-ROLE]
    - id: ACT-TCH-023
      element: 修改工号
      trigger: 编辑抽屉内修改工号并保存
      condition: 具备校级管理员权限（矩阵中 person.teacher:update，当前为租户管理员）
      permission: "tenant_admin / person.teacher / update"
      confirm: 需要，提示"修改工号将写入审计，记录变更前后值与授权角色；工号变更后登录名不自动跟随"
      api: updateTeacher
      result: 工号变更并强制留审计
      audit: 是
      batch: "2-2"
      note: 教师 PRD 4.4 的字段级矩阵把"校领导"列为可改工号与部分字段，与 05-permission-matrix.yaml 中校领导对 person.teacher 仅有 read 冲突，见 GAP-032
    - id: ACT-TCH-024
      element: 继续新增
      trigger: 新增成功提示条内点击
      condition: 有 person.teacher:create 权限
      permission: "academic_director / tenant_admin / person.teacher / create"
      api: "-"
      result: 关闭结果提示并重置表单为空白，停留在新增抽屉
      audit: 否
      batch: "2-2"
    - id: ACT-TCH-025
      element: 查看详情
      trigger: 新增成功提示条内点击
      condition: 有 person.teacher:read 权限
      permission: "person.teacher:read"
      api: getTeacher
      result: 关闭新增抽屉并打开刚创建教师的 PAGE-TCH-DETAIL
      audit: 否
      batch: "2-2"
    - id: ACT-TCH-026
      element: 立即设置任教
      trigger: 新增成功提示条内点击
      condition: 有 person.teaching_assignment:create 权限
      permission: "person.teaching_assignment:create"
      api: "-"
      result: 关闭新增抽屉并进入 PAGE-TCH-ASSIGN（批次 2-2b-2），带入刚创建的教师
      audit: 否
      batch: "2-2b-2"
    - id: ACT-TCH-027
      element: 放弃并关闭
      trigger: 点击
      condition: 放弃确认弹窗已打开
      permission: "继承当前页面"
      api: "-"
      result: 关闭表单抽屉与确认弹窗，不保存任何数据
      audit: 否
      batch: "2-2"
    - id: ACT-TCH-028
      element: 继续填写
      trigger: 点击
      condition: 放弃确认弹窗已打开
      permission: "继承当前页面"
      api: "-"
      result: 关闭确认弹窗并回到表单抽屉，已填内容保留
      audit: 否
      batch: "2-2"

# ---------------------------------------------------------------------------
# 3.4 教育角色分配（PAGE-TCH-ROLE）——批次 2-2b-2
# ---------------------------------------------------------------------------
teacher_role:
  page: PAGE-TCH-ROLE
  actions:
    - id: ACT-TCH-030
      element: 新增年级主任任职 / 收起
      trigger: 点击
      condition: 有 person.teacher:update 权限
      permission: "academic_director / tenant_admin / person.teacher / update"
      api: "-"
      result: 展开或收起「年级主任任职」录入表单；年级主任必须绑定学年学期与年级（REQ-TCH-027）
      audit: 否
      batch: "2-2"
    - id: ACT-TCH-031
      element: 加入待保存
      trigger: 点击
      condition: 学年学期与年级已选、有 person.teacher:update 权限
      permission: "academic_director / tenant_admin / person.teacher / update"
      api: "-"
      result: 把该条年级主任任职加入待保存列表；点「保存」后统一提交，唯一性由服务端判定（REQ-TCH-030）
      audit: 否
      batch: "2-2"
    - id: ACT-TCH-032
      element: 保存
      trigger: 点击
      condition: 有 person.teacher:update 权限，且任职范围在操作人管理范围内
      permission: "academic_director / tenant_admin / person.teacher / update"
      confirm: 需要，提示"角色变更后立即失效该用户的数据范围缓存，并写入审计（原角色、新角色、生效日期）"
      api: saveTeacherRole
      result: 保存学校级角色与年级主任任职；随后刷新详情页的教育角色分区与列表的教育角色列
      audit: 是
      batch: "2-2"

# ---------------------------------------------------------------------------
# 3.5 任教关系设置（PAGE-TCH-ASSIGN，独立页）——批次 2-2b-2
# ---------------------------------------------------------------------------
teacher_assign:
  page: PAGE-TCH-ASSIGN
  actions:
    - id: ACT-TCH-033
      element: 切换视角（班级视角 / 教师视角）
      trigger: 点击
      condition: 有 person.teaching_assignment:read 权限
      permission: "person.teaching_assignment:read"
      api: "-"
      result: 切换左侧选择器与右侧主体的组织方式；学年学期与筛选条件保留（REQ-TCH-044）
      audit: 否
      batch: "2-2"
    - id: ACT-TCH-034
      element: 选择主体
      trigger: 点击左侧列表中的班级或教师
      condition: 该主体在当前数据范围内
      permission: "person.teaching_assignment:read"
      api: listTeachingAssignment
      result: 右侧加载该班级 / 教师的任教关系，页头显示主体、类型与班主任或教育角色
      audit: 否
      batch: "2-2"
    - id: ACT-TCH-035
      element: 打开「新增任教关系」表单
      trigger: 点击工具条、空态或"待补充"行的"指定教师"
      condition: 有 person.teaching_assignment:create 权限且当前不是历史学年学期
      permission: "academic_director / grade_leader / person.teaching_assignment / create"
      api: "-"
      result: 定位到新增任教关系表单；历史学年学期只读，不提供该入口（REQ-TCH-043）
      audit: 否
      batch: "2-2"
    - id: ACT-TCH-036
      element: 失效任教关系
      trigger: 点击行内"失效"
      condition: 有 person.teaching_assignment:update 权限且该行在数据范围内、状态为生效中
      permission: "academic_director / grade_leader / person.teaching_assignment / update"
      confirm: 需要，提示"失效后保留历史记录，不再参与教学数据统计；相关教师与学生的数据范围缓存立即失效"
      api: disableTeachingAssignment
      result: 该条任教关系置为失效并写审计；列表刷新（REQ-TCH-040 / REQ-TCH-041）
      audit: 是
      batch: "2-2"
    - id: ACT-TCH-037
      element: 导出任教关系
      trigger: 点击
      condition: 有 data.export:export 权限
      permission: "data.export:export"
      confirm: 需要，提示"导出范围按当前视角与数据范围解析；年级主任限本年级，任课教师与班主任禁止导出"
      api: exportTeachingAssignment
      result: 直接下载或转异步任务；写入导出审计（REQ-TCH-056 ~ REQ-TCH-058）
      audit: 是
      batch: "2-2"
    - id: ACT-TCH-038
      element: 确认复制任教关系
      trigger: 点击复制弹窗内"确认复制"
      condition: 有 person.teaching_assignment:create 权限且已完成冲突预览
      permission: "academic_director / person.teaching_assignment / create"
      confirm: 需要，提示"目标学期已存在的有效关系跳过；待处理项不会写入"
      api: copyTeachingAssignment
      result: 异步执行并返回任务编号；重复提交不产生重复记录（REQ-TCH-070 / NFR-MQ-01）
      audit: 是
      batch: "2-2"
    - id: ACT-TCH-039
      element: 保存任教关系
      trigger: 点击
      condition: 学年学期、学科、任教教师、班级均合法且在数据范围内
      permission: "academic_director / grade_leader / person.teaching_assignment / create"
      api: saveTeachingAssignment
      result: 按"教师 + 学科 + 班级"逐条写入；已存在的有效关系跳过；任一条越权则整体拒绝（DS-DENY-06）
      audit: 是
      batch: "2-2"

# ---------------------------------------------------------------------------
# 4. 年级管理列表（PAGE-GRD-LIST）——批次 2-2b-2b 样板页
# ---------------------------------------------------------------------------
grade_list:
  page: PAGE-GRD-LIST
  actions:
    - id: ACT-GRD-001
      element: 新增
      trigger: 点击
      condition: 有 org.grade:create 权限
      permission: "academic_director / tenant_admin / org.grade / create"
      api: "-"
      result: 打开 PAGE-GRD-CREATE 抽屉，重置为默认值；年级名称按"入学年份 + 学段 + 学段内序号"预生成且允许微调
      audit: 否
      batch: "2-2"
    - id: ACT-GRD-002
      element: 按学段批量生成
      trigger: 点击
      condition: 有 org.grade:create 权限
      permission: "academic_director / tenant_admin / org.grade / create"
      api: "-"
      result: 打开 PAGE-GRD-BATCH 抽屉，选择学段与入学年份后一次生成该学段全部年级；已存在的年级列出冲突并跳过
      audit: 否
      batch: "2-2"
    - id: ACT-GRD-003
      element: 导出
      trigger: 点击
      condition: 有 data.export:export 权限
      permission: "data.export:export"
      confirm: 需要，提示"将按当前筛选条件导出；年级主任导出限本人负责的年级"
      api: exportGrade
      result: 直接下载或转异步任务；写入导出审计
      audit: 是
      batch: "2-2"
    - id: ACT-GRD-004
      element: 行内编辑
      trigger: 点击行内按钮
      condition: 有 org.grade:update 权限，且该年级不是已归档
      permission: "academic_director / tenant_admin / org.grade / update"
      api: "-"
      result: 打开年级表单的编辑态；学段与学段内序号只读，入学年份在有班级时只读（REQ-GRD-018 / REQ-GRD-019）
      audit: 否
      batch: "2-2"
      pending: "承载方式待 GAP-038 裁决：当前复用 PAGE-GRD-CREATE 的编辑态"
    - id: ACT-GRD-005
      element: 行内指定年级主任
      trigger: 点击行内按钮
      condition: 有 org.grade:update 权限，且该年级不是已归档
      permission: "academic_director / tenant_admin / org.grade / update"
      api: "-"
      result: 打开 PAGE-GRD-LEADER 弹窗，必须选择学年学期，可添加多条任职并标记一名主要负责人（REQ-GRD-022 / REQ-GRD-023）
      audit: 否
      batch: "2-2"
    - id: ACT-GRD-006
      element: 行内归档
      trigger: 点击行内按钮
      condition: 有 org.grade:update 权限，且该年级不是已归档
      permission: "academic_director / tenant_admin / org.grade / update"
      confirm: 需要，提示"归档后该年级不在新建班级的可选列表中，历史数据与统计仍可查"
      api: "-"
      result: 打开 PAGE-GRD-ARCHIVE 弹窗，二次确认并填写原因；归档写审计
      audit: 是
      batch: "2-2"
    - id: ACT-GRD-007
      element: 行内删除
      trigger: 点击行内按钮
      condition: 有 org.grade:delete 权限；仅当年级下无班级且无学生关系时该入口才渲染，接口同样校验
      permission: "academic_director / tenant_admin / org.grade / delete"
      api: "-"
      result: 打开 DIALOG-GRD-DELETE 二次确认弹窗；存在班级或学生关系时接口拒绝并提示改用归档（BR-GRADE-005）
      audit: 否
      batch: "2-2"
    - id: ACT-GRD-008
      element: 点击班级数
      trigger: 点击单元格内的数字
      condition: 有 org.class:read 权限且该年级在本次数据范围内
      permission: "org.class:read"
      api: "-"
      result: 跳转班级列表并带入该年级筛选，返回时保留年级上下文（REQ-GRD-008、AC-GRD-008）
      audit: 否
      batch: "2-3"
    - id: ACT-GRD-009
      element: 点击数据行 / 年级名称 / 操作列「详情」
      trigger: 单击行
      condition: 有 org.grade:read 权限且该年级在本次数据范围内
      permission: "org.grade:read"
      api: getGrade
      result: 打开 PAGE-GRD-DETAIL 详情抽屉；关闭后回到列表并保留筛选与页码
      audit: 否
      batch: "2-2"
    - id: ACT-GRD-010
      element: 确认删除
      trigger: 点击确认删除
      condition: 已填写删除原因（至少 5 个字）；调接口前再次校验是否无班级无学生关系
      permission: "academic_director / tenant_admin / org.grade / delete"
      confirm: 需要，弹窗内已写明对象、影响范围与不可物理删除的说明
      api: removeGrade
      result: 逻辑删除该年级，写入审计；「学校 + 学段 + 入学年份 + 学段内序号」组合被释放
      audit: 是
      batch: "2-2"
    - id: ACT-GRD-011
      element: 取消删除
      trigger: 点击取消或按 Esc
      condition: 始终可用
      permission: "-"
      api: "-"
      result: 关闭确认弹窗，不产生任何写入
      audit: 否
      batch: "2-2"

# ---------------------------------------------------------------------------
# 5. 其余页面
#     规则：每个批次开始时，把该批页面的动作追加到下面，并按本文件的字段定义登记。
#     批次 2-0 只定词汇与样板页；后续批次逐批补齐，未登记的动作不得出现在原型中。
# ---------------------------------------------------------------------------
grade_detail:
    page: PAGE-GRD-DETAIL
    actions:
      - id: ACT-GRD-012
        element: 详情内「编辑」
        trigger: 点击
        condition: 有 org.grade:update 权限且该年级未归档
        permission: "academic_director / tenant_admin / org.grade / update"
        api: "-"
        result: 打开 PAGE-GRD-CREATE 弹窗的编辑态；学段、学段内序号只读，有班级时入学年份只读
        audit: 否
        batch: "2-2"
      - id: ACT-GRD-013
        element: 详情内「指定年级主任」
        trigger: 点击
        condition: 有 org.grade:update 权限
        permission: "academic_director / tenant_admin / org.grade / update"
        api: "-"
        result: 打开 PAGE-GRD-LEADER 弹窗，带入当前年级
        audit: 否
        batch: "2-2"
      - id: ACT-GRD-014
        element: 详情内「查看全部班级」
        trigger: 点击
        condition: 有 org.class:read 权限
        permission: "org.class:read"
        api: "-"
        result: 跳转班级管理并带入该年级筛选；返回时保留年级上下文（REQ-GRD-008）
        audit: 否
        batch: "2-3"
      - id: ACT-GRD-015
        element: 详情内「关闭」
        trigger: 点击标题栏关闭或点「关闭」
        condition: 始终可用
        permission: "-"
        api: "-"
        result: 关闭详情抽屉，回到列表并保留筛选与页码
        audit: 否
        batch: "2-2"

grade_form:
    page: PAGE-GRD-CREATE
    actions:
      - id: ACT-GRD-016
        element: 按规则重新生成年级名称
        trigger: 点击
        condition: 始终可用
        permission: "-"
        api: "-"
        result: 按「入学年份 + 学段 + 学段内序号」重算名称，仍允许人工微调（REQ-GRD-011）
        audit: 否
        batch: "2-2"
      - id: ACT-GRD-017
        element: 取消
        trigger: 点击
        condition: 始终可用
        permission: "-"
        api: "-"
        result: 关闭弹窗，不写入；已填内容不保留
        audit: 否
        batch: "2-2"
      - id: ACT-GRD-018
        element: 保存
        trigger: 点击
        condition: 必填项齐全，且「学校 + 学段 + 年级名称」不重名
        permission: "academic_director / tenant_admin / org.grade / create"
        confirm: 否
        api: addGrade
        result: 前端先拦重名，接口再校验「学校 + 学段 + 入学年份 + 学段内序号」唯一；成功后写审计并刷新列表
        audit: 是
        batch: "2-2"

grade_batch:
    page: PAGE-GRD-BATCH
    actions:
      - id: ACT-GRD-019
        element: 选择学段 / 入学年份
        trigger: 选择
        condition: 有 org.grade:create 权限
        permission: "academic_director / tenant_admin / org.grade / create"
        api: "-"
        result: 按学段与入学年份重算「将生成的年级」清单，并标出已存在、将被跳过的年级
        audit: 否
        batch: "2-2"
      - id: ACT-GRD-020
        element: 取消
        trigger: 点击
