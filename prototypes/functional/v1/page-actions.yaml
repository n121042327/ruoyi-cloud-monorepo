      batch: "2-3"
    - id: ACT-CLS-003
      element: 导出
      trigger: 点击
      condition: 有 data.export:export 权限
      permission: "data.export:export"
      confirm: 需要，提示"将按当前筛选条件导出台账；年级主任导出限本人负责年级"
      api: exportClass
      result: 行数 ≤ 2000 直接下载，否则转异步任务；写入导出审计（REQ-CLS-054）
      audit: 是
      batch: "2-3"
    - id: ACT-CLS-004
      element: 行内「详情」
      trigger: 点击行内按钮或班级名称
      condition: 有 org.class:read 权限且该班级在本次数据范围内
