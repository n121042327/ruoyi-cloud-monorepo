      condition: 有 org.class:update 权限，且该班级不是已停用
      permission: "academic_director / grade_leader / org.class / update"
      api: "-"
      result: 打开班级表单的编辑态（复用 PAGE-CLS-CREATE 弹窗）；学年学期与年级只读（REQ-CLS-022），有花名册后班级类型只读（REQ-CLS-023）
      audit: 否
      batch: "2-3"
    - id: ACT-CLS-006
      element: 行内「指定班主任」
      trigger: 点击行内按钮
      condition: 有 org.class:update 权限，且该班级不是已停用与教学班
      permission: "academic_director / grade_leader / org.class / update"
      api: "-"
      result: 打开 PAGE-CLS-LEADER 弹窗，选择教师与生效日期；变更后原班主任立即失去本班范围（REQ-CLS-025 / 051）
      audit: 否
      batch: "2-3"
    - id: ACT-CLS-007
      element: 行内「编班」
      trigger: 点击行内按钮
      condition: 有 org.class:update 权限且班级所属学年学期不是已归档学年
      permission: "academic_director / grade_leader / org.class / update"
      api: "-"
      result: 进入 PAGE-CLS-ROSTER-ADD 独立页，从本校学生池检索并批量加入；逐条校验唯一行政班（REQ-CLS-027 / 029）
      audit: 否
      batch: "2-3"
    - id: ACT-CLS-008
      element: 行内「复制班级」
      trigger: 点击行内按钮
      condition: 有 org.class:create 权限
      permission: "academic_director / org.class / create"
      api: "-"
      result: 打开 PAGE-CLS-COPY 弹窗，选择目标学年学期与年级；复制类型、容量、校区、教室，不复制花名册与班主任（REQ-CLS-061）
      audit: 否
      batch: "2-3"
    - id: ACT-CLS-009
      element: 行内「批量迁学生」
      trigger: 点击行内按钮
      condition: 有 org.class:update 权限，且该班在读人数大于 0
      permission: "academic_director / grade_leader / org.class / update"
      api: "-"
      result: 进入 PAGE-CLS-MOVE 独立页，选目标班级并展示影响预览；原关系保留历史（REQ-CLS-062）
      audit: 否
      batch: "2-3"
    - id: ACT-CLS-010
      element: 行内「停用」
      trigger: 点击行内按钮
      condition: 有 org.class:update 权限，且该班级不是已停用
      permission: "academic_director / grade_leader / org.class / update"
      confirm: 需要，打开 DIALOG-CLS-DISABLE；文案写清班级、在读人数与"仅停用不删除"
      api: "-"
      result: 打开停用二次确认片段，原因必填；停用后不在新建学生的可选班级中，历史花名册仍可查（REQ-CLS-044）
      audit: 否
      batch: "2-3"
    - id: ACT-CLS-011
      element: 确认停用
      trigger: 点击确认
      condition: 已填写停用原因（至少 5 个字）
      permission: "academic_director / grade_leader / org.class / update"
      api: disableClass
      result: 班级状态置为已停用并写审计；列表行内写操作收敛为「详情」
      audit: 是
      batch: "2-3"
    - id: ACT-CLS-012
      element: 取消停用
      trigger: 点击取消或按 Esc
      condition: 始终可用
      permission: "-"
      api: "-"
      result: 关闭确认片段，不产生任何写入
      audit: 否
      batch: "2-3"
    - id: ACT-CLS-013
      element: 行内「删除」
      trigger: 点击行内按钮
      condition: 有 org.class:delete 权限；仅当在读人数为 0 时该入口才渲染，接口同样二次校验
      permission: "academic_director / org.class / delete"
      confirm: 需要，打开 DIALOG-CLS-DELETE；文案写清"有在读学生时不可删除，只能停用"
      api: "-"
      result: 打开删除二次确认片段，原因必填；有在读学生时接口拒绝并提示改用停用（REQ-CLS-043 / BR-CLASS-006）
      audit: 否
      batch: "2-3"
    - id: ACT-CLS-014
      element: 确认删除
      trigger: 点击确认删除
      condition: 已填写删除原因（至少 5 个字）
      permission: "academic_director / org.class / delete"
      api: removeClass
      result: 逻辑删除该班级并写审计；数据库层不开放物理删除（REQ-CLS-046）
      audit: 是
      batch: "2-3"
    - id: ACT-CLS-015
      element: 取消删除
      trigger: 点击取消或按 Esc
      condition: 始终可用
      permission: "-"
      api: "-"
      result: 关闭确认片段，不产生任何写入
      audit: 否
      batch: "2-3"
    - id: ACT-CLS-016
      element: 行内「更多」
      trigger: 点击
      condition: 该行至少有一个可用的低频行内操作
      permission: "-"
      api: "-"
      result: 展开行内操作下拉（编班 / 复制班级 / 批量迁学生 / 停用 / 删除）；下拉项按各自权限与条件显隐
      audit: 否
      batch: "2-3"

