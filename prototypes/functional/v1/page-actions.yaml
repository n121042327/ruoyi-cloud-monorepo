      permission: "tenant_admin / org.subject / update"
      api: removeSubject
      result: 有引用时拒绝删除并列出来源对象清单（REQ-SUB-030 / 034 / 036），只允许停用；学科禁止物理删除（NFR-DATA-02）
      audit: 是
      batch: "2-6"
    - id: ACT-SUB-009
      element: 新建学科「取消」
      trigger: 点击
      condition: 始终可用
      permission: "-"
      api: "-"
      result: 关闭弹窗，不写入
      audit: 否
      batch: "2-6"
    - id: ACT-SUB-010
      element: 新建学科「保存」
      trigger: 点击
      condition: 名称与编码必填、至少一个学段
      permission: "tenant_admin / org.subject / create"
      api: addSubject
      result: 创建学科（编码校内唯一）并写审计（REQ-SUB-012）；选科角色默认 none（REQ-SUB-017）
      audit: 是
      batch: "2-6"
    - id: ACT-SUB-011
      element: 编辑学科「取消」
      trigger: 点击
      condition: 始终可用
      permission: "-"
      api: "-"
      result: 关闭弹窗，不写入
      audit: 否
      batch: "2-6"
    - id: ACT-SUB-012
      element: 编辑学科「保存」
      trigger: 点击
      condition: 名称必填
      permission: "tenant_admin / org.subject / update"
      api: updateSubject
      result: 保存名称 / 排序 / 学段启用并写审计（含变更前后值，REQ-SUB-016）；编码变更走 updateSubjectCode
      audit: 是
      batch: "2-6"
    - id: ACT-SUB-013
      element: 选科角色「取消」
      trigger: 点击
      condition: 始终可用
      permission: "-"
      api: "-"
      result: 关闭弹窗，不写入
      audit: 否
      batch: "2-6"
    - id: ACT-SUB-014
      element: 选科角色「保存角色」
      trigger: 点击
      condition: 参与选科时必须选角色；角色必须在固定集合内
      permission: "tenant_admin / org.subject / update"
      api: saveSubjectStreamRole
      result: 保存选科角色；变更前校验已有选科数据（REQ-SUB-022），变更后失效选科缓存（NFR-CACHE-02），写审计
      audit: 是
      batch: "2-6"
    - id: ACT-SUB-015
      element: 学段启用「取消」
      trigger: 点击
      condition: 始终可用
      permission: "-"
      api: "-"
      result: 关闭弹窗，不写入
      audit: 否
      batch: "2-6"
    - id: ACT-SUB-016
      element: 学段启用「保存配置」
      trigger: 点击
      condition: 至少一个学段；未开设学段不可选
      permission: "tenant_admin / org.subject / update"
      api: saveSubjectStage
      result: 保存学段启用（只影响新建业务可选范围，历史引用保留）并写审计（REQ-SUB-027 / 028）
      audit: 是
      batch: "2-6"
    - id: ACT-SUB-017
      element: 批量初始化「取消」
      trigger: 点击
      condition: 始终可用
      permission: "-"
      api: "-"
      result: 关闭弹窗，不写入
      audit: 否
      batch: "2-6"
    - id: ACT-SUB-018
      element: 批量初始化「确认初始化」
      trigger: 点击
      condition: 已选目标学段
      permission: "tenant_admin / org.subject / create"
      api: batchInitSubject
      result: 按学段创建缺失学科、为已存在学科补该学段启用记录；已存在项跳过（幂等），写审计
      audit: 是
      batch: "2-6"

