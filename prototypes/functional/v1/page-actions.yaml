        permission: "academic_director / tenant_admin / org.grade / update"
        api: "-"
        result: 只加入待保存清单；重复的「同一学年学期 + 同一年级 + 同一人」在添加时即被拒绝（REQ-GRD-024）
        audit: 否
        batch: "2-2"
      - id: ACT-GRD-024
        element: 添加
        trigger: 点击
        condition: 已选教师；同一学期同一年级同一人未存在
        permission: "academic_director / tenant_admin / org.grade / update"
        api: "-"
        result: 加入待保存清单；勾选「主要负责人」时把原有主要负责人的标记取消（一人一名主要负责人）
        audit: 否
        batch: "2-2"
      - id: ACT-GRD-025
        element: 取消
        trigger: 点击
        condition: 始终可用
        permission: "-"
        api: "-"
        result: 关闭弹窗，不保存
        audit: 否
        batch: "2-2"
      - id: ACT-GRD-026
        element: 保存
        trigger: 点击
        condition: 学年学期已选
        permission: "academic_director / tenant_admin / org.grade / update"
        confirm: 需要，保存前四条检查写在弹窗内
        api: saveGradeLeader
        result: 写入 edu_grade_leader；生效与解除都写审计，并立即失效相关用户的数据范围缓存（REQ-GRD-027）
        audit: 是
        batch: "2-2"
      - id: ACT-GRD-027
        element: 移除
        trigger: 点击清单行内「移除」
        condition: 有 org.grade:update 权限
        permission: "academic_director / tenant_admin / org.grade / update"
        api: "-"
        result: 只从待保存清单移除；点「保存」后才真正解除任职并写审计
        audit: 否
        batch: "2-2"

grade_archive:
    page: PAGE-GRD-ARCHIVE
    actions:
      - id: ACT-GRD-028
        element: 取消
        trigger: 点击
        condition: 始终可用
        permission: "-"
        api: "-"
