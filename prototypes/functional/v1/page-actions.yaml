  actions:
    - id: ACT-CLS-001
      element: 新建
      trigger: 点击
      condition: 有 org.class:create 权限
      permission: "academic_director / grade_leader / org.class / create"
      api: "-"
      result: 打开 PAGE-CLS-CREATE 弹窗；学年学期默认当前，班级名称在同校同学年学期同学段下唯一
      audit: 否
      batch: "2-3"
    - id: ACT-CLS-002
      element: 批量生成
      trigger: 点击
      condition: 有 org.class:create 权限
      permission: "academic_director / org.class / create"
      api: "-"
      result: 打开 PAGE-CLS-BATCH 弹窗，按年级与班级序号区间一次生成多个班级；已存在的名称列出冲突并跳过
