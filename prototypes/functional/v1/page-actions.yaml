      batch: "2-7"
    - id: ACT-STR-002
      element: 查看选科清单
      trigger: 点击
      condition: 有 stream.selection:read 权限
      permission: "stream.selection / read"
      api: "-"
      result: 跳转 PAGE-STR-LIST
      audit: 否
      batch: "2-7"
    - id: ACT-STR-003
      element: 查看未选科学生
      trigger: 点击
      condition: 有 stream.selection:read 权限；范围按当前角色（REQ-STR-051）
      permission: "stream.selection / read"
      api: listUnselectedStudent
      result: 导出未选科学生清单（按年级 / 班级分组）用于催办
      audit: 是
      batch: "2-7"

# ---------------------------------------------------------------------------
# 学生选科（PAGE-STR-STUDENT）——批次 2-7a
# ---------------------------------------------------------------------------
stream_student:
  page: PAGE-STR-STUDENT
  actions:
    - id: ACT-STR-010
      element: 首选科目卡片（物理 / 历史）
      trigger: 点击
      condition: 学生本人（DS-08 仅本人）
      permission: "-"
      api: "-"
      result: 选中首选科目；首选固定为物理 / 历史，页面上不提供其它选项（BR-STREAM-001 / BV-STREAM-001）
      audit: 否
      batch: "2-7"
    - id: ACT-STR-011
      element: 再选科目卡片（4 选 2）
      trigger: 点击
      condition: 学生本人
      permission: "-"
      api: "-"
      result: 勾选 / 取消再选科目；必须恰好 2 门，超过 2 门时不允许继续勾选，不足时提交被拦（BR-STREAM-002）
      audit: 否
      batch: "2-7"
    - id: ACT-STR-012
      element: 查看选科历史
      trigger: 点击
      condition: 学生本人 / 班主任 / 教务主任
      permission: "-"
      api: listStreamHistory
      result: 打开 / 跳转选科历史区块（PAGE-STR-HISTORY，追加式记录）
      audit: 否
      batch: "2-7"
    - id: ACT-STR-013
      element: 恢复当前结果
      trigger: 点击
      condition: 学生本人
      permission: "-"
      api: "-"
      result: 把表单恢复到已生效的选科结果，丢弃未提交的改动
      audit: 否
      batch: "2-7"
    - id: ACT-STR-014
      element: 提交选科
      trigger: 点击
      condition: 首选已选 + 再选恰好 2 门；在开放期内
      permission: "stream.selection / update"
      api: updateMyStream
      result: 开放期内直接生效（首次用 submitMyStream、修改用 updateMyStream）；截止后作为变更申请进审批待办（BR-STREAM-005）
      audit: 是
      batch: "2-7"

# ---------------------------------------------------------------------------
# 选科清单（PAGE-STR-LIST）与变更申请（PAGE-STR-CHANGE）——批次 2-7a
# ---------------------------------------------------------------------------
