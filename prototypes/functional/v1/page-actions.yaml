      result: 跳转 PAGE-STR-LIST
      audit: 否
      batch: "2-7"
    - id: ACT-STR-032
      element: 查看未选科学生
      trigger: 点击
      condition: 有 stream.selection:read 权限；范围按当前角色（REQ-STR-051）
      permission: "stream.selection / read"
      api: listUnselectedStudent
      result: 导出未选科学生清单（按年级 / 班级分组）用于催办
      audit: 是
      batch: "2-7"
    - id: ACT-STR-033
      element: 按组合生成教学班
      trigger: 点击
      condition: 有 stream.selection:read 权限
      permission: "stream.selection / read"
      api: "-"
      result: 跳转 PAGE-STR-GEN-CLASS
      audit: 否
      batch: "2-7"
    - id: ACT-STR-034
      element: 行内「查看学生」
      trigger: 点击行内按钮
      condition: 有 stream.selection:read 权限
      permission: "stream.selection / read"
      api: "-"
      result: 按该组合下钻到选科清单并带上组合筛选（REQ-STR-049 的统计下钻）
      audit: 否
      batch: "2-7"

# ---------------------------------------------------------------------------
# 变更审批待办（PAGE-STR-APPROVE）与审批弹窗（DIALOG-STR-APPROVE）——批次 2-7b
# ---------------------------------------------------------------------------
stream_approve:
  page: "PAGE-STR-APPROVE / DIALOG-STR-APPROVE"
  actions:
    - id: ACT-STR-040
      element: 行内「审批」
      trigger: 点击行内按钮
      condition: 有 stream.change_request:approve 权限（校级管理员）；该行状态为待审批
      permission: "stream.change_request / approve"
      api: "-"
      result: 打开 DIALOG-STR-APPROVE 并带入该申请；弹窗同时展示原组合与新组合（REQ-STR-038）
      audit: 否
      batch: "2-7"
    - id: ACT-STR-041
      element: 同意并生效
      trigger: 点击
      condition: 有 stream.change_request:approve 权限；审批意见可留空或补充说明
      permission: "stream.change_request / approve"
      api: approveStreamChangeRequest
      result: 学生选科立即更新为新组合并记录生效时间与审批人（REQ-STR-036）；失效相关缓存（REQ-STR-040）；教学班名单不自动同步（REQ-STR-060）
      audit: 是
      batch: "2-7"
    - id: ACT-STR-042
      element: 驳回
      trigger: 点击
      condition: 有 stream.change_request:approve 权限；审批意见必填（至少 5 个字）
      permission: "stream.change_request / approve"
      api: approveStreamChangeRequest
      result: 状态转已驳回，学生选科保持原值（REQ-STR-037）；驳回意见写入审计并通知申请人
      audit: 是
      batch: "2-7"
    - id: ACT-STR-043
      element: 审批「取消」
      trigger: 点击
      condition: 始终可用
      permission: "-"
      api: "-"
      result: 关闭弹窗，不写入
      audit: 否
      batch: "2-7"
    - id: ACT-STR-045
      element: 状态筛选
      trigger: 变更
      condition: 有 stream.change_request:read 权限
      permission: "stream.change_request / read"
      api: listStreamChangeRequest
      result: 按状态筛选（默认「待审批」；待审批按提交时间升序，REQ-STR-035）
      audit: 否
      batch: "2-7"
    - id: ACT-STR-046
      element: 年级筛选
      trigger: 变更
      condition: 有 stream.change_request:read 权限；选项按数据范围收窄（filter_cascade）
      permission: "stream.change_request / read"
      api: listStreamChangeRequest
      result: 按年级筛选待办（REQ-STR-035）
      audit: 否
      batch: "2-7"
    - id: ACT-STR-047
      element: 关键字检索
      trigger: 输入
      condition: 有 stream.change_request:read 权限
      permission: "stream.change_request / read"
      api: listStreamChangeRequest
      result: 按申请单号 / 姓名 / 学号检索
      audit: 否
      batch: "2-7"

# ---------------------------------------------------------------------------
# 按组合生成教学班（PAGE-STR-GEN-CLASS）——批次 2-7b
# ---------------------------------------------------------------------------
stream_generate_class:
  page: PAGE-STR-GEN-CLASS
  actions:
    - id: ACT-STR-050
      element: 生成方式「按完整组合」
      trigger: 点击
      condition: 教务主任（触发者）；有 stream.selection:read 权限
      permission: "stream.selection / read"
      api: "-"
      result: 预览按完整组合（如物理 + 化学 + 生物）生成教学班（REQ-STR-058）
      audit: 否
      batch: "2-7"
    - id: ACT-STR-051
      element: 生成方式「按单学科」
      trigger: 点击
      condition: 教务主任（触发者）
      permission: "stream.selection / read"
      api: "-"
      result: 预览按单学科（如全体选物理的学生）生成教学班（REQ-STR-058）
      audit: 否
      batch: "2-7"
    - id: ACT-STR-052
      element: 年级范围
      trigger: 变更
      condition: 必选；跨年级不会合并教学班
      permission: "stream.selection / read"
      api: previewTeachingClassGenerate
      result: 决定预览里出现的教学班集合
      audit: 否
      batch: "2-7"
    - id: ACT-STR-053
      element: 增量生成并核对
      trigger: 点击
      condition: 教务主任；核对页发现差异时可用
      permission: "stream.selection / read"
      api: previewTeachingClassGenerate
      result: 按当前选科重新计算差异（REQ-STR-060 不自动同步，需人工触发并展示差异清单）
      audit: 是
      batch: "2-7"
    - id: ACT-STR-054
      element: 去教学班管理
      trigger: 点击
      condition: 有 org.teaching_class:read 权限
      permission: "org.teaching_class / read"
      api: "-"
      result: 跳转 PAGE-CLS-TEACHING
      audit: 否
      batch: "2-7"
    - id: ACT-STR-055
      element: 查看组合分布统计
      trigger: 点击
      condition: 有 stream.selection:read 权限
      permission: "stream.selection / read"
      api: "-"
      result: 跳转 PAGE-STR-STAT（用于核对人数口径，REQ-STR-050）
      audit: 否
      batch: "2-7"
    - id: ACT-STR-056
      element: 向导「下一步」
      trigger: 点击
      condition: 当前步骤必填项通过；第 1 步需选年级范围
      permission: "stream.selection / read"
      api: previewTeachingClassGenerate
      result: 进入下一步；预览阶段不写库（REQ-STR-055）
      audit: 否
      batch: "2-7"
    - id: ACT-STR-057
      element: 执行生成
      trigger: 点击
      condition: 教务主任；已完成预览
      permission: "stream.selection / read"
      api: executeTeachingClassGenerate
      result: 触发按组合生成教学班；写入由班级管理模块执行（REQ-STR-056），幂等不重复建班不重复写成员（REQ-STR-057）
      audit: 是
      batch: "2-7"
    - id: ACT-STR-058
      element: 向导「上一步」
      trigger: 点击
      condition: 当前步骤 > 1
      permission: "stream.selection / read"
      api: "-"
      result: 回到上一步，已填内容保留
      audit: 否
      batch: "2-7"

# ---------------------------------------------------------------------------
# 教学班管理（PAGE-CLS-TEACHING）与两个片段——批次 2-7b
# ---------------------------------------------------------------------------
teaching_class_list:
  page: "PAGE-CLS-TEACHING / DRAWER-CLS-TEACHING / DIALOG-TCL-DISABLE"
  actions:
    - id: ACT-TCL-001
      element: 去生成教学班
      trigger: 点击
      condition: 有 org.teaching_class:create 权限（教务主任）
      permission: "org.teaching_class / create"
      api: "-"
      result: 跳转 PAGE-STR-GEN-CLASS；教学班创建入口统一在生成向导（DP-01 只有一条写入路径）
      audit: 否
      batch: "2-7"
    - id: ACT-TCL-002
      element: 行内「详情」
      trigger: 点击行内按钮
      condition: 有 org.teaching_class:read 权限
      permission: "org.teaching_class / read"
      api: getTeachingClass
      result: 打开 DRAWER-CLS-TEACHING 并带入该教学班（含成员与未同步变更说明）
      audit: 否
      batch: "2-7"
    - id: ACT-TCL-003
      element: 去增量生成并核对
      trigger: 点击
      condition: 有 org.teaching_class:read 权限（发起增量生成需教务主任）
      permission: "org.teaching_class / read"
      api: "-"
      result: 跳转 PAGE-STR-GEN-CLASS（REQ-STR-060 不自动同步名单）
      audit: 否
      batch: "2-7"
    - id: ACT-TCL-004
      element: 详情「关闭」
      trigger: 点击
      condition: 始终可用
      permission: "-"
      api: "-"
      result: 关闭抽屉，不写入
      audit: 否
      batch: "2-7"
    - id: ACT-TCL-005
      element: 行内「停用」
      trigger: 点击行内按钮
      condition: 有 org.teaching_class:update 权限（教务主任）；该行不是已停用状态
      permission: "org.teaching_class / update"
      api: "-"
      result: 打开 DIALOG-TCL-DISABLE 二次确认并带入该教学班；已停用行显示「已停用」无入口
      audit: 否
      batch: "2-7"
    - id: ACT-TCL-006
      element: 停用「取消」
      trigger: 点击
      condition: 始终可用
      permission: "-"
      api: "-"
      result: 关闭弹窗，不写入
      audit: 否
      batch: "2-7"
    - id: ACT-TCL-007
      element: 确认停用
      trigger: 点击
      condition: 有 org.teaching_class:update 权限；停用原因必填（至少 5 个字）
      permission: "org.teaching_class / update"
      api: disableTeachingClass
      result: 教学班转已停用，不再出现在可选列表；历史成员保留；原因写审计（REQ-CLS-047）
      audit: 是
      batch: "2-7"
    - id: ACT-TCL-010
      element: 年级筛选
      trigger: 变更
      condition: 有 org.teaching_class:read 权限；选项按 DS-05 收窄
      permission: "org.teaching_class / read"
      api: listTeachingClass
      result: 按年级筛选教学班
      audit: 否
      batch: "2-7"
    - id: ACT-TCL-011
      element: 组合筛选
      trigger: 变更
      condition: 有 org.teaching_class:read 权限
      permission: "org.teaching_class / read"
      api: listTeachingClass
      result: 按组合或单学科筛选教学班
      audit: 否
      batch: "2-7"
    - id: ACT-TCL-012
      element: 状态筛选
      trigger: 变更
      condition: 有 org.teaching_class:read 权限
      permission: "org.teaching_class / read"
      api: listTeachingClass
      result: 按正常 / 已停用筛选
      audit: 否
      batch: "2-7"

# ---------------------------------------------------------------------------
# 审计与操作日志（批次 2-8）：操作日志 / 详情抽屉 / 导出配置 / 运营访问 / 敏感访问 / 安全事件 / 归档
# ---------------------------------------------------------------------------
audit_log:
  page: "PAGE-AUDIT-LOG-LIST / PAGE-AUDIT-LOG-DETAIL / PAGE-AUDIT-OBJECT-TIMELINE / DIALOG-AUD-EXPORT"
  actions:
    - { id: ACT-AUD-001, element: 开始时间筛选, trigger: 变更, condition: 有 audit.log:read；默认最近 7 天, permission: "audit.log / read", api: listOperationLog, result: 收窄时间范围；单次跨度上限 90 天（REQ-AUD-021）, audit: 否, batch: "2-8" }
    - { id: ACT-AUD-002, element: 结束时间筛选, trigger: 变更, condition: 有 audit.log:read；起止跨度 ≤ 90 天, permission: "audit.log / read", api: listOperationLog, result: 超出上限时提示收窄范围并给建议区间（REQ-AUD-021）, audit: 否, batch: "2-8" }
    - { id: ACT-AUD-003, element: 操作人筛选, trigger: 变更, condition: 有 audit.log:read；选项按数据范围收窄, permission: "audit.log / read", api: listOperationLog, result: 按操作人筛选（REQ-AUD-018）, audit: 否, batch: "2-8" }
    - { id: ACT-AUD-004, element: 对象类型筛选, trigger: 变更, condition: 有 audit.log:read, permission: "audit.log / read", api: listOperationLog, result: 按对象类型筛选（REQ-AUD-018）, audit: 否, batch: "2-8" }
    - { id: ACT-AUD-005, element: 操作类型筛选, trigger: 变更, condition: 有 audit.log:read, permission: "audit.log / read", api: listOperationLog, result: 按操作类型筛选（新增 / 修改 / 删除 / 审批 / 导出）, audit: 否, batch: "2-8" }
    - { id: ACT-AUD-007, element: 关键字检索, trigger: 输入, condition: 有 audit.log:read, permission: "audit.log / read", api: listOperationLog, result: 按对象标识 / 操作人 / 请求标识检索（REQ-AUD-019）, audit: 否, batch: "2-8" }
    - { id: ACT-AUD-008, element: 刷新, trigger: 点击, condition: 有 audit.log:read, permission: "audit.log / read", api: listOperationLog, result: 按时间倒序刷新列表（REQ-AUD-020）；查询行为本身不写日志（REQ-AUD-011）, audit: 否, batch: "2-8" }
    - { id: ACT-AUD-010, element: 导出, trigger: 点击, condition: 有 audit.log:export（校领导 / 教务主任 / 平台运营）, permission: "audit.log / export", api: "-", result: 打开 DIALOG-AUD-EXPORT 导出配置弹窗（PRD 6.3）, audit: 否, batch: "2-8" }
    - { id: ACT-AUD-012, element: 导出配置「取消」, trigger: 点击, condition: 始终可用, permission: "-", api: "-", result: 关闭弹窗，不写入, audit: 否, batch: "2-8" }
    - { id: ACT-AUD-013, element: 开始导出, trigger: 点击, condition: 有 audit.log:export；用途说明必填；行数 ≤ 50000（超出提示收窄或转异步）, permission: "audit.log / export", api: exportOperationLog, result: 按当前筛选与重新解析的范围导出 xlsx / csv；文件有效期 7 天；导出行为写审计（REQ-AUD-026 ~ 029 / DS-DENY-04）, audit: 是, batch: "2-8" }
    - { id: ACT-AUD-014, element: 行内「详情」, trigger: 点击行内按钮, condition: 有 audit.log:read, permission: "audit.log / read", api: getOperationLog, result: 打开 PAGE-AUDIT-LOG-DETAIL 抽屉并带入该条日志（含 diff 与对象时间线）, audit: 否, batch: "2-8" }
    - { id: ACT-AUD-020, element: 详情「关闭」, trigger: 点击, condition: 始终可用, permission: "-", api: "-", result: 关闭抽屉，保留列表筛选条件（PRD 6.3）, audit: 否, batch: "2-8" }

audit_ops_access:
  page: PAGE-AUDIT-OPS-ACCESS
  actions:
    - { id: ACT-AUD-030, element: 运营账号筛选, trigger: 变更, condition: 有 audit.log:read（租户管理员 / 校领导 / 平台运营）, permission: "audit.log / read", api: listOperatorAccess, result: 按运营账号筛选（REQ-AUD-015）, audit: 否, batch: "2-8" }
    - { id: ACT-AUD-031, element: 访问动作筛选, trigger: 变更, condition: 有 audit.log:read, permission: "audit.log / read", api: listOperatorAccess, result: 按查看 / 导出筛选（REQ-AUD-014）, audit: 否, batch: "2-8" }
    - { id: ACT-AUD-032, element: 开始时间筛选, trigger: 变更, condition: 有 audit.log:read, permission: "audit.log / read", api: listOperatorAccess, result: 收窄时间范围, audit: 否, batch: "2-8" }
    - { id: ACT-AUD-033, element: 结束时间筛选, trigger: 变更, condition: 有 audit.log:read, permission: "audit.log / read", api: listOperatorAccess, result: 收窄时间范围, audit: 否, batch: "2-8" }
    - { id: ACT-AUD-034, element: 导出记录, trigger: 点击, condition: 有 audit.log:export；导出只含本租户数据, permission: "audit.log / export", api: exportOperatorAccess, result: 导出本租户的运营访问记录（REQ-AUD-016）；导出行为写审计, audit: 是, batch: "2-8" }
    - { id: ACT-AUD-035, element: 刷新, trigger: 点击, condition: 有 audit.log:read, permission: "audit.log / read", api: listOperatorAccess, result: 刷新运营访问记录, audit: 否, batch: "2-8" }

audit_sensitive_access:
  page: PAGE-AUDIT-SENSITIVE-ACCESS
  actions:
    - { id: ACT-AUD-040, element: 敏感字段筛选, trigger: 变更, condition: 有 audit.log:read（校领导 / 教务主任）, permission: "audit.log / read", api: listSensitiveAccess, result: 按证件号 / 监护人手机号 / 学生联系电话筛选（REQ-AUD-008）, audit: 否, batch: "2-8" }
    - { id: ACT-AUD-041, element: 访问方式筛选, trigger: 变更, condition: 有 audit.log:read, permission: "audit.log / read", api: listSensitiveAccess, result: 按查看全量 / 明文导出筛选（REQ-AUD-009）, audit: 否, batch: "2-8" }
    - { id: ACT-AUD-042, element: 关键字检索, trigger: 输入, condition: 有 audit.log:read, permission: "audit.log / read", api: listSensitiveAccess, result: 按查看人 / 对象标识检索, audit: 否, batch: "2-8" }
    - { id: ACT-AUD-043, element: 导出记录, trigger: 点击, condition: 有 audit.log:export, permission: "audit.log / export", api: exportOperationLog, result: 导出敏感数据访问记录；导出行为写审计（REQ-AUD-011 / NFR-AUDIT-03）, audit: 是, batch: "2-8" }
    - { id: ACT-AUD-044, element: 刷新, trigger: 点击, condition: 有 audit.log:read, permission: "audit.log / read", api: listSensitiveAccess, result: 刷新敏感数据访问记录, audit: 否, batch: "2-8" }

audit_security_event:
  page: PAGE-AUDIT-SECURITY-EVENT
  actions:
    - { id: ACT-AUD-050, element: 事件类型筛选, trigger: 变更, condition: 有 audit.log:read（校领导 / 平台运营）, permission: "audit.log / read", api: listSecurityEvent, result: 按登录失败 / 锁定 / 激活码查看与重置 / 学号变更 / 权限变更筛选（REQ-AUD-007）, audit: 否, batch: "2-8" }
    - { id: ACT-AUD-051, element: 关键字检索, trigger: 输入, condition: 有 audit.log:read, permission: "audit.log / read", api: listSecurityEvent, result: 按账号 / 姓名 / 来源 IP 检索, audit: 否, batch: "2-8" }
    - { id: ACT-AUD-052, element: 刷新, trigger: 点击, condition: 有 audit.log:read, permission: "audit.log / read", api: listSecurityEvent, result: 刷新登录与安全事件, audit: 否, batch: "2-8" }

audit_archive:
  page: PAGE-AUDIT-ARCHIVE
  actions:
    - { id: ACT-AUD-060, element: 批次状态筛选, trigger: 变更, condition: 有 audit.log:read（平台运营 / 超管）, permission: "audit.log / read", api: listArchiveBatch, result: 按已完成 / 进行中 / 失败筛选归档批次（REQ-AUD-033）, audit: 否, batch: "2-8" }
    - { id: ACT-AUD-061, element: 批次号检索, trigger: 输入, condition: 有 audit.log:read, permission: "audit.log / read", api: listArchiveBatch, result: 按归档批次号检索, audit: 否, batch: "2-8" }
    - { id: ACT-AUD-062, element: 归档区间检索, trigger: 点击, condition: 有 audit.log:read；区间落在归档范围, permission: "audit.log / read", api: searchArchivedLog, result: 检索归档区间；单次 P95 ≤ 30 秒，超出转异步（REQ-AUD-033）；该动作本身写日志（REQ-AUD-034）, audit: 是, batch: "2-8" }
    - { id: ACT-AUD-063, element: 刷新, trigger: 点击, condition: 有 audit.log:read, permission: "audit.log / read", api: listArchiveBatch, result: 刷新归档批次列表, audit: 否, batch: "2-8" }
    - { id: ACT-AUD-064, element: 行内「检索该批次」, trigger: 点击行内按钮, condition: 有 audit.log:read；该批次状态为已完成, permission: "audit.log / read", api: searchArchivedLog, result: 按该批次范围检索归档日志（归档不删数据，检索能力与在线一致）, audit: 是, batch: "2-8" }
    - { id: ACT-AUD-065, element: 行内「重试归档」, trigger: 点击行内按钮, condition: 有 audit.log:read；该批次状态为失败, permission: "audit.log / read", api: searchArchivedLog, result: 重试失败分区；成功分区不重复归档（不做整批回滚），重试动作写日志（REQ-AUD-034 / 036）, audit: 是, batch: "2-8" }

# ---------------------------------------------------------------------------
# 异步任务中心（批次 2-9）：任务列表 / 详情抽屉 / 导出配置
# ---------------------------------------------------------------------------
async_task_center:
  page: "PAGE-IMP-TASK-LIST / PAGE-IMP-TASK-DETAIL / PAGE-IMP-EXPORT"
  actions:
    - { id: ACT-TASK-001, element: 任务类型筛选, trigger: 变更, condition: 有 data.async_task:read；默认只看本人任务, permission: "data.async_task / read", api: listAsyncTask, result: 按导入 / 导出 / 升班筛选（REQ-IMP-032）, audit: 否, batch: "2-9" }
    - { id: ACT-TASK-002, element: 状态筛选, trigger: 变更, condition: 有 data.async_task:read, permission: "data.async_task / read", api: listAsyncTask, result: 按 queued / running / succeeded / partial_failed / failed / cancelled 筛选（REQ-IMP-034）, audit: 否, batch: "2-9" }
    - { id: ACT-TASK-003, element: 开始时间筛选, trigger: 变更, condition: 有 data.async_task:read, permission: "data.async_task / read", api: listAsyncTask, result: 收窄时间范围, audit: 否, batch: "2-9" }
    - { id: ACT-TASK-004, element: 结束时间筛选, trigger: 变更, condition: 有 data.async_task:read, permission: "data.async_task / read", api: listAsyncTask, result: 收窄时间范围, audit: 否, batch: "2-9" }
    - { id: ACT-TASK-005, element: 任务编号检索, trigger: 输入, condition: 有 data.async_task:read, permission: "data.async_task / read", api: listAsyncTask, result: 按任务编号检索（PRD 6.2）, audit: 否, batch: "2-9" }
    - { id: ACT-TASK-006, element: 自动刷新开关, trigger: 点击, condition: 有 data.async_task:read, permission: "data.async_task / read", api: listAsyncTask, result: 开启后每 10 秒刷新；刷新失败降级为手动刷新并提示（REQ-IMP-035）, audit: 否, batch: "2-9" }
    - { id: ACT-TASK-007, element: 导出任务清单, trigger: 点击, condition: 有 data.export:export, permission: "data.export / export", api: "-", result: 打开 PAGE-IMP-EXPORT 导出配置弹窗（PRD 6.2 / 6.3）, audit: 否, batch: "2-9" }
    - { id: ACT-TASK-008, element: 刷新, trigger: 点击, condition: 有 data.async_task:read, permission: "data.async_task / read", api: listAsyncTask, result: 刷新任务列表（默认只看本人任务）, audit: 否, batch: "2-9" }
    - { id: ACT-TASK-010, element: 导出配置「取消」, trigger: 点击, condition: 始终可用, permission: "-", api: "-", result: 关闭弹窗，不写入, audit: 否, batch: "2-9" }
    - { id: ACT-TASK-011, element: 开始导出, trigger: 点击, condition: 有 data.export:export；至少选择一列；明文导出需 read_sensitive + 明文导出授权, permission: "data.export / export", api: exportData, result: 行数 ≤ 2000 同步下载、超出转异步任务；明文导出额外写审计（BR-IMP-012 / NFR-AUDIT-03）, audit: 是, batch: "2-9" }
    - { id: ACT-TASK-020, element: 详情「关闭」, trigger: 点击, condition: 始终可用, permission: "-", api: "-", result: 关闭抽屉，保留列表筛选条件, audit: 否, batch: "2-9" }
    - { id: ACT-TASK-021, element: 详情「重试」, trigger: 点击, condition: 有 data.async_task:read；任务状态为 failed / partial_failed；二次确认, permission: "data.async_task / read", api: retryAsyncTask, result: 重新入队，沿用原批次号与幂等键，不产生重复数据（REQ-IMP-037）, audit: 是, batch: "2-9" }
    - { id: ACT-TASK-022, element: 详情「下载结果文件」, trigger: 点击, condition: 有 data.async_task:read；结果文件未过期, permission: "data.async_task / read", api: downloadTaskResult, result: 返回短时签名链接（与登录态绑定，过期或跨账号一律拒绝）；下载写审计（REQ-IMP-036 / 042 / 043）, audit: 是, batch: "2-9" }
    - { id: ACT-TASK-023, element: 行内「详情」, trigger: 点击行内按钮, condition: 有 data.async_task:read, permission: "data.async_task / read", api: getAsyncTask, result: 打开 PAGE-IMP-TASK-DETAIL 抽屉并带入该任务（REQ-IMP-033）, audit: 否, batch: "2-9" }
    - { id: ACT-TASK-024, element: 行内「重试」, trigger: 点击行内按钮, condition: 有 data.async_task:read；状态为 failed / partial_failed, permission: "data.async_task / read", api: retryAsyncTask, result: 重新入队并沿用原批次号（REQ-IMP-037）, audit: 是, batch: "2-9" }
    - { id: ACT-TASK-025, element: 行内「取消」, trigger: 点击行内按钮, condition: 有 data.async_task:read；状态为 queued（只有排队中可取消）, permission: "data.async_task / read", api: cancelAsyncTask, result: 取消排队中的任务，不产生部分写入（REQ-IMP-034）, audit: 是, batch: "2-9" }
    - { id: ACT-TASK-026, element: 行内「下载」, trigger: 点击行内按钮, condition: 有 data.async_task:read；状态为 succeeded / partial_failed, permission: "data.async_task / read", api: downloadTaskResult, result: 下载结果文件或失败明细（短时签名 + 写审计，REQ-IMP-042 / 043）, audit: 是, batch: "2-9" }
    - { id: ACT-TASK-030, element: 空态「去发起导入」, trigger: 点击, condition: 有 data.import:import, permission: "data.import / import", api: "-", result: 跳转 PAGE-IMP-WIZARD（保留来源列表的筛选条件）, audit: 否, batch: "2-9" }

# ---------------------------------------------------------------------------
# 死信任务（PAGE-IMP-DEADLETTER）与重放确认（DIALOG-DLQ-REPLAY）——批次 2-9
# ---------------------------------------------------------------------------
dead_letter:
  page: "PAGE-IMP-DEADLETTER / DIALOG-DLQ-REPLAY"
  actions:
    - { id: ACT-TASK-040, element: 任务类型筛选, trigger: 变更, condition: 有 data.async_task:read（平台运营 / 超管）, permission: "data.async_task / read", api: listDeadLetterTask, result: 按导入 / 导出 / 升班筛选死信, audit: 否, batch: "2-9" }
    - { id: ACT-TASK-041, element: 关键字检索, trigger: 输入, condition: 有 data.async_task:read, permission: "data.async_task / read", api: listDeadLetterTask, result: 按任务编号 / 原批次号检索, audit: 否, batch: "2-9" }
    - { id: ACT-TASK-042, element: 刷新, trigger: 点击, condition: 有 data.async_task:read, permission: "data.async_task / read", api: listDeadLetterTask, result: 刷新死信列表, audit: 否, batch: "2-9" }
    - { id: ACT-TASK-045, element: 行内「重放」, trigger: 点击行内按钮, condition: 有 data.async_task:read；重试次数已达上限且未重放成功, permission: "data.async_task / read", api: "-", result: 打开 DIALOG-DLQ-REPLAY 二次确认并带入该任务（REQ-IMP-038）, audit: 否, batch: "2-9" }
    - { id: ACT-TASK-046, element: 行内「已重放」, trigger: 点击行内按钮, condition: 有 data.async_task:read；该条已重放成功, permission: "data.async_task / read", api: "-", result: 打开任务详情抽屉查看重放后的执行结果（死信记录保留用于追溯）, audit: 否, batch: "2-9" }
    - { id: ACT-TASK-050, element: 重放「取消」, trigger: 点击, condition: 始终可用, permission: "-", api: "-", result: 关闭弹窗，不写入, audit: 否, batch: "2-9" }
    - { id: ACT-TASK-051, element: 确认重放, trigger: 点击, condition: 有 data.async_task:read；重放原因必填（至少 5 个字）, permission: "data.async_task / read", api: replayDeadLetterTask, result: 复用原批次号与幂等键重新入队；重放动作写入审计（REQ-IMP-037 / 038）, audit: 是, batch: "2-9" }

batches_pending:
  - { batch: "2-2", pages: [PAGE-TCH-LIST, PAGE-TCH-DETAIL, PAGE-TCH-CREATE, PAGE-TCH-EDIT, PAGE-TCH-LEAVE, PAGE-TCH-ROLE, PAGE-TCH-ASSIGN], status: "2-2a、2-2b-1 与 2-2b-2 教师部分已产出待验收（ACT-TCH-001 ~ 039 已登记）" }
  - { batch: "2-2b-2b", pages: [PAGE-GRD-LIST, PAGE-GRD-DETAIL, PAGE-GRD-CREATE, PAGE-GRD-BATCH, PAGE-GRD-LEADER, PAGE-GRD-ARCHIVE], status: "PAGE-GRD-LIST 样板页已产出待验收（ACT-GRD-001 ~ 011 已登记）；其余 5 页待样板验收后铺开" }
  - { batch: "2-3", pages: [PAGE-CLS-LIST, PAGE-CLS-DETAIL, PAGE-CLS-CREATE, PAGE-CLS-BATCH, PAGE-CLS-ROSTER-ADD, PAGE-CLS-TRANSFER, PAGE-CLS-LEADER, PAGE-CLS-COPY, PAGE-CLS-MOVE, PAGE-PRM-LIST, PAGE-PRM-CREATE, PAGE-PRM-PREVIEW, PAGE-PRM-ADJUST, PAGE-PRM-VALIDATE, PAGE-PRM-EXECUTE, PAGE-PRM-RESULT], status: "2-3 全部产出待验收：2-3a class_list（ACT-CLS-001 ~ 016）、2-3b class_detail（017 ~ 029、048 ~ 052、064）、2-3c 四个班级弹窗（030 ~ 047）、2-3d 编班与批量迁学生（053 ~ 063）、2-3e 升班 6 页 + 1 确认片段（ACT-PRM-001 ~ 043：s1 001 ~ 010、s2 011 ~ 019、s3 020 ~ 028、s4 029 ~ 041、common 043）" }
  - { batch: "2-4", pages: [PAGE-IMP-WIZARD, PAGE-IMP-TEMPLATE, PAGE-IMP-VALIDATE, PAGE-IMP-EXECUTE, PAGE-STU-IMPORT, PAGE-TCH-IMPORT, PAGE-CLS-ROSTER-IMPORT, PAGE-LOGIN, PAGE-403, PAGE-404, PAGE-500], status: 待开始 }

# ---------------------------------------------------------------------------
# 6. 动作的通用状态规则
# ---------------------------------------------------------------------------
state_rules:
  - 提交类动作在请求中必须置 loading 并禁用，禁止重复提交
  - 危险动作（删除 / 停用 / 归档 / 覆盖）必须二次确认，且文案写清对象与影响范围
  - 任何写操作成功后，必须刷新受影响的列表或详情，不依赖前端本地拼接
  - 任何失败都要给出可操作的提示（原因 + 下一步），不只显示"操作失败"
  - 无权限时不渲染入口；绕过前端直接调接口必须被后端拒绝
  - 筛选级联：上级（学校）变化后，下级（校区 / 年级 / 班级 / 班主任）下拉只列该上级范围内的数据，失效值清空为「全部」（GAP-046 选项 A，规则见 layout-spec.yaml 的 filter_cascade）

# ---------------------------------------------------------------------------
# 7. 反馈文案模板（原型与生产共用）
#    禁止出现"操作成功""操作失败""数据不存在"这类不含信息的文案。
#    每条文案必须包含：发生了什么 + 对象是谁 + 下一步能做什么。
#    变量用 {snake_case} 占位，变量名必须是字段字典中的字段或接口返回字段。
# ---------------------------------------------------------------------------
feedback_templates:
  success:
    - { scene: 新增学生成功, template: "已保存，学号为 {student_no}。可继续新增或查看详情。", channel: 页面内提示条 + 两个后续动作 }
    - { scene: 编辑成功, template: "已保存。", channel: 顶部轻提示 }
    - { scene: 导入校验通过, template: "共 {row_total} 行，可执行 {valid_count} 行，失败 {invalid_count} 行。确认后开始导入。", channel: 校验结果区 }
    - { scene: 导入提交成功, template: "已开始执行，任务编号 {task_no}，可在异步任务中查看进度。", channel: 顶部轻提示 + 跳转链接 }
    - { scene: 导出同步成功, template: "已生成 {row_count} 行，开始下载。", channel: 顶部轻提示 }
    - { scene: 导出转异步, template: "本次导出共 {row_count} 行，已转后台任务（{task_no}）。", channel: 顶部轻提示 }
    - { scene: 删除成功, template: "已删除 {object_name}。", channel: 顶部轻提示 }
    - { scene: 重置激活码成功, template: "已为 {student_name} 生成新的激活码，旧码立即失效。", channel: 顶部轻提示 }
  error:
    - { scene: 无权限, template: "你没有该操作的权限（{permission}）。如需开通，请联系本校管理员。", channel: 页面内提示 }
    - { scene: 唯一性冲突, template: "{field_label} 已存在（{conflict_value}），请核对后重新提交。", channel: 字段级红字 }
    - { scene: 引用不存在, template: "第 {row_no} 行引用的 {field_label} 不存在，请先在对应模块创建。", channel: 失败明细行 }
    - { scene: 并发冲突, template: "该记录已被 {operator} 于 {time} 更新，请刷新后重试。", channel: 弹窗 }
    - { scene: 导入部分失败, template: "共 {row_total} 行，成功 {success_count} 行，失败 {failed_count} 行。失败明细可下载。", channel: 结果区 + 下载按钮 }
    - { scene: 超限, template: "单次最多 {limit} 行，当前 {row_count} 行，请拆分后重新上传。", channel: 页面内提示 }
    - { scene: 服务异常, template: "处理失败，请稍后重试。请求编号 {request_id}。", channel: 页面内提示 + 重试按钮 }
  confirm:
    - { scene: 删除, template: "确定删除 {object_name}？删除后不可恢复。" }
    - { scene: 停用, template: "停用 {object_name} 后，该对象不再出现在业务选择项中，历史数据保留。" }
    - { scene: 归档, template: "归档 {object_name} 后业务上不再可编辑，仍可查询。" }
    - { scene: 导入执行, template: "将对 {row_total} 行执行导入；引用的学年学期、年级、班级必须已存在。" }
    - { scene: 逾期变更, template: "已超过选科截止日期（{deadline}），提交后需校级管理员审批。" }
    - { scene: 学号修改, template: "修改学号后，学生登录名将同步变更，旧会话失效，操作会写入审计。" }
  rules:
    - 成功提示必须包含"下一步能做什么"，不能只有"已保存"
    - 失败提示必须包含原因或请求编号，并给出可执行的下一步
    - 确认文案必须写清"对谁、做什么、影响范围"
    - 敏感信息（证件号、完整手机号）不得出现在提示文案中
