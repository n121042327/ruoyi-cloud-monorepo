      batch: "2-6"
    - id: ACT-SUB-004
      element: 行内「选科角色」
      trigger: 点击行内按钮
      condition: 有 org.subject:update 权限
      permission: "tenant_admin / org.subject / update"
      api: "-"
      result: 打开 PAGE-SUB-STREAM 弹窗：首选只允许物理 / 历史、再选只允许化学 / 生物 / 思想政治 / 地理（BR-SUBJECT-003）
      audit: 否
      batch: "2-6"
    - id: ACT-SUB-005
      element: 行内「学段启用」
      trigger: 点击行内按钮
      condition: 有 org.subject:update 权限
