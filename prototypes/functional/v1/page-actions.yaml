  page: "PAGE-STR-LIST / PAGE-STR-HISTORY / PAGE-STR-CHANGE"
  actions:
    - id: ACT-STR-020
      element: 组合分布统计
      trigger: 点击
      condition: 有 stream.selection:read 权限
