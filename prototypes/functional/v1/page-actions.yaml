      api: transferClass
      confirm: 需要，预览表格已展示每条影响；逐条校验、任一条失败列出失败清单
      result: 批量结束原班关系并写入目标班关系（唯一行政班，BR-STU-003），原关系保留历史（BR-PROMO-007）；逐条校验，任一条失败列出失败清单（REQ-CLS-062 / DS-DENY-06）
      audit: 是
      batch: "2-3"

# ---------------------------------------------------------------------------
# 5.1 升班任务列表（PAGE-PRM-LIST）——批次 2-3e 首件样板
#     权限口径见 CR-012：新建 = create；预览 / 执行 / 重试 / 取消 = update；read 决定列表可见性
# ---------------------------------------------------------------------------
promotion_list:
  page: PAGE-PRM-LIST
  actions:
    - id: ACT-PRM-001
      element: 新建任务
      trigger: 点击
      condition: 有 promotion.batch:create 权限
      permission: "academic_director / promotion.batch / create"
      api: "-"
      result: 进入 PAGE-PRM-CREATE 四步向导第一步；创建前校验目标学年学期的年级与班级是否齐备（REQ-PRM-009）
      audit: 否
      batch: "2-3"
    - id: ACT-PRM-002
      element: 行内「预览」/「重新预览」
      trigger: 点击行内按钮
      condition: 有 promotion.batch:update 权限；任务状态为草稿或已预览待确认
      permission: "academic_director / promotion.batch / update"
      api: previewPromotionTask
      confirm: 重新预览会覆盖旧明细时提示"重新生成预览会覆盖旧明细"（REQ-PRM-021）
      result: 生成升班预览（不写入任何学生数据，REQ-PRM-020）；完成后状态转为已预览待确认，进入 PAGE-PRM-PREVIEW
      audit: 是
      batch: "2-3"
    - id: ACT-PRM-003
      element: 行内「执行」/「查看校验」
      trigger: 点击行内按钮
      condition: 有 promotion.batch:update 权限；任务状态为已预览待确认或校验中
      permission: "academic_director / promotion.batch / update"
      api: executePromotionTask
      confirm: 需要，先进入 PAGE-PRM-VALIDATE 展示通过 / 警告 / 错误；存在错误项时必须先修正或跳过（REQ-PRM-025）
      result: 异步执行升班，立即返回任务编号（REQ-PRM-027）；执行按学年追加、幂等（BR-PROMO-001 / 003）
      audit: 是
      batch: "2-3"
    - id: ACT-PRM-004
      element: 行内「重试失败项」/「重试」/「继续执行剩余项」
      trigger: 点击行内按钮
      condition: 有 promotion.batch:update 权限；任务状态为部分失败、失败或已取消
      permission: "academic_director / promotion.batch / update"
      api: retryPromotionTask
      confirm: 需要，文案写清"只重新处理失败项 / 剩余项，已成功的记录不重复执行"
      result: 只重试失败项或继续执行剩余项（REQ-PRM-032 / 已确认 4）；幂等键为"任务编号 + 学生 + 目标学年学期"
      audit: 是
      batch: "2-3"
    - id: ACT-PRM-005
      element: 行内「取消」
      trigger: 点击行内按钮
      condition: 有 promotion.batch:update 权限；任务未结束（草稿 / 已预览待确认 / 校验中 / 执行中）
      permission: "academic_director / promotion.batch / update"
      api: "-"
      result: 打开同页确认片段 DIALOG-PRM-CANCEL，原因必填；文案写清"保留已完成部分，可继续执行剩余项或逐条回滚"
      audit: 否
      batch: "2-3"
    - id: ACT-PRM-006
      element: 行内「查看结果」/「查看进度」
      trigger: 点击行内按钮
      condition: 有 promotion.batch:read 权限
      permission: "promotion.batch / read"
      api: getPromotionTask
      result: 进入 PAGE-PRM-RESULT 查看执行进度与结果报告（成功 / 失败 / 留级 / 毕业清单）
      audit: 否
      batch: "2-3"
    - id: ACT-PRM-007
      element: 导出（任务台账）
      trigger: 点击
      condition: 有 data.export:export 权限
      permission: "data.export:export"
      confirm: 需要，提示"年级主任导出限本人负责年级"
      api: exportPromotionTask
      result: 行数 ≤ 2000 直接下载，否则转异步任务；导出写入审计（REQ-PRM-019 / NFR-AUDIT-01）
      audit: 是
      batch: "2-3"
    - id: ACT-PRM-008
      element: 行内「结果导出」
      trigger: 点击行内按钮
      condition: 有 data.export:export 权限；任务已完成或部分失败
      permission: "data.export:export"
      api: exportPromotionResult
      result: 下载结果报告（成功清单、失败清单、留级清单、毕业清单，REQ-PRM-034）；下载前重新解析数据范围（DS-DENY-04）
      audit: 是
      batch: "2-3"
    - id: ACT-PRM-009
      element: 取消任务确认片段「返回」
      trigger: 点击返回或按 Esc
      condition: 始终可用
      permission: "-"
      api: "-"
      result: 关闭 DIALOG-PRM-CANCEL，不产生任何写入
      audit: 否
      batch: "2-3"
    - id: ACT-PRM-010
      element: 确认取消任务
      trigger: 点击确认取消
      condition: 已填写取消原因（至少 5 个字）
      permission: "academic_director / promotion.batch / update"
      api: cancelPromotionTask
      result: 任务状态置为已取消，保留已完成部分；写审计且不可删除（REQ-PRM-036 / REQ-PRM-058）
      audit: 是
      batch: "2-3"

# ---------------------------------------------------------------------------
# 升班向导第一步（PAGE-PRM-CREATE）——批次 2-3e-s2
# ---------------------------------------------------------------------------
promotion_create:
  page: PAGE-PRM-CREATE
  actions:
    - id: ACT-PRM-011
      element: 取消
      trigger: 点击
      condition: 有 promotion.batch:create 权限
      permission: "academic_director / promotion.batch / create"
      api: "-"
      confirm: 已填写内容时提示"返回列表会丢弃当前填写的范围，任务不会被创建"
      result: 返回 PAGE-PRM-LIST，保留列表的筛选条件与页码，不产生任何写入
      audit: 否
      batch: "2-3"
    - id: ACT-PRM-012
      element: 下一步：预览与调整
      trigger: 点击
      condition: 有 promotion.batch:create 权限；源与目标学年学期已选且目标起始日期晚于源；目标学年学期的年级与班级齐备；同一源→目标学期没有未结束任务
      permission: "academic_director / promotion.batch / create"
      api: addPromotionTask
      result: 创建草稿任务（REQ-PRM-011）并写入审计（REQ-PRM-012），随后进入 PAGE-PRM-PREVIEW 生成升班预览；阻塞项存在时不发请求，只给字段级或页面级提示
      audit: 是
      batch: "2-3"
    - id: ACT-PRM-013
      element: 重新校验（目标学年学期的年级与班级齐备性）
      trigger: 点击
      condition: 有 promotion.batch:create 权限
      permission: "academic_director / promotion.batch / create"
      api: "-"
      result: 重新解析目标学年学期的年级与班级清单与未结束任务，刷新阻塞项与耗时预估；前端校验不作为安全边界，后端在 addPromotionTask 内重复校验（NFR-SEC-05）
      audit: 否
      batch: "2-3"
    - id: ACT-PRM-014
      element: 查看在读名单
      trigger: 点击
      condition: 有 person.student:read 权限
      permission: "person.student / read"
      api: "-"
      result: 跳转 PAGE-STU-LIST，按源学年学期与"在读"口径查看参与升班的学生
      audit: 否
      batch: "2-3"
    - id: ACT-PRM-015
      element: 去创建年级
      trigger: 点击
      condition: 目标学年学期缺年级（REQ-PRM-009）
      permission: "org.grade / read"
      api: "-"
      result: 跳转 PAGE-GRD-LIST，按目标学年学期新建缺失的年级（年级的唯一写入入口在年级模块）
      audit: 否
      batch: "2-3"
    - id: ACT-PRM-016
      element: 去创建班级
      trigger: 点击
      condition: 目标学年学期缺班级（REQ-PRM-009）
      permission: "org.class / read"
      api: "-"
      result: 跳转 PAGE-CLS-LIST，按目标学年学期补建缺失的班级
      audit: 否
      batch: "2-3"
    - id: ACT-PRM-017
      element: 查看已有任务
      trigger: 点击
      condition: 同一源→目标学期已存在未结束任务（REQ-PRM-005）
      permission: "promotion.batch / read"
      api: "-"
      result: 跳转 PAGE-PRM-LIST，定位到该未结束任务，可继续执行或取消
      audit: 否
      batch: "2-3"
    - id: ACT-PRM-018
      element: 去学生管理核对学籍状态（空态主动作）
      trigger: 点击
      condition: 源学年学期的在读学生数为 0
      permission: "person.student / read"
      api: "-"
      result: 跳转 PAGE-STU-LIST，核对学籍状态（休学 / 转入未报到 / 出国保留学籍都不计入在读名单，BR-STU-012）
      audit: 否
      batch: "2-3"
    - id: ACT-PRM-019
      element: 返回任务列表（空态 / 错误态 / 无权限态的返回入口）
      trigger: 点击
      condition: 有 promotion.batch:read 权限
      permission: "promotion.batch / read"
      api: "-"
      result: 返回 PAGE-PRM-LIST；只读角色看到的是列表的只读形态（CR-012）
      audit: 否
      batch: "2-3"

# ---------------------------------------------------------------------------
# 升班向导第二步：预览与调整（PAGE-PRM-PREVIEW）——批次 2-3e-s3
# ---------------------------------------------------------------------------
promotion_preview:
  page: PAGE-PRM-PREVIEW
  actions:
    - id: ACT-PRM-020
      element: 上一步：选择学年学期
      trigger: 点击
      condition: 有 promotion.batch:update 权限
      permission: "academic_director / promotion.batch / update"
      api: "-"
      result: 返回 PAGE-PRM-CREATE 修改源 / 目标学年学期；已生成的预览明细保留，重新预览时才覆盖
      audit: 否
      batch: "2-3"
    - id: ACT-PRM-021
      element: 重新预览
      trigger: 点击
      condition: 有 promotion.batch:update 权限
      permission: "academic_director / promotion.batch / update"
      api: previewPromotionTask
      confirm: 需要，提示"重新生成预览会覆盖旧明细"
      result: 重新生成升班明细（仍不写入任何学生数据，REQ-PRM-020）；任务状态回到已预览待确认（REQ-PRM-021）
      audit: 是
      batch: "2-3"
    - id: ACT-PRM-022
      element: 导出预览结果
      trigger: 点击
      condition: 有 data.export:export 权限
      permission: "data.export:export"
      api: exportPromotionPreview
      result: 导出预览清单（源班级 / 目标班级 / 结果类型），供教务主任线下核对后再确认（REQ-PRM-019）；行数 ≤ 2000 直接下载，否则转异步
      audit: 是
      batch: "2-3"
    - id: ACT-PRM-023
      element: 应用到本班（按源班级整体指定目标班级）
      trigger: 点击
      condition: 有 promotion.batch:update 权限；该源班级至少 1 名在读学生
      permission: "academic_director / promotion.batch / update"
      api: batchUpdatePromotionItem
      result: 该源班级的全部明细统一写入目标班级（REQ-PRM-018）；毕业年级不提供该入口；写入后仍可逐条调整
      audit: 是
      batch: "2-3"
    - id: ACT-PRM-024
      element: 行内「调整」
      trigger: 点击明细行内按钮
      condition: 有 promotion.batch:update 权限
      permission: "academic_director / promotion.batch / update"
      api: "-"
      result: 打开 PAGE-PRM-ADJUST 弹窗并带入该学生、源班级与当前处理方式（REQ-PRM-017）
      audit: 否
      batch: "2-3"
    - id: ACT-PRM-025
      element: 下一步：升班校验
      trigger: 点击
      condition: 有 promotion.batch:update 权限
      permission: "academic_director / promotion.batch / update"
      api: validatePromotionTask
      result: 进入 PAGE-PRM-VALIDATE，按 REQ-PRM-022 的五个维度校验；存在错误项时不允许执行（REQ-PRM-025）
      audit: 是
      batch: "2-3"
    - id: ACT-PRM-026
      element: 左栏源班级行（只看该班明细）
      trigger: 点击
      condition: 有 promotion.batch:read 权限
      permission: "promotion.batch / read"
      api: "-"
      result: 右栏明细按该源班级过滤（REQ-PRM-013 的「源班级 → 目标班级」分组视角）；再点同一行回到全部
      audit: 否
      batch: "2-3"

# ---------------------------------------------------------------------------
# 升班向导第二步的调整弹窗（PAGE-PRM-ADJUST）——批次 2-3e-s3
# ---------------------------------------------------------------------------
promotion_adjust:
  page: PAGE-PRM-ADJUST
  actions:
    - id: ACT-PRM-027
      element: 取消
      trigger: 点击取消或按 Esc
      condition: 始终可用
      permission: "-"
      api: "-"
      result: 关闭 PAGE-PRM-ADJUST，不写入任何明细字段
      audit: 否
      batch: "2-3"
    - id: ACT-PRM-028
      element: 保存调整
      trigger: 点击保存
      condition: 升级 / 转班必须指定目标班级；留级 / 跳过必须填写原因
      permission: "academic_director / promotion.batch / update"
      api: updatePromotionItem
      result: 只写升班明细的 result_type / target_class_id / 原因（REQ-PRM-017），不改学生数据（REQ-PRM-020）；留级的去向是目标学年学期的同学段同名年级（BR-PROMO-006）
      audit: 是
      batch: "2-3"

# ---------------------------------------------------------------------------
# 升班模块的跨页通用动作（列表 / 预览 / 校验 / 执行 / 结果共用）
# ---------------------------------------------------------------------------
promotion_common:
  page: "PAGE-PRM-LIST / PAGE-PRM-PREVIEW / PAGE-PRM-VALIDATE / PAGE-PRM-EXECUTE / PAGE-PRM-RESULT"
  actions:
    - id: ACT-PRM-043
      element: 返回任务列表
      trigger: 点击
      condition: 有 promotion.batch:read 权限
      permission: "promotion.batch / read"
      api: "-"
      result: 返回 PAGE-PRM-LIST（列表保留筛选与页码）；只读角色看到只读形态（CR-012）
      audit: 否
      batch: "2-3"

# ---------------------------------------------------------------------------
# 升班向导第三步：校验结果（PAGE-PRM-VALIDATE）——批次 2-3e-s4
# ---------------------------------------------------------------------------
promotion_validate:
  page: PAGE-PRM-VALIDATE
  actions:
    - id: ACT-PRM-029
      element: 上一步：预览与调整 / 回到预览修正
      trigger: 点击
      condition: 有 promotion.batch:update 权限
      permission: "academic_director / promotion.batch / update"
      api: "-"
      result: 返回 PAGE-PRM-PREVIEW 修改去向；存在错误项时这是首选修正路径（REQ-PRM-025）
      audit: 否
      batch: "2-3"
    - id: ACT-PRM-030
      element: 重新校验
      trigger: 点击
      condition: 有 promotion.batch:update 权限
      permission: "academic_director / promotion.batch / update"
      api: validatePromotionTask
      result: 按 REQ-PRM-022 的五个维度重新校验，刷新通过 / 警告 / 错误三分类（REQ-PRM-023）
      audit: 是
      batch: "2-3"
    - id: ACT-PRM-031
      element: 按维度下钻（全部 / 通过 / 警告 / 错误）
      trigger: 点击
      condition: 有 promotion.batch:read 权限
      permission: "promotion.batch / read"
      api: "-"
      result: 明细清单按校验级别过滤，用于下钻到具体学生（REQ-PRM-026）
      audit: 否
      batch: "2-3"
    - id: ACT-PRM-032
      element: 行内「标记跳过」
      trigger: 点击行内按钮
      condition: 有 promotion.batch:update 权限；该行不是「通过」
      permission: "academic_director / promotion.batch / update"
      api: updatePromotionItem
      result: 把该学生的 result_type 置为 skip（本次不处理），用于放行错误项（REQ-PRM-025 / REQ-PRM-017）；不改学生数据
      audit: 是
      batch: "2-3"
    - id: ACT-PRM-033
      element: 确认执行（异步）
      trigger: 点击
      condition: 有 promotion.batch:update 权限；没有任何错误项（或错误项已标记跳过）
      permission: "academic_director / promotion.batch / update"
      api: executePromotionTask
      confirm: 需要，文案写清"只新增下一学年的班级与学生关系，不改写源学年"
      result: 异步执行并立即返回任务编号（REQ-PRM-027），按幂等键写入（REQ-PRM-029），进入 PAGE-PRM-EXECUTE
      audit: 是
      batch: "2-3"

# ---------------------------------------------------------------------------
# 升班向导第四步：执行与进度（PAGE-PRM-EXECUTE）——批次 2-3e-s4
# ---------------------------------------------------------------------------
promotion_execute:
  page: PAGE-PRM-EXECUTE
  actions:
    - id: ACT-PRM-034
      element: 刷新进度
      trigger: 点击
      condition: 有 promotion.batch:read 权限
      permission: "promotion.batch / read"
      api: getPromotionTask
      result: 刷新已处理 / 总数与成功 / 失败计数（REQ-PRM-031）；离开页面不影响后台执行
      audit: 否
      batch: "2-3"
    - id: ACT-PRM-035
      element: 取消任务（去列表）
      trigger: 点击
      condition: 有 promotion.batch:update 权限；任务未结束
      permission: "academic_director / promotion.batch / update"
      api: "-"
      result: 返回 PAGE-PRM-LIST 并在行内「取消」完成二次确认（原因必填）；取消后保留已完成部分、不做整批回滚（已确认 4 / ACT-PRM-010）
      audit: 否
      batch: "2-3"
    - id: ACT-PRM-036
      element: 查看结果
      trigger: 点击
      condition: 有 promotion.batch:read 权限
      permission: "promotion.batch / read"
      api: "-"
      result: 进入 PAGE-PRM-RESULT 查看成功 / 失败 / 留级 / 毕业四类清单（REQ-PRM-034）并重试失败项
      audit: 否
      batch: "2-3"

# ---------------------------------------------------------------------------
# 升班结果与重试（PAGE-PRM-RESULT）——批次 2-3e-s4
# ---------------------------------------------------------------------------
promotion_result:
  page: PAGE-PRM-RESULT
  actions:
    - id: ACT-PRM-037
      element: 只重试失败项
      trigger: 点击
      condition: 有 promotion.batch:update 权限；存在失败项
      permission: "academic_director / promotion.batch / update"
      api: retryPromotionTask
      confirm: 需要，文案写清"只重新处理失败项，已成功的记录不重复执行"
      result: 只重试失败项（REQ-PRM-032），按幂等键跳过已成功的关系（REQ-PRM-028 / REQ-PRM-029）
      audit: 是
      batch: "2-3"
    - id: ACT-PRM-038
      element: 结果导出
      trigger: 点击
      condition: 有 data.export:export 权限
      permission: "data.export:export"
      api: exportPromotionResult
      result: 下载结果报告（成功清单 / 失败清单 / 留级清单 / 毕业清单，REQ-PRM-034）；下载前重新解析数据范围（DS-DENY-04）
      audit: 是
      batch: "2-3"
    - id: ACT-PRM-039
      element: 继续执行剩余项
      trigger: 点击
      condition: 有 promotion.batch:update 权限；任务为已取消或存在未处理项
      permission: "academic_director / promotion.batch / update"
      api: retryPromotionTask
      result: 保留已完成的升班结果，只处理剩余未升班的学生（已确认 4）；已成功的关系不重复写入（REQ-PRM-028）
      audit: 是
      batch: "2-3"
    - id: ACT-PRM-040
      element: 行内「查看学生」（失败清单）
      trigger: 点击行内按钮
      condition: 有 person.student:read 权限
      permission: "person.student / read"
      api: "-"
      result: 跳转 PAGE-STU-LIST 核对该学生的学籍状态与班级关系（失败项定位用）
      audit: 否
      batch: "2-3"
    - id: ACT-PRM-041
      element: 切换结果清单（成功 / 失败 / 留级 / 毕业）
      trigger: 点击
      condition: 有 promotion.batch:read 权限
      permission: "promotion.batch / read"
      api: "-"
      result: 在四类清单之间切换（REQ-PRM-034）；数据范围仍按角色过滤（年级主任只看本人负责年级）
      audit: 否
      batch: "2-3"

# ---------------------------------------------------------------------------
# 导入向导与三个模块导入向导的共用动作（PAGE-IMP-WIZARD / STU-IMPORT / TCH-IMPORT / CLS-ROSTER-IMPORT）——批次 2-4
# ---------------------------------------------------------------------------
import_common:
  page: "PAGE-IMP-WIZARD / PAGE-STU-IMPORT / PAGE-TCH-IMPORT / PAGE-CLS-ROSTER-IMPORT"
  actions:
    - id: ACT-IMP-001
      element: 下载模板
      trigger: 点击
      condition: 有 data.import:import 权限
      permission: "data.import:import"
      api: downloadImportTemplate
      result: 下载当前模块当前版本的导入模板（含列名、必填标记、格式说明与示例行，REQ-IMP-002）；下载写审计；旧版模板仍可下载但强提示（IMP-Q-05）
      audit: 是
      batch: "2-4"
    - id: ACT-IMP-002
      element: 下一步
      trigger: 点击
      condition: 有 data.import:import 权限
      permission: "data.import:import"
      api: "-"
      result: 进入下一步（上传并校验 → 校验结果 → 确认执行）；同步校验上限 5000 行 / 10 MB / 30 秒（IMP-Q-01 / NFR-PERF-06）
      audit: 否
      batch: "2-4"
    - id: ACT-IMP-003
      element: 上一步
      trigger: 点击
      condition: 有 data.import:import 权限
      permission: "data.import:import"
      api: "-"
      result: 回到上一步；已上传文件与校验结果保留，不重复解析
      audit: 否
      batch: "2-4"
    - id: ACT-IMP-005
      element: 下载失败明细
      trigger: 点击
      condition: 有 data.import:import 权限；存在失败行
      permission: "data.import:import"
      api: downloadImportFailedRows
      result: 下载失败明细（行号 + 对象 + 原因），逐条修正后重传（REQ-IMP-012）；临时文件有效期 7 天（IMP-Q-02）
      audit: 是
      batch: "2-4"
    - id: ACT-IMP-006
      element: 确认执行（异步）
      trigger: 点击
      condition: 有 data.import:import 权限；校验已完成且存在可执行行
      permission: "data.import:import"
      api: executeImport
      confirm: 需要，文案写清"只导入可执行行，失败行不导入；同一批次重复提交幂等"
      result: 异步执行导入并立即返回任务编号（REQ-IMP-015）；幂等（BR-IMP-002），并发配额同一用户 1 个 / 同一学校 3 个（IMP-Q-03）
      audit: 是
      batch: "2-4"
    - id: ACT-IMP-007
      element: 查看异步任务
      trigger: 点击
      condition: 有 data.async_task:read 权限
      permission: "data.async_task:read"
      api: "-"
      result: 进入 PAGE-IMP-TASK-LIST 查看进度与结果文件（REQ-IMP-052）；该页在批次 2-9 交付，本批给批次提示
      audit: 否
      batch: "2-4"
    - id: ACT-IMP-008
      element: 下载结果摘要 / 学号对照表
      trigger: 点击
      condition: 有 data.import:import 权限
      permission: "data.import:import"
      api: downloadImportResult
      result: 下载结果摘要与学号对照表（学生导入：学校自带学号 → 系统学号，仅对照不入库，REQ-IMP-021 ~ 023）；结果文件 7 天、任务元数据 90 天
      audit: 是
      batch: "2-4"
    - id: ACT-IMP-009
      element: 重新导入
      trigger: 点击
      condition: 有 data.import:import 权限
      permission: "data.import:import"
      api: "-"
      result: 回到第 1 步重新选择模板与文件；上一批任务记录与结果文件保留
      audit: 否
      batch: "2-4"
    - id: ACT-IMP-010
      element: 去异步任务中心（无权限态的只读出口）
      trigger: 点击
      condition: 有 data.async_task:read 权限
      permission: "data.async_task:read"
      api: "-"
      result: 进入 PAGE-IMP-TASK-LIST；无导入权限的角色只能看任务状态，不能发起导入
      audit: 否
      batch: "2-4"
    - id: ACT-IO-001
      element: 拖拽上传区
      trigger: 拖入文件 / 点击
      condition: 有 data.import:import 权限
      permission: "data.import:import"
      api: "-"
      result: 接收单个 .xlsx / .xls 文件；超过 5000 行或 10 MB 时给「拆分后重新上传」提示，不做后台静默接收（REQ-IMP-010）
      audit: 否
      batch: "2-4"
    - id: ACT-IO-002
      element: 选择文件
      trigger: 点击
      condition: 有 data.import:import 权限
      permission: "data.import:import"
      api: "-"
      result: 打开系统文件选择框（单文件）；选中后回填文件名与行数，再点「下一步」进入同步校验
      audit: 否
      batch: "2-4"

# ---------------------------------------------------------------------------
# 独立于管理后台的页面：登录与异常页（PAGE-LOGIN / 403 / 404 / 500）——批次 2-4
# 载体决策：这四页不套管理外壳（与真实系统一致），因此不提供角色 / 状态演示面板；
# 页面自身的状态（提交中 / 错误 / 锁定）在页内直接可见。
# ---------------------------------------------------------------------------
auth:
  page: PAGE-LOGIN
  actions:
    - id: ACT-AUTH-001
      element: 登录
      trigger: 点击 / 回车
      condition: 登录名与密码均已填写
      permission: "-"
      api: login
      result: 校验账号密码并写审计（NFR-AUDIT-01）；连续 5 次错误锁定 5 分钟（NFR-SEC-04）；首次登录强制改密（D-039）
      audit: 是
      batch: "2-4"
    - id: ACT-AUTH-002
      element: 学校（多校账号切换）
      trigger: 切换下拉
      condition: 账号具备多校权限
      permission: "-"
      api: "-"
      result: 切换登录入口对应的租户 / 学校；学校用户登录后该下拉不可切换
      audit: 否
      batch: "2-4"
    - id: ACT-AUTH-003
      element: 忘记密码
      trigger: 点击
      condition: 始终可用
      permission: "-"
      api: "-"
      result: 首轮不做自助找回，提示联系本校管理员重置；管理员重置后同样发放一次性凭据（D-039）
      audit: 否
      batch: "2-4"

error_page:
  page: "PAGE-403 / PAGE-404 / PAGE-500"
  actions:
    - id: ACT-ERR-001
      element: 返回工作台
      trigger: 点击
      condition: 始终可用
      permission: "-"
      api: "-"
      result: 回到登录后的工作台首页（原型演示给轻提示）
      audit: 否
      batch: "2-4"
    - id: ACT-ERR-002
      element: 申请开通权限
      trigger: 点击（403）
      condition: 始终可用
      permission: "-"
      api: "-"
      result: 提示联系本校管理员或运营管理员开通；缺少权限的访问同样写审计（NFR-AUDIT-02）
      audit: 否
      batch: "2-4"
    - id: ACT-ERR-003
      element: 返回上一页
      trigger: 点击（404）
      condition: 存在历史记录
      permission: "-"
      api: "-"
      result: 返回来源页面；地址若来自系统内跳转，需把来源与路径反馈给维护者
      audit: 否
      batch: "2-4"
    - id: ACT-ERR-004
      element: 重试
      trigger: 点击（500）
      condition: 始终可用
      permission: "-"
      api: "-"
      result: 重发上一个请求；批量类写操作走异步任务，失败整批记录原因可重试（NFR-MQ-02），不产生部分写入
      audit: 否
      batch: "2-4"
    - id: ACT-ERR-005
      element: 去异步任务中心
      trigger: 点击（500）
      condition: 有 data.async_task:read 权限
      permission: "data.async_task:read"
      api: "-"
      result: 进入 PAGE-IMP-TASK-LIST 查看失败任务与重试入口（该页在批次 2-9 交付）
      audit: 否
      batch: "2-4"

# ---------------------------------------------------------------------------
# 学生详情抽屉与变更记录区块（PAGE-STU-DETAIL / PAGE-STU-HISTORY）——批次 2-5
# ---------------------------------------------------------------------------
student_detail:
  page: "PAGE-STU-DETAIL / PAGE-STU-HISTORY"
  actions:
    - id: ACT-STU-023
      element: 查看完整（证件号 / 联系电话）
      trigger: 点击
      condition: 证件号需要 person.student:read_sensitive；联系电话需要 person.student_contact:read_contact
      permission: "person.student:read_sensitive / person.student_contact:read_contact"
      api: "-"
      result: 展示完整值并写入敏感数据访问日志（访问人、对象、字段、时间、用途）；租户侧可见（NFR-AUDIT-03 / DS-DENY-09）
      audit: 是
      batch: "2-5"
    - id: ACT-STU-024
      element: 编辑监护人信息
      trigger: 点击
      condition: 有 person.student_guardian:update 权限（教务主任 / 班主任；年级主任只读）
      permission: "person.student_guardian / update"
      api: saveStudentGuardian
      result: 保存监护人信息（班主任为唯一写入口）；一个家长可关联多个孩子，绑定上限 3（GAP-015）
      audit: 是
      batch: "2-5"
    - id: ACT-STU-034
      element: 监护人「解绑」
      trigger: 点击行内按钮
      condition: 有 person.student_guardian:update 权限
      permission: "person.student_guardian / update"
      api: unbindStudentGuardian
      result: 提交解绑申请（需班主任确认）；未通过可重提，同一字段同时只允许一条待审核（GAP-018）
      audit: 是
      batch: "2-5"
    - id: ACT-STU-025
      element: 详情「学籍异动」
      trigger: 点击
      condition: 有 enrollment.status:update 权限；学生不是终态
      permission: "enrollment.status / update"
      api: "-"
      result: 打开 PAGE-STU-STATUS，带入该学生与当前状态；可执行异动由 listEnrollmentStatusOption 计算
      audit: 否
      batch: "2-5"
    - id: ACT-STU-026
      element: 详情「调班」
      trigger: 点击
      condition: 有 org.class:update 权限；学生有行政班关系
      permission: "org.class / update"
      api: "-"
      result: 打开 PAGE-STU-TRANSFER，带入该学生与当前班级（源班级不可选）
      audit: 否
      batch: "2-5"
    - id: ACT-STU-027
      element: 详情「跨校转学」
      trigger: 点击
      condition: 有 enrollment.transfer:create 权限（教务主任）
      permission: "enrollment.transfer / create"
      api: "-"
      result: 进入 PAGE-STU-CROSS-TRANSFER 跨校转学向导（转出校发起）
      audit: 否
      batch: "2-5"
    - id: ACT-STU-028
      element: 详情「异动登记（升班口径）」
      trigger: 点击
      condition: 有 enrollment.status:update 权限
      permission: "enrollment.status / update"
      api: "-"
      result: 打开 PAGE-PRM-CHANGE（与 PAGE-STU-STATUS 同字段、同接口，额外强制阶段与审批约束）
      audit: 否
      batch: "2-5"
    - id: ACT-STU-029
      element: 变更记录「查看全部」
      trigger: 点击
      condition: 有 audit.log:read 权限
      permission: "audit.log / read"
      api: "-"
      result: 跳转 PAGE-AUDIT-LOG-LIST，按对象筛选该学生的全部变更（该页在批次 2-8 交付）
      audit: 否
      batch: "2-5"

# ---------------------------------------------------------------------------
# 学籍异动（PAGE-STU-STATUS）与调班（PAGE-STU-TRANSFER）——批次 2-5
# ---------------------------------------------------------------------------
student_status:
  page: PAGE-STU-STATUS
  actions:
    - id: ACT-STU-030
      element: 提交异动
      trigger: 点击
      condition: 异动类型与生效日期、原因均已填；流转合法（FD-enrollment_status.transitions）
      permission: "enrollment.status / update"
      api: changeEnrollmentStatus
      confirm: 需要，文案写清「原状态 → 新状态、生效日期、是否保留班级关系与在读口径」
      result: 按状态机流转并写审计（BR-PROMO-012）；生效后立即更新数据范围缓存（DP-06）；非法流转直接拒绝
      audit: 是
      batch: "2-5"
    - id: ACT-STU-031
      element: 取消（异动弹窗）
      trigger: 点击取消或按 Esc
      condition: 始终可用
      permission: "-"
      api: "-"
      result: 关闭 PAGE-STU-STATUS，不写入
      audit: 否
      batch: "2-5"

student_transfer:
  page: PAGE-STU-TRANSFER
  actions:
    - id: ACT-STU-032
      element: 确认调班
      trigger: 点击
      condition: 已选目标班级；目标班级未停用且与源班级不同
      permission: "org.class / update"
      api: transferStudentClass
      result: 更新学生的行政班关系并写审计；学号与学籍状态不变（BR-STU-016）；同一学年学期只保留一条行政班关系
      audit: 是
      batch: "2-5"
    - id: ACT-STU-033
      element: 取消（调班弹窗）
      trigger: 点击取消或按 Esc
      condition: 始终可用
      permission: "-"
      api: "-"
      result: 关闭 PAGE-STU-TRANSFER，不写入
      audit: 否
      batch: "2-5"

# ---------------------------------------------------------------------------
# 异动登记（PAGE-PRM-CHANGE，升班与学籍异动模块口径）——批次 2-5
# ---------------------------------------------------------------------------
promotion_change:
  page: PAGE-PRM-CHANGE
  actions:
    - id: ACT-PRM-044
      element: 提交登记
      trigger: 点击
      condition: 异动类型、生效日期、原因均已填；阶段与审批约束满足（义务教育不得开除；退学 / 开除 / 死亡需校级管理员审批）
      permission: "enrollment.status / update"
      api: changeEnrollmentStatus
      confirm: 需要，文案写清「需要审批的异动在审批通过前不生效」
      result: 与 PAGE-STU-STATUS 同一接口与同一字段集；额外校验阶段限制与审批要求（REQ-PRM-043 / 044），并更新数据范围缓存（DP-06）
      audit: 是
      batch: "2-5"
    - id: ACT-PRM-045
      element: 取消（异动登记弹窗）
      trigger: 点击取消或按 Esc
      condition: 始终可用
      permission: "-"
      api: "-"
      result: 关闭 PAGE-PRM-CHANGE，不写入
      audit: 否
      batch: "2-5"

# ---------------------------------------------------------------------------
# 跨校转学：转出校向导（PAGE-STU-CROSS-TRANSFER）与转入校向导（PAGE-PRM-TRANSFER）——批次 2-5
# ---------------------------------------------------------------------------
student_cross_transfer:
  page: PAGE-STU-CROSS-TRANSFER
  actions:
    - id: ACT-STU-040
      element: 下一步
      trigger: 点击
      condition: 当前步骤必填项已完成
      permission: "enrollment.transfer / create"
      api: "-"
      result: 进入下一步（选择学生 → 转入校与目标班级 → 确认提交 → 结果）
      audit: 否
      batch: "2-5"
    - id: ACT-STU-041
      element: 上一步
      trigger: 点击
      condition: 有 enrollment.transfer:create 权限
      permission: "enrollment.transfer / create"
      api: "-"
      result: 回到上一步；已填内容保留
      audit: 否
      batch: "2-5"
    - id: ACT-STU-042
      element: 提交转学申请
      trigger: 点击
      condition: 学生无未完成转学单（REQ-PRM-057）；已选转入校与目标年级班级
      permission: "enrollment.transfer / create"
      api: addTransfer
      confirm: 需要，文案写清「提交后学生在本校置为已转出、转入校收到待报到记录；学号保持不变」
      result: 生成转学单（status=待接收），原在校记录置为已转出，转入校新建「转入未报到」记录；两侧都写审计（REQ-PRM-051 / 056）
      audit: 是
      batch: "2-5"
    - id: ACT-STU-043
      element: 撤销转学申请
      trigger: 点击（结果步骤）
      condition: 转入校尚未接收
      permission: "enrollment.transfer / create"
      api: cancelTransfer
      result: 撤销转学单（记录逻辑删除并留痕），不产生转出记录（REQ-PRM-054）
      audit: 是
      batch: "2-5"

promotion_transfer:
  page: PAGE-PRM-TRANSFER
  actions:
    - id: ACT-PRM-050
      element: 接收
      trigger: 点击待接收转学单
      condition: 有 enrollment.transfer 的 approve 权限（转入校教务主任）
      permission: "enrollment.transfer / approve"
      api: acceptTransfer
      confirm: 需要，文案写清「接收后学生在转入校建立待报到记录，接收前不计入转入校任何在读数与花名册」
      result: 接收动作本身即审批（REQ-PRM-051 / 已确认 3）；转入校可撤销接收（REQ-PRM-054）
      audit: 是
      batch: "2-5"
    - id: ACT-PRM-051
      element: 报到
      trigger: 点击
      condition: 转学单已接收且学生到校
      permission: "enrollment.status / update"
      api: checkInTransfer
      result: 学生状态由「转入未报到」转为「在读」，进入转入校在读名单与花名册（REQ-PRM-051 / BR-STU-023）
      audit: 是
      batch: "2-5"
    - id: ACT-PRM-052
      element: 下一步
      trigger: 点击
      condition: 当前步骤已选转学单
      permission: "enrollment.transfer / read"
      api: "-"
      result: 进入下一步（待接收清单 → 核对信息 → 接收 / 撤销 → 报到）
      audit: 否
      batch: "2-5"
    - id: ACT-PRM-053
      element: 上一步
      trigger: 点击
      condition: 有 enrollment.transfer:read 权限
      permission: "enrollment.transfer / read"
      api: "-"
      result: 回到上一步
      audit: 否
      batch: "2-5"
    - id: ACT-PRM-054
      element: 撤销接收
      trigger: 点击
      condition: 转学单已接收但学生未报到
      permission: "enrollment.transfer / approve"
      api: cancelTransfer
      result: 撤销接收：转入记录逻辑删除并留痕，此时不产生转出记录（REQ-PRM-054）
      audit: 是
      batch: "2-5"

# ---------------------------------------------------------------------------
# 异动历史（PAGE-PRM-HISTORY）——批次 2-5
# ---------------------------------------------------------------------------
promotion_history:
  page: PAGE-PRM-HISTORY
  actions:
    - id: ACT-PRM-046
      element: 异动登记
      trigger: 点击
      condition: 有 enrollment.status:update 权限
      permission: "enrollment.status / update"
      api: "-"
      result: 跳转 pages/student-list.html 并打开 PAGE-PRM-CHANGE 异动登记弹窗（登记入口唯一，避免两套规则）
      audit: 否
      batch: "2-5"
    - id: ACT-PRM-047
      element: 行内「查看学生」
      trigger: 点击行内按钮
      condition: 有 person.student:read 权限
      permission: "person.student / read"
      api: "-"
      result: 跳转 PAGE-STU-LIST 并定位该学生（用于核对学籍状态与班级关系）
      audit: 否
      batch: "2-5"
    - id: ACT-PRM-048
      element: 导出异动历史
      trigger: 点击
      condition: 有 data.export:export 权限
      permission: "data.export:export"
      api: exportData
      result: 按当前筛选导出异动历史（≤2000 行直接下载，否则转异步）；下载前重新解析数据范围（DS-DENY-04）
      audit: 是
      batch: "2-5"

# ---------------------------------------------------------------------------
# 学校管理（PAGE-SCH-LIST / DETAIL / CREATE / EDIT / STAGE / DISABLE）——批次 2-6a
# ---------------------------------------------------------------------------
school_list:
  page: "PAGE-SCH-LIST / PAGE-SCH-DETAIL / PAGE-SCH-CREATE / PAGE-SCH-EDIT / PAGE-SCH-STAGE / PAGE-SCH-DISABLE"
  actions:
    - id: ACT-SCH-001
      element: 新建学校
      trigger: 点击
      condition: 有 org.school:create 权限（租户管理员 / 超级管理员）
      permission: "tenant_admin / org.school / create"
      api: "-"
      result: 打开 PAGE-SCH-CREATE 弹窗（CR-015：表单类浮层统一用弹窗）；学校编码由系统生成
      audit: 否
      batch: "2-6"
    - id: ACT-SCH-002
      element: 开通初始化
      trigger: 点击
      condition: 有 org.school:create 权限
      permission: "tenant_admin / org.school / create"
      api: "-"
      result: 进入 PAGE-SCH-INIT 开通初始化向导（学校基本信息 → 学段与年级 → 学年学期 → 执行）
      audit: 否
      batch: "2-6"
    - id: ACT-SCH-003
      element: 导出
      trigger: 点击
      condition: 有 data.export:export 权限
      permission: "data.export:export"
      api: exportSchool
      result: 导出学校台账（集团与运营方需逐次授权并留痕，与 IMP-Q-04 同口径）；超 2000 行转异步
      audit: 是
      batch: "2-6"
    - id: ACT-SCH-004
      element: 行内「校区数」
      trigger: 点击
      condition: 有 org.school:read 权限
      permission: "org.school / read"
      api: "-"
      result: 跳转 PAGE-SCH-CAMPUS 校区管理页（GAP-046 选项 A：不新增页面，复用详情下的校区管理）
      audit: 否
      batch: "2-6"
    - id: ACT-SCH-018
      element: 行内「详情」
      trigger: 点击
      condition: 有 org.school:read 权限
      permission: "org.school / read"
      api: getSchool
      result: 打开 PAGE-SCH-DETAIL 抽屉，带入该学校（基本信息 / 规模概览 / 学段配置）
      audit: 否
      batch: "2-6"
    - id: ACT-SCH-005
      element: 详情「配置学段」
      trigger: 点击
      condition: 有 org.school:update 权限
      permission: "tenant_admin / org.school / update"
      api: "-"
      result: 打开 PAGE-SCH-STAGE 弹窗（学段序号固定映射：小学 1–6、初中 / 高中 1–3）
      audit: 否
      batch: "2-6"
    - id: ACT-SCH-006
      element: 详情 / 行内「编辑学校」
      trigger: 点击
      condition: 有 org.school:update 权限；学校未停用
      permission: "tenant_admin / org.school / update"
      api: "-"
      result: 打开 PAGE-SCH-EDIT 弹窗；学校编码只读（变更需单独申请 updateSchoolCode 并写审计）
      audit: 否
      batch: "2-6"
    - id: ACT-SCH-007
      element: 详情「校区管理」
      trigger: 点击
      condition: 有 org.school:read 权限
      permission: "org.school / read"
      api: "-"
      result: 跳转 PAGE-SCH-CAMPUS（含新增 / 编辑 / 停用校区）
      audit: 否
      batch: "2-6"
    - id: ACT-SCH-008
      element: 详情「学段配置」
      trigger: 点击
      condition: 有 org.school:update 权限
      permission: "tenant_admin / org.school / update"
      api: "-"
      result: 同 ACT-SCH-005（详情底部的第二个入口）
      audit: 否
      batch: "2-6"
    - id: ACT-SCH-009
      element: 详情「停用学校」
      trigger: 点击
      condition: 有 org.school:update 权限
      permission: "tenant_admin / org.school / update"
      api: "-"
      result: 打开 PAGE-SCH-DISABLE 二次确认弹窗；原因必填并写审计
      audit: 否
      batch: "2-6"
    - id: ACT-SCH-010
      element: 新建学校「取消」
      trigger: 点击
      condition: 始终可用
      permission: "-"
      api: "-"
      result: 关闭 PAGE-SCH-CREATE，不写入
      audit: 否
      batch: "2-6"
    - id: ACT-SCH-011
      element: 新建学校「保存」
      trigger: 点击
      condition: 学校名称与所属租户必填、至少一个学段
      permission: "tenant_admin / org.school / create"
      api: addSchool
      result: 创建学校（编码系统生成、默认启用）并写审计；可在详情里继续配置学段与校区
      audit: 是
      batch: "2-6"
    - id: ACT-SCH-012
      element: 编辑学校「取消」
      trigger: 点击
      condition: 始终可用
      permission: "-"
      api: "-"
      result: 关闭 PAGE-SCH-EDIT，不写入
      audit: 否
      batch: "2-6"
    - id: ACT-SCH-013
      element: 编辑学校「保存」
      trigger: 点击
      condition: 学校名称必填
      permission: "tenant_admin / org.school / update"
      api: updateSchool
      result: 保存学校信息并写审计；编码与所属租户只读（编码变更走 updateSchoolCode）
      audit: 是
      batch: "2-6"
    - id: ACT-SCH-014
      element: 学段配置「取消」
      trigger: 点击
      condition: 始终可用
      permission: "-"
      api: "-"
      result: 关闭 PAGE-SCH-STAGE，不写入
      audit: 否
      batch: "2-6"
    - id: ACT-SCH-015
      element: 学段配置「保存配置」
      trigger: 点击
      condition: 已选学段
      permission: "tenant_admin / org.school / update"
      api: saveSchoolStage
      result: 保存学段启用配置（小学 1–6、初中 / 高中 1–3）；新增学段后可创建对应年级（BR-GRADE-006）
      audit: 是
      batch: "2-6"
    - id: ACT-SCH-016
      element: 停用学校「取消」
      trigger: 点击
      condition: 始终可用
      permission: "-"
      api: "-"
      result: 关闭 PAGE-SCH-DISABLE，不写入
      audit: 否
      batch: "2-6"
    - id: ACT-SCH-017
      element: 停用学校「确认停用」
      trigger: 点击
      condition: 已填写停用原因（≥5 字）
      permission: "tenant_admin / org.school / update"
      api: disableSchool
      result: 停用学校（不再出现在业务选择项，历史数据保留）并写审计；可再启用（enableSchool）
      audit: 是
      batch: "2-6"

# ---------------------------------------------------------------------------
# 校区管理（PAGE-SCH-CAMPUS）与开通初始化（PAGE-SCH-INIT）——批次 2-6b
# ---------------------------------------------------------------------------
school_campus:
  page: "PAGE-SCH-CAMPUS / PAGE-SCH-INIT"
  actions:
    - id: ACT-SCH-030
      element: 新增校区
      trigger: 点击
      condition: 有 org.school:update 权限
      permission: "tenant_admin / org.school / update"
      api: "-"
      result: 展开页内校区表单（校区是轻量对象，用页内表单而不是再开一层浮层）；编码留空由系统生成
      audit: 否
      batch: "2-6"
    - id: ACT-SCH-031
      element: 返回学校列表
      trigger: 点击
      condition: 有 org.school:read 权限
      permission: "org.school / read"
      api: "-"
      result: 返回 PAGE-SCH-LIST
      audit: 否
      batch: "2-6"
    - id: ACT-SCH-032
      element: 校区表单「取消」
      trigger: 点击
      condition: 始终可用
      permission: "-"
      api: "-"
      result: 收起页内表单，不写入
      audit: 否
      batch: "2-6"
    - id: ACT-SCH-033
      element: 校区表单「保存校区」
      trigger: 点击
      condition: 校区名称必填
      permission: "tenant_admin / org.school / update"
      api: saveCampus
      result: 新增 / 保存校区；校区不参与权限判定（BR-ORG-009），只用于组织与统计
      audit: 是
      batch: "2-6"
    - id: ACT-SCH-034
      element: 行内「编辑」（校区）
      trigger: 点击行内按钮
      condition: 有 org.school:update 权限
      permission: "tenant_admin / org.school / update"
      api: "-"
      result: 把该行填入页内表单并切到编辑态
      audit: 否
      batch: "2-6"
    - id: ACT-SCH-037
      element: 行内「停用」（校区）
      trigger: 点击行内按钮
      condition: 有 org.school:update 权限；校区为启用中
      permission: "tenant_admin / org.school / update"
      api: "-"
      result: 展开页内二次确认（写清影响范围）并显示原因必填
      audit: 否
      batch: "2-6"
    - id: ACT-SCH-035
      element: 停用相机确认「取消」
      trigger: 点击
      condition: 始终可用
      permission: "-"
      api: "-"
