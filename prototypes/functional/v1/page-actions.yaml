      api: "-"
      result: 跳转 PAGE-STR-STAT（独立页：图表 + 表格，CR-016）
      audit: 否
      batch: "2-7"
    - id: ACT-STR-021
      element: 选科配置
      trigger: 点击
      condition: 有 stream.config:read 权限
      permission: "stream.config / read"
      api: "-"
      result: 跳转 PAGE-STR-CONFIG
      audit: 否
      batch: "2-7"
    - id: ACT-STR-022
      element: 导出
      trigger: 点击
      condition: 有 data.export:export 权限
