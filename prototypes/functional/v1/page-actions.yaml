      audit: 否
      batch: "2-6"
    - id: ACT-SUB-006
      element: 行内「停用 / 启用」
      trigger: 点击行内按钮
      condition: 有 org.subject:update 权限
      permission: "tenant_admin / org.subject / update"
      api: disableSubject
