      condition: 有 stream.change_request:create 权限（班主任 / 教务主任）；该行不是待审批状态
      permission: "stream.change_request / create"
      api: "-"
      result: 打开 PAGE-STR-CHANGE 并带入该学生；待审批行显示「审批中」不提供入口
      audit: 否
      batch: "2-7"

