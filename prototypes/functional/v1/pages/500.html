<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>服务异常，请稍后重试 — 业务原型 v1（批次 2-4）</title>
<link rel="stylesheet" href="../assets/prototype-shell.css" />
<style>
  body { margin: 0; background: #f5f7fb; }
  .err-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .err-card {
    width: 520px; background: #fff; border: 1px solid var(--app-border-light);
    border-radius: var(--app-radius-base); box-shadow: var(--app-shadow-md); padding: 32px 32px 26px; text-align: center;
  }
  .err-code { font-size: 46px; font-weight: 700; color: var(--app-primary); line-height: 1; }
  .err-title { font-size: 18px; font-weight: 600; color: var(--app-text-primary); margin: 12px 0 8px; }
  .err-desc { font-size: 13px; color: var(--app-text-secondary); line-height: 1.8; text-align: left; }
  .err-actions { display: flex; gap: 8px; justify-content: center; margin-top: 20px; }
  .err-meta { margin-top: 16px; font-size: 12px; color: var(--app-text-secondary); text-align: left; }
</style>
</head>
<body>
<div id="page-root" data-page="PAGE-500" data-role="page" data-state="normal">
  <div class="err-wrap">
    <div class="err-card">
      <div class="err-code">500</div>
      <div class="err-title">服务异常，请稍后重试</div>
      <div class="err-desc">服务器处理请求时发生异常。<b>本次操作没有产生部分写入</b>：批量类写操作（导入 / 升班）都是异步任务，失败会整批记录失败原因，可在任务中心重试（<span class="mono">NFR-MQ-02</span>）。</div>
      <div class="err-actions">
        <button class="btn primary" data-role="action" data-action-id="ACT-ERR-004" data-component="el-button.primary"
                data-demo-toast="已重试上一个请求（原型演示）。" data-demo-toast-type="info">重试</button>
        <button class="btn" data-role="action" data-action-id="ACT-ERR-005" data-component="el-button"
                data-nav="PAGE-IMP-TASK-LIST">去异步任务中心</button>
        <button class="btn" data-role="action" data-action-id="ACT-ERR-001" data-component="el-button"
                data-demo-toast="已返回工作台首页（原型演示）。" data-demo-toast-type="info">返回工作台</button>
      </div>
      <div class="err-meta">请求编号 <span class="mono">REQ-20261001-000701</span> · 错误码 <span class="mono">EDU-SYS-5001</span> · 已自动上报（含请求编号、路径、用户与租户）</div>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';
  var host = document.createElement('div');
  host.className = 'toast-host';
  document.body.appendChild(host);
  function toast(message, type) {
    var node = document.createElement('div');
    node.className = 'toast ' + (type || 'info');
    node.textContent = message;
    host.appendChild(node);
    window.setTimeout(function () { node.remove(); }, 3600);
  }
  document.addEventListener('click', function (event) {
    var btn = event.target.closest('[data-demo-toast]');
    if (!btn) return;
    event.preventDefault();
    toast(btn.getAttribute('data-demo-toast'), btn.getAttribute('data-demo-toast-type') || 'info');
  });
})();
</script>
</body>
</html>
